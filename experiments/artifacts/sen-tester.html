<style>
  /* One square canvas: two kanji stacked on the left with every point, handle and
     coordinate, and the axes on the right as plain readouts that move with the animation.
     Light is a chartreuse square; dark is near black with cream letters. */
  :root {
    --page: #ffffff;
    --ground: #dcfa00;
    --ink: #1c1c1c;
    --body: #f6f4ea;
    --blue: #0030ff;
    --point: #ffffff;
    --tag: #ffffff;
    --tag-ink: #1c1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #000000; --ground: #0c0c0c; --ink: #efece2; --body: #efece2; --blue: #2f5bff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #000000; --ground: #0c0c0c; --ink: #efece2; --body: #efece2; --blue: #2f5bff; color-scheme: dark; }

  html, body { margin: 0; height: 100%; }
  body { background: var(--page); display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  #canvas { display: block; width: min(calc(100vw - 32px), calc(100vh - 32px)); height: auto; aspect-ratio: 1; }
</style>

<svg id="canvas" viewBox="0 0 1000 1000" role="img" aria-label="Two kanji, 龍 and 驚, drawn as single lines with their points and coordinates, while weight, width, corners and slant change"></svg>

  const DATA = {"龍":{"strokes":[{"closed":false,"joined":[false,true],"d":"M276 50L276 163"},{"closed":false,"joined":[false,false],"d":"M70 163L485 163"},{"closed":false,"joined":[false,false],"d":"M50 376L505 376"},{"closed":false,"joined":[true,true],"d":"M127 612L430.4 612"},{"closed":false,"joined":[true,true],"d":"M127 740L430.4 740"},{"closed":false,"joined":[false,false],"d":"M200.6 342.7L154.6 197.9"},{"closed":false,"joined":[false,false],"d":"M351.9 345.7L410.1 198.3"},{"closed":false,"joined":[true,false],"d":"M430.4 489L127 489L127 949"},{"closed":false,"joined":[false,false],"d":"M430.4 476L430.4 933.7L305.6 933.7"},{"closed":false,"joined":[true,false],"d":"M581 153L943 153"},{"closed":false,"joined":[true,false],"d":"M581.3 559L900 559"},{"closed":false,"joined":[true,false],"d":"M581.3 672L894 672"},{"closed":false,"joined":[true,false],"d":"M581.3 788L904 788"},{"closed":false,"joined":[false,true],"d":"M581 49L581 292"},{"closed":false,"joined":[false,false],"d":"M566 446L887 446L887 292L566 292"},{"closed":false,"joined":[true,false],"d":"M581.3 446L581.3 892.5C581.3 909.9 602.6 927.3 619 927.3L890.1 927.3C902.6 927.3 924.5 917.9 929 905.7L952.5 840.6"}]},"驚":{"strokes":[{"closed":false,"joined":[false,false],"d":"M66 113L538 113"},{"closed":false,"joined":[false,false],"d":"M210 49L210 168"},{"closed":false,"joined":[false,false],"d":"M395 49L395 168"},{"closed":false,"joined":[false,false],"d":"M64.2 298.5C109.1 262.3 140.8 218.5 180.7 161.8"},{"closed":false,"joined":[true,true],"d":"M481.5 206C382.4 206 182 207.3 141.8 215.6"},{"closed":false,"joined":[false,true],"d":"M944 154.5L606.4 154.5"},{"closed":false,"joined":[false,false],"d":"M345.5 415.6L433 415.6C479.2 415.6 481.6 228.8 481.6 193"},{"closed":false,"joined":[false,false],"d":"M521.2 267.9C579.8 195.3 619.5 140.4 665.3 58.6"},{"closed":false,"joined":[false,true],"d":"M516.4 412.4C598.6 412.4 789.1 302.1 824.1 226L857 154.5"},{"closed":false,"joined":[false,true],"d":"M953 422.1C80   // ———————————————————————————— vectors
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const mul = (a, k) => [a[0] * k, a[1] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const len = (a) => Math.hypot(a[0], a[1]);
  const unit = (a) => { const n = len(a) || 1; return [a[0] / n, a[1] / n]; };
  const dist = (a, b) => len(sub(a, b));
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const perp = (a) => [-a[1], a[0]];
  const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

  // ———————————————————————————— strokes as segments (lines and cubics)
  function parse(d) {
    const t = d.match(/[MLCZ]|-?\d+(?:\.\d+)?/g);
    const segs = [];
    let cur = null;
    let closed = false;
    for (let i = 0; i < t.length; ) {
      const c = t[i++];
      if (c === 'M') cur = [+t[i++], +t[i++]];
      else if (c === 'L') { const q = [+t[i++], +t[i++]]; segs.push({ c: false, p: [cur, q] }); cur = q; }
      else if (c === 'C') { const a = [+t[i++], +t[i++]]; const b = [+t[i++], +t[i++]]; const e = [+t[i++], +t[i++]]; segs.push({ c: true, p: [cur, a, b, e] }); cur = e; }
      else if (c === 'Z') closed = true;
    }
    return { segs, closed };
  }
  const bez = (p, t) => { const s = 1 - t; return add(add(mul(p[0], s * s * s), mul(p[1], 3 * s * s * t)), add(mul(p[2], 3 * s * t * t), mul(p[3], t * t * t))); };
  function split(p, t) {
    const a = lerp(p[0], p[1], t), b = lerp(p[1], p[2], t), c = lerp(p[2], p[3], t);
    const d = lerp(a, b, t), e = lerp(b, c, t), f = lerp(d, e, t);
    return [[p[0], a, d, f], [f, e, c, p[3]]];
  }
  function segLen(s) {
    if (!s.c) return dist(s.p[0], s.p[1]);
    let L = 0, prev = s.p[0];
    for (let k = 1; k <= 24; k++) { const q = bez(s.p, k / 24); L += dist(prev, q); prev = q; }
    return L;
  }
  /** Parameter at which the arc length from the start reaches `target`. */
  function paramAt(s, target) {
    let L = 0, prev = s.p[0];
    for (let k = 1; k <= 64; k++) {
      const q = bez(s.p, k / 64), step = dist(prev, q);
      if (L + step >= target) return (k - 1 + (target - L) / (step || 1)) / 64;
      L += step; prev = q;
    }
    return 1;
  }
  const startTan = (s) => unit(sub(s.c ? (dist(s.p[1], s.p[0]) > 0.5 ? s.p[1] : s.p[2]) : s.p[1], s.p[0]));
  const endTan = (s) => (s.c ? unit(sub(s.p[3], dist(s.p[2], s.p[3]) > 0.5 ? s.p[2] : s.p[1])) : unit(sub(s.p[1], s.p[0])));
  function trimEnd(s, t) {
    if (!s.c) return { ...s, p: [s.p[0], add(s.p[1], mul(unit(sub(s.p[0], s.p[1])), t))] };
    return { ...s, p: split(s.p, paramAt(s, segLen(s) - t))[0] };
  }
  function trimStart(s, t) {
    if (!s.c) return { ...s, p: [add(s.p[0], mul(unit(sub(s.p[1], s.p[0])), t)), s.p[1]] };
    return { ...s, p: split(s.p, paramAt(s, t))[1] };
  }

  /** The arc joining segment a's end to segment b's start, with both trimmed back. */
  function corner(s, nx, r) {
    const u = endTan(s), v = startTan(nx);
    const phi = Math.acos(Math.max(-1, Math.min(1, dot(u, v))));
    if (phi < (25 * Math.PI) / 180) return null; // only real corners
    const half = Math.tan(Math.min(phi, 3.0) / 2);
    const t = Math.min(r * half, segLen(s) * 0.48, segLen(nx) * 0.48);
    if (t < 10) return null; // too short to round without a crowd of points
    const rr = t / half;
    const a = trimEnd(s, t), b = trimStart(nx, t);
    const A = a.p.at(-1), B = b.p[0];
    const k = (4 / 3) * Math.tan(phi / 4) * rr;
    return { a, b, arc: { c: true, fillet: true, p: [A, add(A, mul(endTan(a), k)), sub(B, mul(startTan(b), k)), B] } };
  }

  /** Rounds every corner with a circular arc of radius r, written as one cubic. */
  function fillet(st, r) {
    if (!r) return st;
    const segs = st.segs.map((s) => ({ c: s.c, p: s.p.map((q) => q.slice()) }));
    const out = [];
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i], nx = segs[i + 1];
      if (!nx) { out.push(s); break; }
      const k = corner(s, nx, r);
      if (!k) { out.push(s); continue; }
      out.push(k.a, k.arc);
      segs[i + 1] = k.b;
    }
    // A closed path also turns where it closes.
    if (st.closed && out.length > 1) {
      const k = corner(out.at(-1), out[0], r);
      if (k) { out[out.length - 1] = k.a; out[0] = k.b; out.push(k.arc); }
    }
    return { ...st, segs: out };
  }

  const ptAt = (s, t) => (s.c ? bez(s.p, t) : lerp(s.p[0], s.p[1], t));
  const reverseSegs = (segs) => segs.slice().reverse().map((s) => ({ ...s, p: s.p.slice().reverse() }));
  function splitSeg(s, t) {
    if (s.c) { const [a, b] = split(s.p, t); return [{ c: true, p: a }, { c: true, p: b }]; }
    const m = lerp(s.p[0], s.p[1], t);
    return [{ c: false, p: [s.p[0], m] }, { c: false, p: [m, s.p[1]] }];
  }
  /** Where on a stroke a point lies: segment, parameter, distance, arc length from the start. */
  function locate(st, P, skip = () => false) {
    let best = null, acc = 0;
    st.segs.forEach((s, si) => {
      const n = s.c ? 48 : 64, L = segLen(s);
      for (let j = 0; j <= n; j++) {
        const t = j / n, at = acc + L * t;
        if (skip(at)) continue;
        const d = dist(ptAt(s, t), P);
        if (!best || d < best.d) best = { si, t, d, at };
      }
      acc += L;
    });
    return best && { ...best, total: acc };
  }
  function cutAt(st, si, t) {
    const [h, k] = splitSeg(st.segs[si], t);
    const head = [...st.segs.slice(0, si), h].filter((s) => segLen(s) > 0.5);
    const tail = [k, ...st.segs.slice(si + 1)].filter((s) => segLen(s) > 0.5);
    return [head, tail];
  }

  /**
   * Turns L-shaped meetings into corners. Where a stroke's joined end lands on another
   * stroke within `reach` of that stroke's end, the overshoot is cut and the two become
   * one path with a corner, which fillet() can round. A path that meets itself closes.
   */
  function mergeCorners(strokes, reach = 90) {
    let list = strokes.map((s) => ({ ...s }));
    for (let guard = 0; guard < 40; guard++) {
      let done = true;
      for (const A of list) {
        if (A.closed) continue;
        for (const atEnd of [false, true]) {
          const k = atEnd ? 1 : 0;
          if (!A.joined[k]) continue;
          const P = atEnd ? A.segs.at(-1).p.at(-1) : A.segs[0].p[0];
          // Meeting itself: the far end of the same path, near its end.
          const own = locate(A, P, (at) => (atEnd ? at > segTotal(A) - 60 : at < 60));
          if (own && own.d < 10 && segTotal(A) > 300 && !(atEnd ? A.segs.at(-1).c : A.segs[0].c)) {
            const far = atEnd ? own.at : own.total - own.at;
            if (far < reach) {
              // The end lands near the start (or the start near the end): drop the overshoot, close the loop.
              const [head, tail] = cutAt(A, own.si, own.t);
              A.segs = atEnd ? tail : head;
              A.closed = true;
              A.joined = [false, false];
              done = false;
              break;
            }
          }
          let best = null;
          for (const B of list) {
            if (B === A || B.closed) continue;
            const l = locate(B, P);
            if (l && l.d < 10 && (!best || l.d < best.l.d)) best = { B, l };
          }
          if (!best) continue;
          const { B, l } = best;
          const nearStart = l.at < l.total - l.at;
          if (Math.min(l.at, l.total - l.at) > reach) continue;
          // Only an L of two real strokes, running within 20° of square where they meet,
          // becomes a corner (a dot touching a bar, or a diagonal, stays apart).
          if (segTotal(A) < 60 || segTotal(B) < 60) continue;
          const aSeg = atEnd ? A.segs.at(-1) : A.segs[0];
          const da = atEnd ? endTan(aSeg) : startTan(aSeg);
          const db = startTan(splitSeg(B.segs[l.si], Math.min(0.999, Math.max(0.001, l.t)))[1]);
          if (Math.abs(dot(da, db)) > Math.cos((70 * Math.PI) / 180)) continue;
          const [head, tail] = cutAt(B, l.si, l.t);
          const keep = nearStart ? tail : reverseSegs(head);
          const aSegs = atEnd ? A.segs : reverseSegs(A.segs);
          const merged = { segs: [...aSegs, ...keep], closed: false, joined: [atEnd ? A.joined[0] : A.joined[1], nearStart ? B.joined[1] : B.joined[0]] };
          list = [...list.filter((s) => s !== A && s !== B), merged];
          done = false;
          break;
        }
        if (!done) break;
      }
      if (done) break;
    }
    return list;
  }
  const segTotal = (st) => st.segs.reduce((t, s) => t + segLen(s), 0);


  

  const PAIR = ['龍', '驚'];
  const AXES = [
    { key: 'weight', label: 'Weight', min: 8, max: 110, show: (v) => `${Math.round(v)}` },
    { key: 'width', label: 'Width', min: 75, max: 200, show: (v) => `${Math.round(v)}%` },
    { key: 'corners', label: 'Corners', min: 0, max: 130, show: (v) => `${Math.round(v)}` },
    { key: 'slant', label: 'Slant', min: 0, max: 26, show: (v) => `${v.toFixed(1)}°` },
  ];
  const state = { weight: 46, width: 100, corners: 40, slant: 0 };

  // Mergers don't depend on the axes, so each kanji's paths are merged once.
  const merged = {};
  const mergedOf = (ch) => (merged[ch] ??= mergeCorners(DATA[ch].strokes.map((s) => ({ ...parse(s.d), joined: s.joined.slice() }))));

  /** The kanji's paths at the current width and slant (an affine map, exact on cubics), then rounded. */
  function strokesAt(ch) {
    const sw = state.width / 100, sh = Math.tan((state.slant * Math.PI) / 180);
    const map = (q) => [500 + (q[0] - 500) * sw + (500 - q[1]) * sh, q[1]];
    return mergedOf(ch).map((st) => fillet({ ...st, segs: st.segs.map((s) => ({ c: s.c, p: s.p.map(map) })) }, state.corners));
  }

  // ———————————————————————————— the canvas, in units of the square
  const G = 385;              // each kanji's em
  const CX = 392;             // the column's centre; over the whole animation the ink stays within x 24 to 760
  const OX = CX - G / 2;      // the column's left edge
  const OY = (1000 - 2 * G) / 2;
  const S = G / 1000;
  const px = (q, k) => [OX + q[0] * S, OY + k * G + q[1] * S];
  const P = (q, k) => { const p = px(q, k); return `${p[0].toFixed(1)} ${p[1].toFixed(1)}`; };
  const MONO = 'JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace';
  const SANS = 'Inter Tight, system-ui, -apple-system, sans-serif';

  const canvas = document.getElementById('canvas');
  let shown = new Map(); // tag key → side, kept from frame to frame so tags hold still

  function render() {
    const W = state.weight * S, e = 1.1;
    let body = '', inner = '', centre = '', handles = '', offs = '', ons = '';
    const tags = []; // { key, x, y, q, pri }
    PAIR.forEach((ch, k) => {
      strokesAt(ch).forEach((st, si) => {
        const segs = st.segs;
        const d = (list, closed) => {
          let out = `M${P(list[0].p[0], k)}`;
          for (const sg of list) out += sg.c ? `C${P(sg.p[1], k)} ${P(sg.p[2], k)} ${P(sg.p[3], k)}` : `L${P(sg.p[1], k)}`;
          return closed ? `${out}Z` : out;
        };
        const full = d(segs, st.closed);
        body += `<path d="${full}"/>`;
        centre += full;
        // The inside of the edge: free flat ends drawn back by the edge's width.
        let inSegs = segs;
        if (!st.closed) {
          const t = e / S;
          inSegs = segs.slice();
          if (!st.joined[0] && segLen(inSegs[0]) > t * 2) inSegs[0] = trimStart(inSegs[0], t);
          if (!st.joined[1] && segLen(inSegs.at(-1)) > t * 2) inSegs[inSegs.length - 1] = trimEnd(inSegs.at(-1), t);
        }
        inner += `<path d="${d(inSegs, st.closed)}"/>`;
        segs.forEach((sg, j) => {
          if (!sg.c) return;
          handles += `M${P(sg.p[0], k)}L${P(sg.p[1], k)}M${P(sg.p[3], k)}L${P(sg.p[2], k)}`;
          [sg.p[1], sg.p[2]].forEach((hq, h) => {
            const p = px(hq, k);
            offs += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4"/>`;
            tags.push({ key: `${k}.${si}.h${j}.${h}`, x: p[0], y: p[1], q: hq, pri: 1 });
          });
        });
        const nodes = [segs[0].p[0], ...segs.map((sg) => sg.p.at(-1))];
        const count = st.closed ? nodes.length - 1 : nodes.length;
        for (let i = 0; i < count; i++) {
          const before = i > 0 ? segs[i - 1] : st.closed ? segs.at(-1) : null;
          const after = i < segs.length ? segs[i] : st.closed ? segs[0] : null;
          const smooth = before && after && dot(endTan(before), startTan(after)) > Math.cos((3 * Math.PI) / 180);
          const p = px(nodes[i], k);
          ons += smooth
            ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`
            : `<rect x="${(p[0] - 2.8).toFixed(1)}" y="${(p[1] - 2.8).toFixed(1)}" width="5.6" height="5.6"/>`;
          tags.push({ key: `${k}.${si}.n${i}`, x: p[0], y: p[1], q: nodes[i], pri: 0 });
        }
      });
    });

    const attrs = 'fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"';
    canvas.innerHTML =
      `<rect width="1000" height="1000" fill="var(--ground)"/>` +
      `<g ${attrs} stroke="var(--blue)" stroke-width="${W.toFixed(2)}">${body}</g>` +
      `<g ${attrs} stroke="var(--body)" stroke-width="${Math.max(0, W - 2 * e).toFixed(2)}">${inner}</g>` +
      `<path d="${centre}" fill="none" stroke="var(--blue)" stroke-width="0.9"/>` +
      `<path d="${handles}" fill="none" stroke="var(--blue)" stroke-width="0.9"/>` +
      `<g fill="var(--blue)">${offs}</g>` +
      `<g fill="var(--point)" stroke="var(--blue)" stroke-width="0.9">${ons}</g>` +
      labels(tags) +
      readouts();
  }

  /**
   * Coordinates in Noto's units (x across, y up from the baseline) as tags beside their
   * points, on both kanji at once. A tag keeps its side from the last frame while it
   * stays clear; then points before handles; a tag that would cover another is left out.
   */
  function labels(tags) {
    const CH = 5.6, TH = 12.5, placed = [], next = new Map();
    const clear = (sx, sy, tw) => sx > 4 && sy > 4 && sx + tw < 775 && sy + TH < 996 &&
      !placed.some(([x, y, w]) => sx < x + w + 1.5 && sx + tw + 1.5 > x && sy < y + TH + 1.5 && sy + TH + 1.5 > y);
    tags.sort((a, b) => (shown.has(b.key) - shown.has(a.key)) || a.pri - b.pri);
    let out = '';
    for (const t of tags) {
      const text = `${Math.round(t.q[0])}.${Math.round(880 - t.q[1])}`;
      const tw = text.length * CH + 5;
      const sides = [[5, -TH - 3], [5, 3], [-tw - 5, -TH - 3], [-tw - 5, 3]];
      const prev = shown.get(t.key);
      const order = prev != null ? [prev, 0, 1, 2, 3].filter((v, i, a) => a.indexOf(v) === i) : [0, 1, 2, 3];
      const side = order.find((i) => clear(t.x + sides[i][0], t.y + sides[i][1], tw));
      if (side == null) continue;
      const sx = t.x + sides[side][0], sy = t.y + sides[side][1];
      placed.push([sx, sy, tw]);
      next.set(t.key, side);
      out += `<g transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><rect width="${tw.toFixed(1)}" height="${TH}" fill="var(--tag)"/><text x="2.5" y="9.3" fill="var(--tag-ink)" font-family="${MONO}" font-size="9.3">${text}</text></g>`;
    }
    shown = next;
    return out;
  }

  /** The axes as readouts: name and value over a hairline track with a square marker. No plate. */
  function readouts() {
    const x0 = 795, x1 = 960, gap = 92;
    const y0 = 500 - ((AXES.length - 1) * gap) / 2;
    return AXES.map((a, i) => {
      const y = y0 + i * gap;
      const f = (state[a.key] - a.min) / (a.max - a.min);
      const mx = x0 + f * (x1 - x0);
      return `<text x="${x0}" y="${y - 16}" fill="var(--ink)" font-family="${SANS}" font-size="15">${a.label}</text>` +
        `<text x="${x1}" y="${y - 16}" fill="var(--ink)" font-family="${MONO}" font-size="13" text-anchor="end">${a.show(state[a.key])}</text>` +
        `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1"/>` +
        `<rect x="${(mx - 5).toFixed(1)}" y="${y - 5}" width="10" height="10" fill="var(--ink)"/>`;
    }).join('');
  }

  // ———————————————————————————— motion: each axis swings on its own period
  const wave = (t, period, phase) => 0.5 - 0.5 * Math.cos((2 * Math.PI * t) / period + phase);
  function at(t) {
    state.weight = 8 + 102 * wave(t, 6.4, 0.9);
    const u = wave(t, 10.2, 2.4);
    state.width = 75 + 125 * u;
    state.corners = 130 * wave(t, 8.2, 1.3);
    // Slant gives way as the letters widen, so the widest never runs into the readouts.
    state.slant = 26 * wave(t, 12.6, 0) * Math.min(1, (1 - u) * 1.6);
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0;
  const t0 = performance.now();
  function frame(now) { at((now - t0) / 1000); render(); raf = requestAnimationFrame(frame); }
  function start() {
    cancelAnimationFrame(raf);
    if (still.matches) { at(3.2); render(); } else raf = requestAnimationFrame(frame);
  }
  still.addEventListener('change', start);
  start();
</script>
