<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Sen curves — check sheet</title>
    <style>
      body { margin: 12px; background: #fff; font: 11px ui-monospace, monospace; }
      .row { display: flex; gap: 6px; margin-bottom: 6px; }
      svg { background: #f2f2f2; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module">
      // Checking sheet, not part of the piece: Noto Thin's outline (pale) with the fitted
      // centrelines and their end points, then the strokes at three weights, flat ends.
      import base from './noto-strokes.json';
      import extra from './noto-specimen.json';
      const data = { ...base, ...extra };
      const q = new URLSearchParams(location.search);
      const chars = q.get('chars') ? [...q.get('chars')] : Object.keys(data);
      const size = Number(q.get('size') ?? 110);
      const weights = (q.get('w') ?? '30,80,140').split(',').map(Number);
      const per = Number(q.get('per') ?? 2);
      const out = document.getElementById('out');
      let row;
      chars.forEach((ch, i) => {
        if (i % per === 0) (row = document.createElement('div')), (row.className = 'row'), out.append(row);
        const g = data[ch];
        if (!g) return;
        const svg = (inner) => `<svg width="${size}" height="${size}" viewBox="0 0 1000 1000">${inner}</svg>`;
        const lines = g.strokes.map((s) => `<path d="${s.d}" fill="none" stroke="#d22" stroke-width="5"/>`).join('');
        const dots = g.strokes
          .map((s) => {
            const n = s.d.match(/-?\d+(\.\d+)?/g).map(Number);
            const ends = [[n[0], n[1]], [n.at(-2), n.at(-1)]];
            return ends.map(([x, y], k) => `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" fill="${s.joined[k] ? '#16f' : '#d22'}"/>`).join('');
          })
          .join('');
        row.insertAdjacentHTML('beforeend', svg(`<path d="${g.outline}" fill="#c9c9c9"/>${lines}${dots}`));
        for (const w of weights)
          row.insertAdjacentHTML(
            'beforeend',
            svg(g.strokes.map((s) => `<path d="${s.d}" fill="none" stroke="#111" stroke-width="${w}" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"/>`).join('')),
          );
        row.insertAdjacentHTML('beforeend', '<span style="width:24px"></span>');
      });
    </script>
  </body>
</html>
