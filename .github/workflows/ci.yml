# Area's checks on every pull request and on main: the package build (which also lints every icon),
# typecheck, token and contrast tests, manifest contracts, icon and React tests, the desktop app's
# build and playground mapping, and a consumer install of the built packages. See docs/DEVELOPMENT.md.
# The token and contrast tests sweep every setting position (tens of thousands of cases, about 20 minutes on a
# runner), so they run as their own job beside the others rather than inside the other job's time limit.
# The browser jobs (behaviour suites, rendered checks at the defaults and at the settings corners) and the output job
# (`area check`) run when CSS, tokens, React, the app or the checks themselves change (the `changes` job), and always
# on main and on a manual run. They drive headless Microsoft Edge, installed from Microsoft's stable channel, and only
# ever as a guest with implicit sign-in off (scripts/rendered/cdp-lib.mjs and tests/behaviour/harness.mjs refuse
# otherwise). Each runs its captures one at a time: parallel captures starve a machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tokens:
    name: Token, axis and contrast tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Token, axis and contrast tests
        run: npm test

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The checks never open the Electron window, so skip its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build packages (tokens, styles, React, icons with icon lint)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Manifest contracts
        run: npm run test:contracts

      - name: Icon tests
        run: npm run test:icons

      - name: React tests
        run: node --test packages/react/tests/*.test.mjs

      - name: Desktop app tests (places, tiles, chat, app look)
        run: npm run test:desktop

      - name: Desktop app build, playground mapping and documentation entries
        run: |
          npm run build -w @area/desktop
          npm run check:playgrounds -w @area/desktop
          npm run check:docs -w @area/desktop
          npm run check:app-css -w @area/desktop

      - name: Consumer install
        run: npm run test:consumer

      - name: Build leaves tracked files unchanged
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short --untracked-files=no
            git diff --stat
            echo "A build step changed tracked files: regenerate locally and commit the result."
            exit 1
          fi

  # Which of the path-filtered jobs a pull request needs: the files it changes against its base.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      output: ${{ steps.filter.outputs.output }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "output=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          echo "$changed"
          # Component CSS, tokens, React, icons, the app (its gallery and demos), the checks and the lockfile.
          if echo "$changed" | grep -Eq '^(packages/(tokens|styles|react|icons)/|apps/desktop/|scripts/rendered/|tests/behaviour/|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq '^(packages/|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "output=true" >> "$GITHUB_OUTPUT"
          else
            echo "output=false" >> "$GITHUB_OUTPUT"
          fi

  behaviour:
    name: Behaviour suites (headless Edge)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Microsoft Edge (stable)
        run: |
          if ! command -v microsoft-edge-stable >/dev/null; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update
            sudo apt-get install -y microsoft-edge-stable
          fi
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "AREA_BEHAVIOUR_EDGE=$(command -v microsoft-edge-stable)" >> "$GITHUB_ENV"
          microsoft-edge-stable --version

      - name: Build packages
        run: npm run build

      - name: Behaviour suites
        run: npm run test:behaviour

  rendered:
    name: Rendered checks (defaults, every family)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          node -e "require.resolve('sharp')" || npm install --no-save --no-audit --no-fund sharp

      - name: Microsoft Edge (stable)
        run: |
          if ! command -v microsoft-edge-stable >/dev/null; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update
            sudo apt-get install -y microsoft-edge-stable
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "AREA_RENDERED_BROWSER=$(command -v microsoft-edge-stable)" >> "$GITHUB_ENV"
          microsoft-edge-stable --version

      - name: Build packages and the desktop app
        run: |
          npm run build
          npm run build -w @area/desktop

      - name: check:rendered (defaults, every family)
        run: npm run check:rendered

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-defaults
          path: .cache/rendered/check/report.json
          if-no-files-found: ignore

  rendered-corners:
    name: Rendered checks (settings corners, fast subset)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          node -e "require.resolve('sharp')" || npm install --no-save --no-audit --no-fund sharp

      - name: Microsoft Edge (stable)
        run: |
          if ! command -v microsoft-edge-stable >/dev/null; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update
            sudo apt-get install -y microsoft-edge-stable
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "AREA_RENDERED_BROWSER=$(command -v microsoft-edge-stable)" >> "$GITHUB_ENV"
          microsoft-edge-stable --version

      - name: Build packages and the desktop app
        run: |
          npm run build
          npm run build -w @area/desktop

      # The defaults run in full in the rendered job, so they are left out here.
      - name: check:rendered:corners (fast subset, one corner at a time)
        run: npm run check:rendered:corners -- --fast --skip defaults

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-corners
          path: .cache/rendered/corners/*/report.json
          if-no-files-found: ignore

  output:
    name: Output (area init, build and check)
    needs: changes
    if: needs.changes.outputs.output == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run build

      - name: Output tests
        run: npm run test:output

      # The repository holds no system the app saved, so `area check` runs on the starter system (Area's defaults)
      # written out by `area init` and `area build`: a file that keeps to the system passes, one that does not fails.
      - name: area check on the starter system
        run: |
          area="$GITHUB_WORKSPACE/packages/output/bin/area.mjs"
          dir="$(mktemp -d)"
          cd "$dir"
          node "$area" init --name Starter
          node "$area" build
          printf '.ok { color: var(--area-fg-accent); padding: var(--area-space-4); }\n' > good.css
          printf '.bad { color: #123456; padding: 13px; }\n' > bad.css
          node "$area" check good.css
          if node "$area" check bad.css; then
            echo "area check passed a file with a literal colour and length"
            exit 1
          fi
