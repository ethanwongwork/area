function renderSeparator() {
  var o = [];
  o.push("<div class=group-gap></div><h2 class=h-group id=comp-separator>Separator</h2><p class=desc>Separator divides content with a single hairline so related groups read as distinct.</p>");

  function variantBlock(id, title, preview, code) {
    return titledFrame(id, title, preview, code);
  }

  o.push(titledFrame(
    "comp-sep-default",
    "Default",
    "<div style=\"width:220px\">" + separatorEl() + "</div>",
    "&lt;Separator /&gt;"
  ));

  // Horizontal — content-width (default). Wrap in a padded surface so the inset
  // behavior is visible: width:100% naturally resolves to (parent − 2×padding),
  // putting the line at the same indent as the surrounding text.
  o.push(variantBlock(
    "comp-sep-horizontal",
    "Horizontal",
    "<div style=\"width:280px;padding:var(--space-l,16px);background:var(--color-surface-default);border:1px solid var(--color-border-subtle);border-radius:var(--radius-m,16px);display:flex;flex-direction:column;gap:var(--space-m,12px);color:var(--color-text-primary);font:400 14px/20px var(--font)\"><div>Section 1</div>" + separatorEl() + "<div>Section 2</div></div>",
    "&lt;Separator /&gt;"
  ));

  o.push(variantBlock(
    "comp-sep-vertical",
    "Vertical",
    "<div style=\"display:inline-flex;align-items:center;gap:var(--space-m,12px);height:24px;color:var(--color-text-primary);font:400 14px/20px var(--font)\"><span>1</span>" + separatorEl({vertical:true}) + "<span>2</span>" + separatorEl({vertical:true}) + "<span>3</span></div>",
    "&lt;Separator orientation=\"vertical\" /&gt;"
  ));

  o.push(variantBlock(
    "comp-sep-labeled",
    "Labeled",
    "<div style=\"width:220px\">" + separatorEl({label:"Label"}) + "</div>",
    "&lt;Separator label=\"Label\" /&gt;"
  ));

  // Full-bleed (in panel) — escapes the panel's padding via negative horizontal
  // margin to reach the inner border edges. Mirrors the production pattern in
  // Dropdown (.ds-menu__separator) and Select panel (.ds-select-panel__separator).
  // Demo uses real .ds-menu chrome so the visual is authentic, not re-implemented.
  // Per §9.14.1: panel surfaces use full-bleed because the divider communicates a
  // hard structural break between row groups, matching the harder semantic of
  // grouped lists. Inset would look weak/timid in this context.
  o.push(variantBlock(
    "comp-sep-full-bleed",
    "Full-bleed (in panel)",
    "<div class=\"ds-menu\" style=\"min-width:200px;position:static\" role=\"menu\">"
      + "<div class=\"ds-menu__item\" role=\"menuitem\"><span class=\"ds-menu__label\">Item 1</span></div>"
      + "<div class=\"ds-menu__item\" role=\"menuitem\"><span class=\"ds-menu__label\">Item 2</span></div>"
      + "<div class=\"ds-menu__separator\" role=\"separator\" aria-orientation=\"horizontal\"></div>"
      + "<div class=\"ds-menu__item\" role=\"menuitem\"><span class=\"ds-menu__label\">Item 3</span></div>"
      + "<div class=\"ds-menu__item\" role=\"menuitem\"><span class=\"ds-menu__label\">Item 4</span></div>"
    + "</div>",
    "&lt;Menu&gt;\n  &lt;Menu.Item&gt;Item 1&lt;/Menu.Item&gt;\n  &lt;Menu.Item&gt;Item 2&lt;/Menu.Item&gt;\n  &lt;Menu.Separator /&gt;\n  &lt;Menu.Item&gt;Item 3&lt;/Menu.Item&gt;\n  &lt;Menu.Item&gt;Item 4&lt;/Menu.Item&gt;\n&lt;/Menu&gt;"
  ));

  return o.join("");
}

// ─── Card ──────────────────────────────────────────────────────────────
function cardEl(opts) {
  opts = opts || {};
  var cls = "ds-card";
  if (opts.tone === "secondary") cls += " ds-card--secondary";
  else if (opts.tone === "tertiary") cls += " ds-card--tertiary";
  if (opts.horizontal) cls += " ds-card--horizontal";

  var mediaHtml = "";
  if (opts.media === true) {
    mediaHtml = "<div class=\"ds-card__media\" aria-hidden=\"true\">" + ICON_IMAGE + "</div>";
  } else if (typeof opts.media === "string" && opts.media) {
    mediaHtml = "<div class=\"ds-card__media\">" + opts.media + "</div>";
  }

  // Badge slot — renders as a standalone row between media and header.
  // Pass badge as a raw HTML string (typically badgeEl() output).
  var badgeHtml = "";
  if (opts.badge) {
    badgeHtml = "<div class=\"ds-card__badge\">" + opts.badge + "</div>";
  }

  var hasHeader = opts.title || opts.description || opts.avatar;
  var headerHtml = "";
  if (hasHeader) {
    var avatarHtml = opts.avatar ? "<div class=\"ds-card__avatar\">" + opts.avatar + "</div>" : "";
    var titleHtml = opts.title ? "<div class=\"ds-card__title\">" + esc(String(opts.title)) + "</div>" : "";
    // Inline badge — wraps title + badge in a row so the badge sits to the right of the title.
    if (opts.inlineBadge && opts.title) {
      titleHtml = "<div class=\"ds-card__title-row\">"
        + "<div class=\"ds-card__title\">" + esc(String(opts.title)) + "</div>"
        + opts.inlineBadge
        + "</div>";
    }
    var descHtml = opts.description ? "<div class=\"ds-card__description\">" + esc(String(opts.description)) + "</div>" : "";
    headerHtml = "<div class=\"ds-card__header\">" + avatarHtml + "<div class=\"ds-card__header-text\">" + titleHtml + descHtml + "</div></div>";
  }

  var bodyHtml = "";
  if (opts.body) {
    bodyHtml = "<div class=\"ds-card__body\">" + (opts.bodyHtml ? opts.body : esc(String(opts.body))) + "</div>";
  }

  var footerHtml = "";
  if (opts.footerStart || opts.footerEnd) {
    var startGroup = "<div class=\"ds-card__footer-group\">" + (opts.footerStart || "") + "</div>";
    var endGroup = "<div class=\"ds-card__footer-group\">" + (opts.footerEnd || "") + "</div>";
    footerHtml = "<div class=\"ds-card__footer ds-card__footer--split\">" + startGroup + endGroup + "</div>";
  } else if (opts.footer) {
    var footerCls = "ds-card__footer";
    if (opts.footerStretch) footerCls += " ds-card__footer--stretch";
    footerHtml = "<div class=\"" + footerCls + "\">" + opts.footer + "</div>";
  }

  // Horizontal layout wraps non-media content in a .ds-card__content column
  var inner = mediaHtml;
  var content = badgeHtml + headerHtml + bodyHtml + footerHtml;
  if (opts.horizontal) {
    inner += "<div class=\"ds-card__content\">" + content + "</div>";
  } else {
    inner += content;
  }

  return "<div class=\"" + cls + "\">" + inner + "</div>";
}

/* composerEl — §9.28 Composer
   Builds a contained "AI chat input" surface with two layouts:
   - "double" (default): textarea on top, leading + trailing clusters on a control row below
   - "single": leading cluster + single-line input + trailing cluster in one row
   Trailing area is rendered in fixed canonical order — trailing buttons → dropdown → primary.
   Each cluster item is a button props object (fill / icon / ariaLabel / iconOnly); dropdown is
   a Select props object; primary defaults to solid-brand icon-only with ICON_ARROWUP.

  Sizes (opts.size):
  - "s" (compact tier): Button + Select at S (28-tall), outer radius-s (12), pad space-xs (6).
    Borderline-strict concentric corners (8+6=14 → 12, spread 4).
  - "m" (default, dense tier): Button + Select at M (32-tall), outer radius-m (16), pad
    space-xs (6). Strict-regime concentric corners (10+6=16 exact). Surface family: Toast/Banner.
  - "l" (spacious tier): Button + Select at L (40-tall), outer radius-l (20), pad space-s (8).
    Soft-regime concentric corners (14+8=22 → 20, spread 6, sanctioned per §2.1.2). Surface
    family: Dialog/Card.
  All inner Buttons + the optional Select track the chosen tier in lockstep so the cluster
  reads as one harmonious 28/32/40-tall band peer to the dropdown picker.

  Textarea behavior: defaults to 1 row at rest (rows="1" + min-height CSS); field-sizing:
  content auto-grows up to --cmp-text-max-rows × line-height (default 6 rows headroom).
  __field padding is layout-conditional (May 2026):
  - --single: 0/0 default. Input has an explicit control-height that visually fills the row,
    so surface --cmp-pad + control-h + --cmp-pad provides all the text breathing. Row resolves
    cleanly to S: 40, M: 44, L: 56.
  - --double: 2V/4H (space-3xs / space-2xs) added via layout-scoped override. Banner-style
    case-B asymmetric breathing — the double-row textarea has no control filling the row
    (auto-grows from 1 line) so without inward padding the text reads flush against the
    surface chrome. Same 2V/4H rule used by banner's __body (§9.10 + §6.1.5), uniform across
    all tiers because composer text is uniform 14/20 at S/M/L.
  Leading/trailing button clusters (siblings of __field, not children) keep corner-symmetric
  inset to the outer surface — the §6.1.2 priority rule applied at row scope: hard-edged
  controls own their corners, text owns its own padding stack via the outer pad + cluster gap.
  The two tokens --cmp-text-py / --cmp-text-px remain in the cascade so consumers can dial
  inward breathing per use case without losing the per-tier scale.

   The Composer's outer surface owns all chrome, so the inner Button / Select / Textarea are
   chrome-shed via descendant CSS — see .ds-composer .ds-btn / .ds-select rules in the spec.
*/
function composerEl(opts) {
  opts = opts || {};
  var layout = opts.layout === "single" ? "single" : "double";
  // Size tier: "s" (compact, Button S 28-tall), "m" (default — dense, Button M 32-tall), or
  // "l" (spacious, Button L 40-tall). Inner Buttons + Select track this tier in lockstep so
  // the cluster reads as one harmonious band. Per §9.28: S radius-s (12), M radius-m (16),
  // L radius-l (20) outer.
  var size = opts.size === "s" ? "s" : (opts.size === "l" ? "l" : "m");
  var btnSize = size;

  var cls = "ds-composer ds-composer--" + layout;
  if (size === "s") cls += " ds-composer--s";
  else if (size === "l") cls += " ds-composer--l";
  if (opts.disabled) cls += " is-disabled";
  if (opts.focused) cls += " is-focused";
  if (opts.error) cls += " is-error";

  function clusterBtns(items) {
    if (!items || !items.length) return "";
    var out = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      var fill = it.fill || "ghost-neutral";
      var btnCls = "ds-btn ds-btn--" + fill + " ds-btn--" + btnSize;
      if (it.iconOnly !== false && !it.label) btnCls += " ds-btn--icon-only";
      var ariaLabel = it.ariaLabel ? " aria-label=\"" + escAttr(it.ariaLabel) + "\"" : "";
      var iconHtml = it.icon ? "<span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + it.icon + "</span>" : "";
      var labelHtml = it.label ? "<span class=\"ds-btn__label\">" + esc(it.label) + "</span>" : "";
      out += "<button type=\"button\" class=\"" + btnCls + "\"" + ariaLabel + ">" + iconHtml + labelHtml + "</button>";
    }
    return out;
  }

  var leadingHtml = clusterBtns(opts.leading);
  var trailingBtns = clusterBtns(opts.trailing);

  var dropdownHtml = "";
  if (opts.dropdown) {
    var dOpts = {};
    for (var k in opts.dropdown) if (Object.prototype.hasOwnProperty.call(opts.dropdown, k)) dOpts[k] = opts.dropdown[k];
    if (!dOpts.size) dOpts.size = btnSize;
    dropdownHtml = selectEl(dOpts);
  }

  var primaryOpts = opts.primary || {};
  var primaryFill = primaryOpts.fill || "solid-brand";
  var primaryIcon = primaryOpts.icon || ICON_ARROWUP;
  var primaryAriaLabel = primaryOpts.ariaLabel || "Send";
  var primaryHtml = "<button type=\"button\" class=\"ds-btn ds-btn--" + primaryFill + " ds-btn--" + btnSize + " ds-btn--icon-only\" aria-label=\"" + escAttr(primaryAriaLabel) + "\">"
    + "<span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + primaryIcon + "</span>"
    + "</button>";

  var trailingArea = "<div class=\"ds-composer__cluster ds-composer__cluster--trailing\">"
    + trailingBtns + dropdownHtml + primaryHtml
    + "</div>";
  var leadingArea = "<div class=\"ds-composer__cluster ds-composer__cluster--leading\">"
    + leadingHtml
    + "</div>";

  var placeholder = opts.placeholder != null ? String(opts.placeholder) : "";
  var value = opts.value != null ? String(opts.value) : "";
  var disabledAttr = opts.disabled ? " disabled" : "";

  if (layout === "single") {
    var inputHtml = "<input type=\"text\" class=\"ds-composer__input\" placeholder=\""
      + escAttr(placeholder) + "\" value=\"" + escAttr(value) + "\" aria-label=\"Message\""
      + disabledAttr + ">";
    return "<div class=\"" + cls + "\">"
      + leadingArea
      + "<div class=\"ds-composer__field\">" + inputHtml + "</div>"
      + trailingArea
      + "</div>";
  }

  // Double layout: textarea defaults to rows="1" (single-row at rest per user directive);
  // field-sizing:content auto-grows up to --cmp-text-max-rows. The rows attr is the
  // fallback floor for browsers without field-sizing support (anything pre-Chrome 133 /
  // pre-Safari 18.2 falls back to the rows=1 floor + min-height CSS).
  var textareaHtml = "<textarea class=\"ds-composer__textarea\" placeholder=\""
    + escAttr(placeholder) + "\" aria-label=\"Message\"" + disabledAttr + " rows=\"1\">"
    + esc(value) + "</textarea>";
  return "<div class=\"" + cls + "\">"
    + "<div class=\"ds-composer__field\">" + textareaHtml + "</div>"
    + "<div class=\"ds-composer__row\">"
      + leadingArea
      + trailingArea
    + "</div>"
    + "</div>";
}

function renderCard() {
  var o = [];
  o.push("<div class=group-gap></div><h2 class=h-group id=comp-card>Card</h2><p class=desc>Card groups related content into a contained surface with optional header, body, and footer regions.</p>");

  function variantBlock(id, title, preview, code) {
    return titledFrame(id, title, preview, code);
  }

  // ── Shared placeholder content ──
  //
  // The Card baseline (`baseCard()`) is the absolute minimum: just a title. Each variant
  // below layers in only the slot it's demonstrating (Header = title only, Body = title +
  // body, Footer = title + body + actions). Variants don't chain — Header doesn't include
  // body, Body doesn't include footer — so the slot-level choices are inspectable in
  // isolation. The Default preview at the top of the page combines all four slots (media
  // + title + body + footer) so consumers see the full anatomy up-front.
  //
  // Footer buttons are S-tier (28-tall) — the system's "compact card-class notification
  // surface" tier shared with Dialog / Toast / Banner footer rows. Figma 295-672 shipped
  // M-tier (32-tall) but a 1:1 implementation read as overcrowded in the 264-square shell
  // (4 distinct elements — 2 icons + 2 labels — in a 32-tall row). The S-tier departure
  // is the system's deliberate calmer choice; per §5.1.1, hierarchy comes from size +
  // color + surface, never from making every element bigger.
  //
  // Both buttons use ICON_CIRCLE per Standing Rule #8 (universal neutral placeholder).
  // Rightmost = Primary (solid-brand), leftmost = Secondary (soft-neutral) — same
  // primary/secondary hierarchy every other 2-button row in the system uses (Dialog
  // footer, Toast footer, Banner action row).
  var actionRow = btnB("soft-neutral","s",ICON_CIRCLE,"Button") + btnB("solid-brand","s",ICON_CIRCLE,"Button");

  // baseCard(overrides) — minimal Card opts builder. Returns an opts object for cardEl();
  // pass overrides to demonstrate slot-level deviations per variant. The baseline is
  // INTENTIONALLY MINIMAL so each variant block can layer in just the one slot it's
  // showcasing; the Default preview at the top of the page combines all slots so the
  // full anatomy is visible.
  function baseCard(overrides) {
    var base = { title: "Title" };
    if (overrides) for (var k in overrides) base[k] = overrides[k];
    return base;
  }

  // ── Default — full anatomy ──
  //
  // Every Card demo on the page renders inside a fixed 264×264 square wrapper so variants
  // are directly comparable. Width 264 is the largest that fits 3 Tones cards within the
  // comp-frame's ~870px inner content area at the canonical 32px frame gap (264*3 +
  // 32*2 = 856 ≤ 870). Square aligns with gallery / dashboard tile / settings-card
  // patterns.
  //
  // The Default preview shows ALL four slots — media, title, body, footer — so the
  // canonical anatomy is visible up-front. The variant blocks below isolate each slot
  // family so the slot-level decisions are individually inspectable.
  o.push(titledFrame(
    "comp-card-default",
    "Default",
    "<div style=\"width:264px;height:264px\">" + cardEl(baseCard({media:true, body:"Body", footer:actionRow, footerStretch:true})) + "</div>",
    "&lt;Card&gt;\n  &lt;Card.Media /&gt;\n  &lt;Card.Header&gt;\n    &lt;Card.Title&gt;Title&lt;/Card.Title&gt;\n  &lt;/Card.Header&gt;\n  &lt;Card.Body&gt;Body&lt;/Card.Body&gt;\n  &lt;Card.Footer stretch&gt;\n    &lt;Button variant=\"soft-neutral\" size=\"s\" icon&gt;Button&lt;/Button&gt;\n    &lt;Button variant=\"solid-brand\" size=\"s\" icon&gt;Button&lt;/Button&gt;\n  &lt;/Card.Footer&gt;\n&lt;/Card&gt;"
  ));

  // ── Tones — full anatomy × 3, only `tone` differs ──
  //
  // Three tones derived from §3.1 reserved brand-surface tokens: primary (white workhorse),
  // secondary (subtle brand tint for soft emphasis), tertiary (saturated brand 500 for
  // hero moments). All three cards use the IDENTICAL anatomy; the title labels echo
  // the role per Part 7.3 ("Primary" / "Secondary" / "Tertiary") because the tone IS
  // the demo subject — the visual surface fill carries the tone, the title label
  // reinforces it.
  //
  // Layout: single row, no wrap. 3*264 + 2*32 frame gap = 856, fits within ~870px inner
  // content area. Inner-row gap `--space-2xl` (32) matches the comp-frame__preview's
  // own direct-children gap per the system rule "between separately-instantiated
  // components in a frame is always 32px unless the cluster is a defined group" (§7.1.1).
  o.push(titledFrame(
    "comp-card-tones",
    "Tones",
    "<div style=\"display:flex;gap:var(--space-2xl,32px);flex-wrap:wrap;align-items:stretch\">"
      + "<div style=\"width:264px;height:264px;flex-shrink:0\">" + cardEl(baseCard({media:true, body:"Body", footer:actionRow, footerStretch:true, title:"Primary"})) + "</div>"
      + "<div style=\"width:264px;height:264px;flex-shrink:0\">" + cardEl(baseCard({media:true, body:"Body", footer:actionRow, footerStretch:true, tone:"secondary", title:"Secondary"})) + "</div>"
      + "<div style=\"width:264px;height:264px;flex-shrink:0\">" + cardEl(baseCard({media:true, body:"Body", footer:actionRow, footerStretch:true, tone:"tertiary", title:"Tertiary"})) + "</div>"
      + "</div>",
    "&lt;Card&gt;…&lt;/Card&gt;\n&lt;Card tone=\"secondary\"&gt;…&lt;/Card&gt;\n&lt;Card tone=\"tertiary\"&gt;…&lt;/Card&gt;"
  ));

  // ── Variants — three slot families, one demo each ──
  //
  // The user's mental model for Card slots is "header / body+media / footer" (per the
  // simplification feedback). Each variant below isolates ONE family so the slot-level
  // choices are inspectable in isolation. Earlier rev (May 2026) shipped 7 variants
  // (Media / Content only / Description / Header actions / Avatar header / Footer /
  // Split footer) which over-enumerated permutations and made the page feel busy without
  // teaching anything new — the Description / Header actions / Avatar header / Split
  // footer variants were all "Default plus one extra slot," which the user can compose
  // themselves once they understand the underlying API. The simplified set keeps:
  //   • Header  — title only (the simplest possible card)
  //   • Body    — title + body (text-content card)
  //   • Footer  — title + body + actions (action card)
  // Default at top of page already shows the rich combination; these three show
  // progressive composition from minimum → with content → with affordance.
  //
  // Right-aligned header actions and split footer were dropped per user feedback ("not
  // sure if right aligned card controls are necessary either"). The header-actions slot
  // (.ds-card__actions) was later removed entirely (May 10, 2026) on the rationale that
  // header chrome buttons compete with the title for attention and don't compose well
  // with the small-square card geometry — affordances belong in the footer, where they
  // can carry primary/secondary hierarchy without crowding the title. The split-footer
  // slot (.ds-card__footer--split) is still in the CSS for consumers who need the M3
  // standard-card pattern (text actions on the left, icon-button cluster on the right);
  // we just don't dedicate a demo to it.

  // Header — title-only card. The simplest possible Card: a single region with just a
  // title. Demonstrates that Card collapses gracefully when only one slot is in use —
  // the title centers vertically because there's no media, body, or footer to push it
  // around (flex column with no growing siblings → title's content height is the only
  // height). Used for tag-like cards, status cards, single-metric cards.
  o.push(variantBlock(
    "comp-card-header",
    "Header",
    "<div style=\"width:264px;height:264px\">" + cardEl(baseCard()) + "</div>",
    "&lt;Card&gt;\n  &lt;Card.Title&gt;Title&lt;/Card.Title&gt;\n&lt;/Card&gt;"
  ));

  // Body — title + body content, no media, no footer. Text-content card. Shows the
  // body slot's flex:1 0 auto behavior — body grows to fill the slack between title
  // and the bottom edge, giving the card a balanced read with the title anchored top
  // and content filling the middle. Use for cards that present a chunk of prose
  // (description card, README card, content snippet card).
  o.push(variantBlock(
    "comp-card-body",
    "Body",
    "<div style=\"width:264px;height:264px\">" + cardEl(baseCard({body:"Body"})) + "</div>",
    "&lt;Card&gt;\n  &lt;Card.Title&gt;Title&lt;/Card.Title&gt;\n  &lt;Card.Body&gt;Body&lt;/Card.Body&gt;\n&lt;/Card&gt;"
  ));

  // Footer
  o.push(variantBlock(
    "comp-card-footer",
    "Footer",
    "<div style=\"width:264px;height:264px\">" + cardEl(baseCard({body:"Body", footer:actionRow, footerStretch:true})) + "</div>",
    "&lt;Card&gt;\n  &lt;Card.Title&gt;Title&lt;/Card.Title&gt;\n  &lt;Card.Body&gt;Body&lt;/Card.Body&gt;\n  &lt;Card.Footer stretch&gt;\n    &lt;Button variant=\"soft-neutral\" size=\"s\" icon&gt;Button&lt;/Button&gt;\n    &lt;Button variant=\"solid-brand\" size=\"s\" icon&gt;Button&lt;/Button&gt;\n  &lt;/Card.Footer&gt;\n&lt;/Card&gt;"
  ));

  // Badge — two modes: standalone row (between media and title) and inline (next to title)
  o.push(variantBlock(
    "comp-card-badge",
    "Badge",
    "<div style=\"display:flex;gap:var(--space-2xl,32px);align-items:stretch\">"
      + "<div style=\"width:264px;height:264px;flex-shrink:0\">" + cardEl(baseCard({media:true, badge:badgeEl("info","s",null,"Badge"), body:"Body"})) + "</div>"
      + "<div style=\"width:264px;height:264px;flex-shrink:0\">" + cardEl(baseCard({media:true, inlineBadge:badgeEl("info","s",null,"Badge"), body:"Body"})) + "</div>"
      + "</div>",
    "&lt;Card badge={&lt;Badge tone=\"info\"&gt;Label&lt;/Badge&gt;}&gt;…&lt;/Card&gt;\n&lt;Card inlineBadge={&lt;Badge&gt;Label&lt;/Badge&gt;}&gt;…&lt;/Card&gt;"
  ));

  // Horizontal — media sits beside the content in a row layout
  o.push(variantBlock(
    "comp-card-horizontal",
    "Horizontal",
    "<div style=\"width:480px;height:200px\">" + cardEl(baseCard({horizontal:true, media:true, body:"Body", footer:actionRow, footerStretch:true})) + "</div>",
    "&lt;Card horizontal&gt;…&lt;/Card&gt;"
  ));

  // Horizontal compact — list-item / search-result density
  o.push(variantBlock(
    "comp-card-horizontal-compact",
    "Horizontal compact",
    "<div style=\"width:320px;height:80px\">" + cardEl(baseCard({horizontal:true, media:true, description:"Description"})) + "</div>",
    "&lt;Card horizontal&gt;…&lt;/Card&gt;"
  ));

  return o.join("");
}

// ─── Composer (§9.28) ─────────────────────────────────────────────────
function renderComposer() {
  var o = [];
  o.push("<div class=group-gap></div><h2 class=h-group id=comp-composer>Composer</h2><p class=desc>Composer is a contained input surface that pairs a multi-line field with leading and trailing action affordances.</p>");

  // Demo helpers — minimal canonical configuration (1 leading icon-button, no trailing
  // cluster, optional model picker). The user requested simpler demos that don't enumerate
  // every slot permutation; the reduced helpers match what real product surfaces ship
  // (Claude / Cursor / ChatGPT all run with at most 1–2 leading affordances and a single
  // trailing primary, sometimes with a model picker on the L tier).
  function baseLeading() {
    return [{ icon: ICON_CIRCLE, ariaLabel: "Leading", fill: "ghost-neutral" }];
  }
  function baseTrailing() {
    return [];
  }
  function baseModel() {
    return { value: "Select", width: "auto" };
  }

  function variantBlock(id, title, preview, code) {
    return titledFrame(id, title, preview, code);

  function baseColumns() {
    return [
      { label: "Column 1" },
      { label: "Column 2" },
      { label: "Column 3", align: "right" }
    ];
  }
  function baseRows() {
    return [
      { cells: ["Row 1", "Item 1", "1"] },
      { cells: ["Row 2", "Item 2", "2"] },
      { cells: ["Row 3", "Item 3", "3"] },
      { cells: ["Row 4", "Item 4", "4"] }
    ];
  }

  // ── Default ────────────────────────────────────────────────────────────
  o.push(titledFrame(
    "comp-table-default",
    "Default",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: baseColumns(),
      rows: baseRows()
    }) + "</div>",
    "&lt;Table /&gt;"
  ));

  // ── Sizes ──────────────────────────────────────────────────────────────
  // Three tiers stacked in one frame per §7.1.1 variant-comparison column. S
  // is for ultra-dense data grids (settings rows, log lines, dashboards); M is
  // the default product density; L for hero data surfaces where comfortable
  // breathing matters more than density.
  o.push(titledFrame(
    "comp-table-sizes",
    "Sizes",
    "<div style=\"display:flex;flex-direction:column;gap:var(--space-2xl,32px);align-items:stretch;width:640px\">"
      + tableEl({ size: "s", interactive: true, columns: baseColumns(), rows: baseRows() })
      + tableEl({ size: "m", interactive: true, columns: baseColumns(), rows: baseRows() })
      + tableEl({ size: "l", interactive: true, columns: baseColumns(), rows: baseRows() })
      + "</div>",
    "&lt;Table size=\"s\" /&gt;\n&lt;Table size=\"m\" /&gt;\n&lt;Table size=\"l\" /&gt;"
  ));

  o.push(variantBlock(
    "comp-table-state-default",
    "Default",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: baseColumns(),
      rows: baseRows()
    }) + "</div>",
    "&lt;Table /&gt;"
  ));
  o.push(variantBlock(
    "comp-table-state-selected",
    "Selected",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: baseColumns(),
      rows: [
        { cells: ["Row 1", "Item 1", "1"] },
        { cells: ["Row 2", "Item 2", "2"], selected: true },
        { cells: ["Row 3", "Item 3", "3"] },
        { cells: ["Row 4", "Item 4", "4"] }
      ]
    }) + "</div>",
    "&lt;Row selected /&gt;"
  ));
  o.push(variantBlock(
    "comp-table-state-disabled",
    "Disabled",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: baseColumns(),
      rows: [
        { cells: ["Row 1", "Item 1", "1"] },
        { cells: ["Row 2", "Item 2", "2"], disabled: true },
        { cells: ["Row 3", "Item 3", "3"] },
        { cells: ["Row 4", "Item 4", "4"] }
      ]
    }) + "</div>",
    "&lt;Row disabled /&gt;"
  ));

  // ── Variants ───────────────────────────────────────────────────────────
  // Each variant demonstrates one practical column shape consumers reach for:
  //   • Selectable rows — leading checkbox column for multi-select grids
  //   • Numeric columns — right-aligned tabular-nums for amounts / counts
  //   • With controls — Inputs / Selects / icon buttons living inside cells
  //   • Sticky header — long tables that scroll under a pinned header row
  //
  // Realistic copy is permitted per §7.3 sanctioned exceptions: cells holding
  // a Badge demonstrate the tone semantics, cells holding an Input demonstrate
  // the in-cell editing pattern. The copy IS the demo subject in those cases.

  // Selectable — leading checkbox column. Header gets a master "select all"
  // checkbox via `headerHtml`; each row's first cell gets its own checkbox.
  var cbHeader = "<input type=\"checkbox\" class=\"ds-checkbox ds-checkbox--s\" aria-label=\"Select all\">";
  var cbRow = function(checked) {
    return "<input type=\"checkbox\" class=\"ds-checkbox ds-checkbox--s\""
      + (checked ? " checked" : "") + " aria-label=\"Select row\">";
  };
  o.push(variantBlock(
    "comp-table-selectable",
    "Selectable rows",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: [
        { kind: "select", headerHtml: cbHeader, width: "32px" },
        { label: "Column 1" },
        { label: "Column 2" },
        { label: "Column 3", align: "right" }
      ],
      rows: [
        { cells: [{ html: cbRow(false) }, "Row 1", "Item 1", "1"] },
        { cells: [{ html: cbRow(true)  }, "Row 2", "Item 2", "2"], selected: true },
        { cells: [{ html: cbRow(false) }, "Row 3", "Item 3", "3"] },
        { cells: [{ html: cbRow(false) }, "Row 4", "Item 4", "4"] }
      ]
    }) + "</div>",
    "&lt;Table&gt;\n  &lt;Column kind=\"select\" /&gt;\n  &lt;Column /&gt;…\n&lt;/Table&gt;"
  ));

  // Numeric — right-aligned tabular-nums with an affix
  function affixCell(prefix, value) {
    return { html: "<span class=\"ds-table__affix\">" + esc(prefix) + "</span>" + esc(value) };
  }
  o.push(variantBlock(
    "comp-table-numeric",
    "Numeric columns",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: [
        { label: "Column 1" },
        { label: "Column 2", align: "right" },
        { label: "Column 3", align: "right" }
      ],
      rows: [
        { cells: ["Row 1", affixCell("$", "100.00"), "1"] },
        { cells: ["Row 2", affixCell("$", "75.00"),  "2"] },
        { cells: ["Row 3", affixCell("$", "50.00"),  "3"] },
        { cells: ["Row 4", affixCell("$", "25.00"),  "4"] }
      ]
    }) + "</div>",
    "&lt;Column align=\"right\" /&gt;"
  ));

  // With badges — status indicator inside a cell. `badgeEl` is positional:
  // (tone, size, icon, label, dot).
  function badgeCell(tone, label) {
    return { html: badgeEl(tone, "s", null, label) };
  }
  o.push(variantBlock(
    "comp-table-with-badge",
    "With badges",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: [
        { label: "Column 1" },
        { label: "Column 2" },
        { label: "Column 3", align: "right" }
      ],
      rows: [
        { cells: ["Row 1", badgeCell("success", "Success"), "1"] },
        { cells: ["Row 2", badgeCell("info",    "Info"),    "2"] },
        { cells: ["Row 3", badgeCell("warning", "Warning"), "3"] },
        { cells: ["Row 4", badgeCell("danger",  "Danger"),  "4"] }
      ]
    }) + "</div>",
    "&lt;Cell&gt;&lt;Badge tone=\"…\" /&gt;&lt;/Cell&gt;"
  ));

  // With controls — Inputs and trailing icon-button actions inside cells.
  // Mirrors the volume-pricing pattern (Inputs in cells + trailing remove X)
  // referenced in the build conversation.
  function smallInput(value, prefix) {
    return inputEl({ size: "s", value: value, prefix: prefix, mono: true });
  }
  function rowActions() {
    return "<div class=\"ds-table__actions\">"
      + "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--xs ds-btn--icon-only\" aria-label=\"Remove row\">"
      + "<span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_XMARK + "</span>"
      + "</button>"
      + "</div>";
  }
  o.push(variantBlock(
    "comp-table-with-controls",
    "With controls",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      columns: [
        { label: "Column 1", width: "30%" },
        { label: "Column 2", align: "right" },
        { label: "Column 3", align: "right" },
        { kind: "actions", label: "" }
      ],
      rows: [
        { cells: ["Row 1", { html: smallInput("100.00", "$") }, "1", { html: rowActions() }] },
        { cells: ["Row 2", { html: smallInput("75.00",  "$") }, "2", { html: rowActions() }] },
        { cells: ["Row 3", { html: smallInput("50.00",  "$") }, "3", { html: rowActions() }] },
        { cells: ["Row 4", { html: smallInput("25.00",  "$") }, "4", { html: rowActions() }] }
      ]
    }) + "</div>",
    "&lt;Cell&gt;&lt;Input … /&gt;&lt;/Cell&gt;\n&lt;Cell kind=\"actions\"&gt;…&lt;/Cell&gt;"
  ));

  // Sticky header — many rows under a pinned header. ds-table-scroll wraps
  // the table so the scroll container's max-height drives the viewport.
  var stickyRows = [];
  for (var srIdx = 1; srIdx <= 12; srIdx++) {
    stickyRows.push({ cells: ["Row " + srIdx, "Item " + srIdx, String(srIdx)] });
  }
  o.push(variantBlock(
    "comp-table-sticky",
    "Sticky header",
    "<div style=\"width:640px\">" + tableEl({
      size: "m",
      interactive: true,
      sticky: true,
      scrollHeight: "240px",
      columns: baseColumns(),
      rows: stickyRows
    }) + "</div>",
    "&lt;Table sticky /&gt;"
  ));

  return o.join("");
}

// ─── Avatar ────────────────────────────────────────────────────────────
function avatarEl(opts) {
  opts = opts || {};
  var size = opts.size || "m";
  var cls = "ds-avatar ds-avatar--" + size;
  if (opts.square) cls += " ds-avatar--square";
  var content = "";
  if (opts.src) {
    content = "<img class=\"ds-avatar__img\" src=\"" + escAttr(opts.src) + "\" alt=\"" + escAttr(opts.alt || "") + "\" />";
  } else if (opts.initials) {
    content = esc(String(opts.initials).slice(0, 2));
  } else {
    content = "<span class=\"ds-avatar__icon\" aria-hidden=\"true\">" + (opts.icon || ICON_USER) + "</span>";
  }
  var statusHtml = "";
  if (opts.status) {
    statusHtml = "<span class=\"ds-avatar__status ds-avatar__status--" + opts.status + "\" aria-label=\"" + escAttr(opts.status) + "\"></span>";
  }
  var label = opts.label || (opts.initials ? "Avatar " + opts.initials : "Avatar");
  return "<span class=\"" + cls + "\" role=\"img\" aria-label=\"" + escAttr(label) + "\">"
    + "<span class=\"ds-avatar__inner\">" + content + "</span>"
    + statusHtml
    + "</span>";
}

// ─── Banner ────────────────────────────────────────────────────────────
function bannerEl(opts) {
  opts = opts || {};
  var tone = opts.tone || "neutral";
  var cls = "ds-banner";
  if (tone !== "neutral") cls += " ds-banner--" + tone;
  if (opts.fullBleed) cls += " ds-banner--full-bleed";

  var iconHtml = "";
  if (opts.icon !== false) {
    var glyph = opts.icon || ICON_CIRCLE;
    iconHtml = "<span class=\"ds-banner__icon\" aria-hidden=\"true\">" + glyph + "</span>";
  }

  var bodyInner = "";
  if (opts.title) bodyInner += "<div class=\"ds-banner__title\">" + esc(String(opts.title)) + "</div>";
  if (opts.description) bodyInner += "<div class=\"ds-banner__description\">" + esc(String(opts.description)) + "</div>";
  if (!bodyInner && opts.text) bodyInner = "<div class=\"ds-banner__title\">" + esc(String(opts.text)) + "</div>";
  if (!bodyInner) bodyInner = "<div class=\"ds-banner__title\">Banner</div>";
  var bodyHtml = "<div class=\"ds-banner__body\">" + bodyInner + "</div>";

  var actionBtns = "";
  if (opts.action) {
    actionBtns += "<button type=\"button\" class=\"ds-btn ds-btn--soft-neutral ds-btn--s\">" + esc(String(opts.action)) + "</button>";
  }
  if (opts.dismissible) {
    actionBtns += "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--s ds-btn--icon-only\" aria-label=\"Dismiss\"><span class=\"ds-btn__icon\">" + ICON_XMARK + "</span></button>";
  }
  var buttonsCluster = actionBtns ? "<div class=\"ds-banner__buttons\">" + actionBtns + "</div>" : "";

  var role = (tone === "danger" || tone === "warning") ? "alert" : "status";
  var live = (tone === "danger" || tone === "warning") ? "assertive" : "polite";

  return "<div class=\"" + cls + "\" role=\"" + role + "\" aria-live=\"" + live + "\">"
    + iconHtml + bodyHtml + buttonsCluster
    + "</div>";
}

// ─── Tabs ──────────────────────────────────────────────────────────────
function tabsEl(opts) {
  opts = opts || {};
  var size = opts.size || "m";
  var cls = "ds-tabs ds-tabs--" + size;
  var tabs = opts.tabs || [];
  var listHtml = "<div class=\"ds-tabs__list\" role=\"tablist\">";
  var selectedLabel = "";
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var trCls = "ds-tabs__trigger";
    if (t.disabled) trCls += " is-disabled";
    var selected = !!t.selected;
    if (selected) selectedLabel = t.label || "";
    var iconHtml = t.icon ? "<span class=\"ds-tabs__icon\" aria-hidden=\"true\">" + t.icon + "</span>" : "";
    var countHtml = (t.count != null) ? "<span class=\"ds-tabs__count\">" + esc(String(t.count)) + "</span>" : "";
    var disabledAttr = t.disabled ? " aria-disabled=\"true\" tabindex=\"-1\"" : "";
    listHtml += "<button type=\"button\" class=\"" + trCls + "\" role=\"tab\" aria-selected=\"" + (selected ? "true" : "false") + "\"" + disabledAttr + ">"
      + iconHtml
      + "<span class=\"ds-tabs__label\">" + esc(String(t.label || "Tab")) + "</span>"
      + countHtml
      + "</button>";
  }
  listHtml += "</div>";

  var panelHtml = "";
  if (opts.showPanel !== false) {
    panelHtml = "<div class=\"ds-tabs__panel\" role=\"tabpanel\">" + esc(opts.panelText || (selectedLabel ? selectedLabel + " content" : "Content")) + "</div>";
  }

  return "<div class=\"" + cls + "\">" + listHtml + panelHtml + "</div>";
}

// ─── Combobox ──────────────────────────────────────────────────────────
function comboboxEl(opts) {
  opts = opts || {};
  var width = opts.width || 240;
  var inputSize = opts.size || "m";
  // Trailing `caret-up-down` is the canonical "popup value picker" affordance shared with
  // Tailwind Catalyst Combobox, Headless UI Combobox, and shadcn Combobox (lucide
  // `chevrons-up-down`). It distinguishes Combobox visually from a plain Input or Search
  // field — the stacked carets communicate "open a list and the chosen value will swap in
  // place," while a single chevron-down would read as a disclosure. The leading
  // magnifying-glass was retired May 2026: it duplicated the affordance signal once the
  // trailing chevron landed, and made Combobox feel like a search-field-with-autocomplete
  // rather than the popup-picker-with-type-ahead pattern every modern reference ships.
  // Clearable X still swaps in front of the chevron when there's a typed value.
  // A11y (Part 14.2 / §9.15): the Input field IS the combobox — role=combobox + aria-autocomplete=list,
  // and aria-expanded/aria-controls reflect + point at the panel when it's open.
  var cmbPanelId = opts.showPanel ? ("ds-combobox-panel-" + (++uidCounter)) : "";
  var triggerAttrs = "role=combobox aria-autocomplete=list aria-expanded=" + (opts.showPanel ? "true" : "false");
  if (cmbPanelId) triggerAttrs += " aria-controls=" + cmbPanelId;
  var triggerHtml = inputEl({
    size: inputSize,
    placeholder: opts.placeholder || "Select\u2026",
    value: opts.value || "",
    clearable: !!opts.value,
    trailIcon: ICON_CARET_UP_DOWN,
    inputAttrs: triggerAttrs
  });

  var panelHtml = "";
  if (opts.showPanel) {
    var items = opts.items || [];
    var inner = "";
    if (items.length === 0) {
      inner = "<div class=\"ds-combobox__empty\">" + esc(opts.emptyText || "No results") + "</div>";
    } else {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var sel = !!it.selected;
        var cls = "ds-select-panel__item" + (sel ? " is-selected" : "");
        var checkHtml = sel ? "<span class=\"ds-select-panel__check\" aria-hidden=\"true\">" + ICON_CHECKMARK + "</span>" : "";
        inner += "<div class=\"" + cls + "\" role=\"option\" aria-selected=\"" + (sel ? "true" : "false") + "\">"
          + "<span class=\"ds-select-panel__label\">" + esc(String(it.label || "Option")) + "</span>"
          + checkHtml
          + "</div>";
      }
    }
    panelHtml = "<div class=\"ds-combobox__panel\" role=\"listbox\"" + (cmbPanelId ? " id=" + cmbPanelId : "") + ">" + inner + "</div>";
  }

  return "<div class=\"ds-combobox\" style=\"width:" + width + "px\">"
    + triggerHtml
    + panelHtml
    + "</div>";
}

// ─── Pagination ────────────────────────────────────────────────────────────
function paginationComputePages(current, total, maxVisible) {
  if (total <= maxVisible) {
    var arr = [];
    for (var i = 1; i <= total; i++) arr.push(i);
    return arr;
  }
  var siblings = 1;
  var startPage = Math.max(2, current - siblings);
  var endPage = Math.min(total - 1, current + siblings);
  if (current <= 1 + siblings + 1) {
    startPage = 2;
    endPage = Math.min(total - 1, 2 + siblings * 2);
  }
  if (current >= total - siblings - 1) {
    startPage = Math.max(2, total - 1 - siblings * 2);
    endPage = total - 1;
  }
  var pages = [1];
  if (startPage > 2) pages.push("...");
  for (var p = startPage; p <= endPage; p++) pages.push(p);
  if (endPage < total - 1) pages.push("...");
  if (total > 1) pages.push(total);
  return pages;
}

function paginationEl(opts) {
  opts = opts || {};
  var size = opts.size || "s";
  var total = Math.max(1, opts.total || 1);
  var current = Math.max(1, Math.min(opts.current || 1, total));
  var maxVisible = opts.maxVisible || 7;
  var compact = opts.compact === true;
  var textLabels = opts.textLabels === true;
  var prevNextOnly = opts.prevNextOnly === true;
  // Three presets — customizable via variant prop. ALL NEUTRAL after the May 2026 brand-color
  // audit (§12.1). Pagination is "position in a navigable set," semantically a list-row state,
  // not value selection. Active page now uses the canonical "current position" treatment
  // (action/hover bg + inset border/default ring) shared by Nav active and Select panel selected.
  //   • Default ("ghost") — ghost-neutral rest/arrows + ghost-neutral active. The active page
  //     gets the bg + inset ring via CSS-scoped [aria-current="page"] override.
  //   • variant="outlined" — outline-neutral rest/arrows (stroke softened to border/subtle) +
  //     outline-neutral active (stroke promoted to border/default + action/hover bg).
  //   • variant="filled" — soft-neutral rest/arrows + solid-neutral active. Lands in the
  //     Linear / Vercel / Primer filled-black lane.
  // Granular *Variant props still override any preset for mix-and-match — consumers wanting
  // a brand-saturated active page can pass activeVariant:"solid-brand" explicitly.
  var pgPreset;
  if (opts.variant === "filled") {
    pgPreset = { arrow: "soft-neutral", active: "solid-neutral", inactive: "soft-neutral" };
  } else if (opts.variant === "outlined") {
    pgPreset = { arrow: "outline-neutral", active: "outline-neutral", inactive: "outline-neutral" };
  } else {
    pgPreset = { arrow: "ghost-neutral", active: "ghost-neutral", inactive: "ghost-neutral" };
  }
  var arrowVariant = opts.arrowVariant || pgPreset.arrow;
  var activeVariant = opts.activeVariant || pgPreset.active;
  var inactiveVariant = opts.inactiveVariant || pgPreset.inactive;

  var prevDisabled = current <= 1;
  var nextDisabled = current >= total;
  var prevAttr = prevDisabled ? " disabled aria-disabled=\"true\"" : "";
  var nextAttr = nextDisabled ? " disabled aria-disabled=\"true\"" : "";

  var sizeCls = " ds-btn--" + size;
  var html = "<nav class=\"ds-pagination ds-pagination--" + size + "\" role=\"navigation\" aria-label=\"Pagination\">";

  if (textLabels) {
    html += "<button type=\"button\" class=\"ds-btn ds-btn--" + arrowVariant + sizeCls + "\"" + prevAttr + "><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_CHEVLEFT + "</span><span class=\"ds-btn__label\">Previous</span></button>";
  } else {
    html += "<button type=\"button\" class=\"ds-btn ds-btn--" + arrowVariant + sizeCls + " ds-btn--icon-only\" aria-label=\"Previous page\"" + prevAttr + "><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_CHEVLEFT + "</span></button>";
  }

  if (!prevNextOnly) {
    if (compact) {
      html += "<span class=\"ds-pagination__status\">Page " + current + " of " + total + "</span>";
    } else {
      var pages = paginationComputePages(current, total, maxVisible);
      pages.forEach(function (p) {
        if (p === "...") {
          html += "<span class=\"ds-pagination__ellipsis\" aria-hidden=\"true\">…</span>";
        } else {
          var isActive = p === current;
          var variant = isActive ? activeVariant : inactiveVariant;
          var ariaCurrent = isActive ? " aria-current=\"page\"" : "";
          var ariaLabel = isActive ? "Current page, page " + p : "Go to page " + p;
          html += "<button type=\"button\" class=\"ds-btn ds-btn--" + variant + sizeCls + " ds-pagination__page\" aria-label=\"" + ariaLabel + "\"" + ariaCurrent + "><span class=\"ds-btn__label\">" + p + "</span></button>";
        }
      });
    }
  }

  if (textLabels) {
    html += "<button type=\"button\" class=\"ds-btn ds-btn--" + arrowVariant + sizeCls + "\"" + nextAttr + "><span class=\"ds-btn__label\">Next</span><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_CHEVRIGHT + "</span></button>";
  } else {
    html += "<button type=\"button\" class=\"ds-btn ds-btn--" + arrowVariant + sizeCls + " ds-btn--icon-only\" aria-label=\"Next page\"" + nextAttr + "><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_CHEVRIGHT + "</span></button>";
  }

  html += "</nav>";
  return html;
}

  o.push("<div class=group-gap></div><h2 class=h-group id=motion-semantic>Semantic</h2><p class=desc>Named tokens compose primitives into role-based transitions and movement, controlled by two sliders.</p>");

  for (var t1 = 0; t1 < TRANS_TIMING.length; t1++) {

function setupMotionTracks() {
  function playCSS(track, cb) {
    var dur = parseInt(track.getAttribute("data-motion-dur")) || 300;
    var ease = track.getAttribute("data-motion-ease") || "ease-out";
    var dot = track.querySelector(".motion-dot");
    if (!dot) { cb(); return; }
    var maxX = track.clientWidth - 16;
    dot.style.transition = "none";
    dot.style.transform = "translateX(0)";
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      dot.style.transition = "transform " + Math.max(dur, 1) + "ms " + ease;
      dot.style.transform = "translateX(" + maxX + "px)";
      setTimeout(function() {
        dot.style.transition = "transform 300ms ease-out";
        dot.style.transform = "translateX(0)";
        setTimeout(cb, 350);
      }, Math.max(dur, 1) + 200);
    }); });
  }

  function playSpring(track, cb) {
    var key = track.getAttribute("data-spring");
    var cfg = SPRINGS[key];
    var dot = track.querySelector(".motion-dot");
    if (!dot || !cfg) { cb(); return; }
    var maxX = track.clientWidth - 16;
    var pos = 0, vel = 0, target = maxX;
    var tension = cfg.tension, damping = cfg.damping;
    var dt = 1 / 60, settled = 0, phase = 0;
    dot.style.transition = "none";
    dot.style.transform = "translateX(0)";
    function step() {
      var spring = -tension * (pos - target);
      var damp = -damping * vel;
      vel += (spring + damp) * dt;
      pos += vel * dt;
      if (Math.abs(pos - target) < 0.5 && Math.abs(vel) < 0.5) settled++; else settled = 0;
      dot.style.transform = "translateX(" + Math.max(0, Math.min(pos, maxX + 8)) + "px)";
      if (settled > 5) {
        dot.style.transform = "translateX(" + target + "px)";
        if (phase === 0) {
          phase = 1; target = 0; pos = maxX; vel = 0; settled = 0;
          setTimeout(function() { requestAnimationFrame(step); }, 200);
        } else {
          dot.style.transform = "translateX(0)";
          setTimeout(cb, 200);
        }
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var sections = document.querySelectorAll("[data-view-section]");
  sections.forEach(function(section) {
    var tracks = Array.from(section.querySelectorAll(".motion-track"));
    if (!tracks.length) return;

    function playAll() {
      var visible = tracks.filter(function(t) { return t.offsetParent; });
      if (!visible.length) { setTimeout(playAll, 1000); return; }
      var done = 0;
      function onDone() {
        done++;
        if (done >= visible.length) setTimeout(playAll, 800);
      }
      for (var i = 0; i < visible.length; i++) {
        if (visible[i].hasAttribute("data-spring")) {
          playSpring(visible[i], onDone);
        } else {
          playCSS(visible[i], onDone);
        }
      }
    }
    playAll();
  });
}
