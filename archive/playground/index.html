         2. HEADER row — flex-row with text wrapper on the left and inline close button on the right (no absolute positioning). Close is S-tier (28×28), the system's standard inline close for primary container surfaces — see "tier-by-context rule" in §9.6.
         3. TEXT wrappers (--dlg-text-px: 2) — minimal 0V/2H padding per §6.1.5 standalone-surface tier on the title-block wrapper (.ds-dialog__header-text wraps title + description) and on the body wrapper (.ds-dialog__body). The 2px H offset absorbs the line-box leading delta between text cap-top and the horizontal chrome edge; 0V relies on surface pad (12) for V breathing. Total text inset from outer dialog edge = --dlg-px (12) + --dlg-text-px (2) = 14px, applied uniformly to title, description, and body so all three text rows share the same H baseline. Title and description must NOT add their own padding — that would double-stack with the wrapper's 2px to 4px total and misalign them from the body. (Bug fixed May 2026: title and description previously carried redundant `padding: 0 var(--space-3xs, 2px)` which put them at 16px H while body sat at 14px H. The fix moves all H padding to the wrappers and zeros it on the text elements themselves.)
       Section gap --dlg-gap: 8 (3:2 pad:gap ratio with surface pad 12). Title 16/24 weight 500 (locally dominant per §5.1.1 three-part necessity test); description 12/16 weight 400 (supporting metadata); body 14/20 weight 400 (message body, smaller than title to preserve hierarchy). */
    .ds-dialog{--dlg-px:var(--space-m,12px);--dlg-gap:var(--space-s,8px);--dlg-text-px:var(--space-3xs,2px);--dlg-rd:var(--radius-l,20px);--dlg-w:440px;box-sizing:border-box;background:var(--color-surface-raised);border:1px solid var(--color-border-subtle);border-radius:var(--dlg-rd);box-shadow:var(--shadow-4);max-width:var(--dlg-w);width:100%;min-height:0;display:flex;flex-direction:column;gap:var(--dlg-gap);padding:var(--dlg-px);overflow:hidden;color:var(--color-text-primary);z-index:var(--z-modal,60)}
    .ds-dialog__header{display:flex;flex-direction:row;align-items:flex-start;gap:var(--space-s,8px);flex:0 0 auto}
    .ds-dialog__header-text{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--space-2xs,4px);padding:0 var(--dlg-text-px);min-width:0}
    .ds-dialog__title{margin:0;font:500 16px/24px var(--font)}
    .ds-dialog__description{margin:0;font:400 12px/16px var(--font);color:var(--color-text-secondary)}
    .ds-dialog__close{flex-shrink:0}
    .ds-dialog__body{flex:1 1 auto;min-height:0;font:400 14px/20px var(--font);color:var(--color-text-primary);padding:0 var(--dlg-text-px)}
    .ds-dialog__body>:first-child{margin-top:0}
    .ds-dialog__body>:last-child{margin-bottom:0}
    .ds-dialog__body--scroll{flex:1 1 0;overflow-y:auto}
    .ds-dialog__footer{display:flex;justify-content:flex-end;gap:var(--space-s,8px);flex:0 0 auto}
    .ds-dialog__footer--stacked{flex-direction:column-reverse}
    .ds-dialog__footer--stacked .ds-btn{width:100%}

    /* Toast (§9.8). Internal architecture (Rev F, May 2026): uniform 8/8 surface padding + square icon wrapper + minimal-offset body wrapper. Member of the "Toast/Banner/Tooltip uniform-8/8 family" — see §9.10 Banner and §9.5 Tooltip for the shared architecture and §6.1.5 for the family rule.
         1. SURFACE padding (--tst-pad: 8) — uniform 8/8 outer ring. Close XS button sits as direct flex child and picks up corner-symmetric inset (8/8) from this padding per §6.1.2 ((40 − 24) / 2 = 8 ✓).
         2. ICON wrapper padding (--tst-icon-pad: 2 symmetric on all sides) — wrapper becomes square 20×20 around the 16-glyph (icon-s + 2px on each side). Square per the family rule: icon wrapper dimensions equal text line-height in both axes. Replaces an earlier V-compensated 20W×24H wrapper (Rev D/E) that achieved 0px multi-line glyph-to-cap alignment at the cost of asymmetric internal padding and a 44px toast min-height. The 2-3px multi-line residual is within §6.1.4 leading-induced inset tolerance and accepted system-wide.
         3. BODY wrapper padding (--tst-body-py: 0 / --tst-body-px: 2) — Toast tier of §6.1.5 (minimal stacked-architecture variant; surface-pad 8 dominates so no second-tier asymmetry needed). Visible text inset: 10H (8 surface + 2 body) from outer left; ~12V (8 surface + 0 body + ~4 line-box leading) from outer top. Tighter horizontal than Banner — Toast's small-overlay identity favors compactness; Banner's in-flow identity favors more comfortable text breathing.
       The surface is flex-column with gap, so the optional .ds-toast__footer naturally appears as row 2 below the main .ds-toast__row. No grid template areas, no per-area padding overrides — the surface padding alone handles both the row's outer inset and the footer's outer inset. */
    .ds-toast{--tst-pad:var(--space-s,8px);--tst-icon-pad:var(--space-3xs,2px);--tst-body-py:0;--tst-body-px:var(--space-3xs,2px);--tst-buttons-gap:var(--space-2xs,4px);--tst-section-gap:var(--space-s,8px);--tst-footer-gap:var(--space-xs,6px);--tst-rd:var(--radius-m,16px);--tst-min-h:var(--control-l,40px);--tst-min-w:280px;--tst-max-w:360px;--tst-icon:var(--icon-s,16px);--tst-fs:14px;--tst-lh:20px;--tst-bg:var(--color-surface-raised);--tst-border:var(--color-border-subtle);--tst-icon-color:var(--color-text-secondary);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--tst-section-gap);min-width:var(--tst-min-w);max-width:var(--tst-max-w);min-height:var(--tst-min-h);padding:var(--tst-pad);background:var(--tst-bg);border:1px solid var(--tst-border);border-radius:var(--tst-rd);box-shadow:var(--shadow-3);font:400 var(--tst-fs)/var(--tst-lh) var(--font);color:var(--color-text-primary);z-index:var(--z-toast,80);pointer-events:auto}
    .ds-toast--info{--tst-bg:var(--color-feedback-info-bg);--tst-border:var(--color-feedback-info-border);--tst-icon-color:var(--color-text-info)}
    .ds-toast--success{--tst-bg:var(--color-feedback-success-bg);--tst-border:var(--color-feedback-success-border);--tst-icon-color:var(--color-text-success)}
    .ds-toast--warning{--tst-bg:var(--color-feedback-warning-bg);--tst-border:var(--color-feedback-warning-border);--tst-icon-color:var(--color-text-warning)}
    .ds-toast--danger{--tst-bg:var(--color-feedback-danger-bg);--tst-border:var(--color-feedback-danger-border);--tst-icon-color:var(--color-text-danger)}
    .ds-toast__row{display:flex;align-items:center;gap:0;flex:1 1 auto}
    .ds-toast:has(.ds-toast__title):has(.ds-toast__description) .ds-toast__row{align-items:flex-start}
    .ds-toast__icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:var(--tst-icon-pad);color:var(--tst-icon-color);line-height:1}
    .ds-toast__icon>svg{width:var(--tst-icon);height:var(--tst-icon)}
    .ds-toast__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--space-3xs,2px);padding:var(--tst-body-py) var(--tst-body-px);word-wrap:break-word}
    .ds-toast__title{font:400 var(--tst-fs)/var(--tst-lh) var(--font);color:var(--color-text-primary)}
    .ds-toast__description{font:400 var(--tst-fs)/var(--tst-lh) var(--font);color:var(--color-text-secondary)}
    .ds-toast__buttons{flex-shrink:0;display:inline-flex;align-items:center;gap:var(--tst-buttons-gap)}
    .ds-toast__footer{display:flex;justify-content:flex-end;align-items:center;gap:var(--tst-footer-gap)}
    .ds-toast-stack{display:flex;flex-direction:column;gap:var(--space-s,8px);align-items:stretch;width:100%;max-width:360px}

    /* Separator (§9.10) — Job C definition stroke. Horizontal default; vertical via modifier; labeled variant centers a label between two hairlines. */
    .ds-separator{display:block;border:0;height:1px;width:100%;background:var(--color-border-subtle);margin:0;flex-shrink:0}
    .ds-separator--vertical{height:auto;align-self:stretch;width:1px;min-height:var(--space-l,16px)}
    .ds-separator--labeled{display:flex;align-items:center;gap:var(--space-s,8px);height:auto;background:transparent;color:var(--color-text-tertiary);font:400 12px/16px var(--font)}
    .ds-separator--labeled::before,.ds-separator--labeled::after{content:"";flex:1;height:1px;background:var(--color-border-subtle)}

    /* Card (§9.13) — surface-level container with optional media + header + body + footer regions.
     *   Three tones derived from §3.1 reserved brand-surface tokens (§2.2.1 reserved-tokens policy):
     *     • Primary (default) — workhorse white: surface/default + text/primary
     *     • Secondary — soft brand-tinted container: surface/brand-subtle (blue/50 light, blue/1100 dark)
     *     • Tertiary — saturated brand surface: surface/brand + text/on-brand white, for hero/promotional moments
     *   Tertiary drops the outer border (saturated fill carries the boundary per §3.5 "fill carries the boundary" exception); border/subtle would be invisible against the saturated brand bg anyway.
     *   Description text on tertiary uses color-mix(text/on-brand 80%, transparent) — sanctioned per §2.2.1 because no semantic token captures "muted on-brand foreground" and adding text/on-brand-muted would be a 1-component-only token.
     *
     *   STRUCTURE — single padded surface, gap-spaced regions (no internal dividers).
     *   The earlier rev (May 2026) had border-bottom on .ds-card__header and border-top on .ds-card__footer which split the surface into three explicitly-divided zones. Per user request and §3.5 stroke-removability tier 3 (definitional dividers — fully removable for a flat-fill aesthetic), all internal dividers were removed. Padding lives on the card itself (--cd-pad) rather than on each region, and regions are separated by --cd-gap. The result: card edge → first region content = --cd-pad (12); region → region = --cd-gap (12); the rhythm is calm, the surface reads as a single integrated card rather than three stacked cells.
     *   Pad and gap are intentionally EQUAL (both 12). The May 2026 rev-3 had pad 12 / gap 8 (3:2 ratio) on the rationale that gap < pad creates a hierarchy step between "outer chrome" and "internal separation." That rationale was reverted to match Figma 295-672 (May 2026), which uses pad 12 / gap 12 (1:1) — equal-space rhythm reads as "deliberate and proportional" at the dense small-card scale where this system lives. Dialog (§9.6) keeps the 12/8 (3:2) hierarchy because Dialog's wider container (440px) and 3-zone explicit structure benefit from a hierarchical step; Card at 264 width and equal-prominence regions reads better with 1:1. Both ratios are sanctioned per surface; do not treat one as the universal answer.
     *
     *   TYPOGRAPHY — title body/l (16/24) weight 400 + body body/m (14/20) weight 400. Hierarchy via SIZE only (16 vs 14), per §5.1.1 "Components default to weight 400; size + color + surface carry hierarchy, never weight." An earlier rev (May 2026, Figma 295-672 1:1 implementation) put title at 16/24 weight 500 + body at 16/24 weight 400, where title and body shared a size and weight 500 was the only hierarchy carrier. That triggered the §5.1.1 necessity test: criterion (b) "cannot scale up in size" evaluated TRUE only because the implementation was holding body at 16/24 to match Figma; once body could drop to 14/20 (the Dialog-body tier), criterion (b) flipped FALSE and weight 500 became redundant. Dropping title to 400 brings Card back into alignment with Dialog/Toast/Banner titles (all at 400) and matches the Standing Rule #13 stance that components default to weight 400. The Figma's weight 500 is preserved as a documented "what Figma shipped" reference but not implemented; the system's "weight 400 default" rule wins where they conflict.
     *
     *   HORIZONTAL TEXT PADDING — 12 (1:1 with vertical), NOT case-B asymmetric (16H / 12V). Per §6.1.2 priority rule: when a backplate has BOTH text and hard-edged sub-elements (footer buttons) sharing alignment edges (the card's left and right vertical edges), hard-edged wins. Padding collapses to the value that gives buttons corner-symmetric inset (12V/12H around each footer button). Text accepts that the line-box leading provides ~3-4px of "free" vertical breathing above the cap-top while horizontal has no equivalent buffer. The visible result: text appears to sit slightly closer to the side edges than the top edge, but the buttons land at corner-symmetric 12/12 against the card corner — which is the more visible failure mode if violated. Tooltip (single-row) and Toast follow the same priority rule.
     *
     *   MEDIA SLOT — INSET (sits inside the card's padding, not edge-to-edge).
     *   The previous rev had .ds-card__media using margin: calc(-1 * var(--cd-pad)) ... to escape the padding and bleed edge-to-edge. That look ("hero card" — bleed image, content-below-with-padding) is one valid pattern but reads as more aggressive / promotional than this system's overall stance, and the user's reference designs (Frames X cards, the inset-photo "Andrew S" card, Figma 295-672) show inset visuals where the image sits inside the card's padding zone with its own rounded corners. Inset is the default: .ds-card__media has no negative margins; it sits inside the card alongside title/body/footer at the same horizontal indent. Each media slot gets its own border-radius (--cd-media-rd, default radius-s (12) per §2.1.2 STRICT regime: outer card radius 24 minus inset 12 = inner radius 12 ✓ exact concentric corners). This is a textbook strict-regime case — Figma 295-672 picks 24/12/12 specifically because the math resolves cleanly to a single visible "frame around the image" curve.
     *   Aspect-ratio default is 16/9 (the universal "image content goes here" ratio); consumers can override by setting their own height or aspect-ratio on the media slot. Default placeholder fill is surface/subtle (the system's "container chrome that needs a value-different surface" token), with a centered Phosphor `image` icon (ICON_IMAGE) at icon-xl (40) in text/tertiary so the slot reads as "image content goes here" even when empty — explicit semantic glyph allowed by Standing Rule #8 because the icon's role IS to communicate "image." A future `--full-bleed` modifier can re-introduce the edge-to-edge pattern when needed (matching how Banner has --full-bleed for the same reason); not in scope today.
     *
     *   --cd-fg/--cd-fg-muted replace direct token references on title/description so each tone overrides them in one selector instead of cascading through child selectors. */
    /* Card root.
       - width/height: 100% — Card fills its wrapper. The consumer's wrapper picks the
         dimensions; the system picks the behavior. In a fluid wrapper (no explicit height),
         height:100% resolves to height:auto (parent has no concrete height to fill against),
         so the card collapses to its intrinsic content height, same as before. In a fixed-
         height wrapper (e.g., the playground's 320×240 demo wrapper), height:100% resolves
         to the wrapper's height and the flex-shrink rules below distribute the available
         space among the children. This is the canonical "Figma card frame" pattern — fixed
         shell, content stretches.
       - The previous rev (May 2026) added body's flex:1 1 auto + footer's margin-top:auto
         but missed setting width/height:100% on the card itself, so the wrapper's height
         was ignored and every variant rendered at its content height (varying per variant).
         The user's screenshot showed cards rendering at content height (compact ~150 tall
         for Footer variant) rather than at the intended fixed shell. Adding width/height:100%
         is the load-bearing fix; the flex rules below were the prep work, this connects them. */
    /* Card outer radius is DERIVED, not chosen — outer = inner_radius + inset.
       Per the §2.1.2 inverse-rule audit (May 10, 2026), the system's mathematically
       consistent surfaces all derive their outer radius from their corner-adjacent inner
       elements: Toast (16 = 8+8), Tooltip (12 = 4+8), Dialog (20 = 8+12), Dropdown panel
       (12 = 8+4). Card joins this set:
         outer = inner-radius + --cd-pad = radius-xs (8) + 12 = 20 = radius-l
       The corner-adjacent inner elements are the two footer buttons (S-tier, radius-xs 8)
       and the media slot (--cd-media-rd: radius-xs 8). All sit at radius 8, all inset by
       --cd-pad (12). The strict-regime/soft-ideal formula resolves to outer 20 exactly
       for every corner-adjacent inner element. Header is title + optional description
       only — no trailing icon-button slot, so the top corners' concentric pair is
       media↔surface (8+12=20) when media is present, or just the surface itself when
       media is absent. Bottom corners' pair is footer-button↔surface (8+12=20).
       Earlier rev had Card at radius-xl (24), which produced spread-16 corners on every
       sub-element (target was 12, actual was 8) — a documented soft-regime case but no
       longer needed once we chose to derive outer from inner. The radius-xl (24) tier is
       now reserved for future Sheet / Drawer where the larger surface uses inset 16
       (Sheet's natural padding tier), giving 8 + 16 = 24.
       Card and Dialog now share the same outer (radius-l 20) — they're peers in the
       surface family. Differentiation moves to behavior (Card inline, Dialog modal +
       scrim) and content density (Card has up to 4 regions including media, Dialog has
       up to 3). The shape language becomes a derived property, not an arbitrary choice. */
    .ds-card{--cd-rd:var(--radius-l,20px);--cd-pad:var(--space-m,12px);--cd-gap:var(--space-m,12px);--cd-media-rd:var(--radius-xs,8px);--cd-bg:var(--color-surface-default);--cd-fg:var(--color-text-primary);--cd-fg-muted:var(--color-text-secondary);--cd-border:var(--color-border-subtle);--cd-shadow:none;box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;gap:var(--cd-gap);padding:var(--cd-pad);background:var(--cd-bg);border:1px solid var(--cd-border);border-radius:var(--cd-rd);box-shadow:var(--cd-shadow);overflow:hidden;color:var(--cd-fg)}
    .ds-card--secondary{--cd-bg:var(--color-surface-brand-subtle)}
    .ds-card--tertiary{--cd-bg:var(--color-surface-brand);--cd-fg:var(--color-text-on-brand);--cd-fg-muted:color-mix(in oklch, var(--color-text-on-brand) 80%, transparent);--cd-border:transparent}
    /* Media slot.
       - aspect-ratio 16/9 drives the intrinsic media height when the card has no fixed
         height (fluid mode): width 296 (= 320 − 2×12 padding) × 9/16 = 167 tall.
       - flex: 0 1 auto + min-height:0 — the default flex-shrink:1 plus min-height:0 lets
         the media SHRINK below its 167-tall intrinsic height when the card's fixed height
         can't accommodate the natural aspect. In a 320×240 fixed shell with a media+header
         +body+footer rich preview, the deficit is ~71px and media absorbs all of it
         (because header/body/footer have flex-shrink:0 below), landing at ~96 tall (3:1
         banner aspect). This is the deliberate trade: fluid cards get a clean 16:9 image
         tile; fixed-shell cards get a media banner whose aspect adapts to fit. The
         alternative (lock 16:9 always) would force fixed-shell cards taller, which is
         what the previous 320×320 rev did and what the user pushed back on. */
    .ds-card__media{aspect-ratio:16/9;min-height:0;background:var(--color-surface-subtle);border-radius:var(--cd-media-rd);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);overflow:hidden}
    .ds-card__media>svg{width:var(--icon-xl,40px);height:var(--icon-xl,40px)}
    .ds-card__media>img{width:100%;height:100%;object-fit:cover;display:block}
    /* Header — flex-shrink:0 so the title+description block keeps its intrinsic height;
       only media absorbs deficit in fixed-shell cards. The header is a 3-zone flex row:
       [avatar (optional, leading)] [text-block (grows)] [actions (optional, trailing)].
       align-items:flex-start so a leading avatar pins to the title's cap-top, and a multi-
       line description doesn't push the avatar off the baseline. The space-m (12) gap is
       the same gap Toast/Banner use between icon and body — leading element to text block
       reads as "associated but distinct" at this scale. */
    .ds-card__header{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-m,12px);min-width:0}
    /* Avatar slot — flex-shrink:0 keeps the avatar at its declared size even when the
       text block needs to wrap. Consumers pass full avatarEl() output; this slot is just
       a positional wrapper so the descendant selector .ds-card__avatar > .ds-avatar can
       layout-tune (e.g., add a small top-margin to nudge the avatar toward title cap-top
       if a future audit finds the alignment slightly off — not needed today). */
    .ds-card__avatar{flex-shrink:0;display:flex;align-items:center}
    /* Header-text gap is 0 — title and description (when both present) read as a single
       text block with hierarchy carried by weight (500 vs 400) and color (primary vs
       muted), not by an explicit gap. The 14/20 line-height already provides ~5px of
       leading above each cap and below each baseline, so adjacent stacked lines have
       ~10px visible gap from leading alone. Adding an explicit gap on top double-counts
       the breathing and pushes the text block taller than it needs to be. */
    .ds-card__header-text{display:flex;flex-direction:column;gap:0;min-width:0;flex:1 1 auto;padding:0 var(--space-3xs,2px)}
    /* Title typography — 14/20 weight 500. Same SIZE as body (14/20) per §9.13's "size-
       uniform, weight-differentiated" rule. Weight 500 is allowed here under the §5.1.1
       three-part necessity test:
         (1) Title must read as locally dominant within the card ✓
         (2) Title cannot scale up — body and title share the 14/20 tier so weight is the
             only available differentiator ✓
         (3) Color cannot carry the contrast — both title and body use text/primary
             (--cd-fg), so neither can lighten/darken the other ✓
       All three criteria satisfied → weight 500 is justified, not drift. This is the
       canonical example of the §5.1.1 escalation case. */
    .ds-card__title{font:500 14px/20px var(--font);color:var(--cd-fg);margin:0}
    .ds-card__description{font:400 14px/20px var(--font);color:var(--cd-fg-muted);margin:0}
    /* Body — flex:1 0 auto so body GROWS to fill slack (variants without media or with
       short content) but does NOT shrink below its content height (so body text never
       clips when media+everything overflows the fixed shell). The default flex:0 1 auto
       has shrink:1 which would let body collapse to 0 in extreme overflow — that's why
       grow:1, shrink:0 is the right pair here. min-height:0 only matters for cases where
       this changes; harmless either way. */
    .ds-card__body{flex:1 0 auto;min-height:0;font:400 14px/20px var(--font);color:var(--cd-fg);padding:0 var(--space-3xs,2px)}
    /* Text-to-text inter-region gap collapse — when the card root's flex column would
       place a text-bearing region (.ds-card__header) directly above another text-bearing
       region (.ds-card__body), the inter-region --cd-gap (12) is neutralized via a
       negative margin-top on the body equal to the gap. Net effect: title and body
       sit visually adjacent with ONLY their line-box leading separating them (~5px
       above body cap-top + ~5px below title baseline = ~10px visible) instead of an
       additional 12px of explicit gap on top. Per §9.13 — title and body read as a
       continuous text block; explicit inter-region gap would double-count the breathing
       that 14/20 leading already provides.
       The collapse fires ONLY for header→body (text↔text). Other inter-region pairs
       — media↔header (graphic↔text), body↔footer (text↔controls) — KEEP their --cd-gap
       because those boundaries cross content modes and benefit from explicit separation.
       Implemented via adjacent sibling selector so the rule is automatic; consumers
       don't need to opt in. The negative margin equals the gap exactly, so the body's
       paint position shifts up by 12 to negate the 12px gap that flexbox added. */
    .ds-card__header + .ds-card__body{margin-top:calc(-1 * var(--cd-gap))}
    /* Footer — flex-shrink:0 so buttons keep their height; margin-top:auto pins
       footer to the card's bottom edge in the only case where neither media nor body is
       present (rare — the demos don't currently produce this combination, but the rule
       is harmless when a flex-growing sibling is present because the auto margin
       resolves to 0 once the slack is consumed).
       Default mode: single right-aligned cluster (justify-content:flex-end) — the
       "Cancel | Confirm" pattern matching Dialog footer.
       Split mode (--split modifier): two clusters anchored to opposite edges
       (justify-content:space-between) — text actions left, icon-button cluster right
       (Material 3 card pattern). Each cluster wraps its children in __footer-group so
       intra-cluster gap is space-s (8) while the inter-cluster space stretches. */
    .ds-card__footer{flex-shrink:0;margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:var(--space-s,8px)}
    .ds-card__footer--split{justify-content:space-between}
    /* Stretch modifier — buttons in the action row each consume an equal share of the
       available width via flex:1 1 0 + min-width:0. Use for cards where two affordances
       are peer responses ("Cancel" / "Confirm", "Decline" / "Accept", "Skip" / "Continue").
       The system uses Button S (28-tall) here, not the Figma's M (32-tall), to match the
       Dialog/Toast/Banner footer convention — every "card-class notification surface" in
       the system uses S in its footer row, so Card aligns with that family rather than
       Figma's standalone M choice. The denser S also reduces visual weight in the 264-square
       shell, which an earlier May 2026 rev (M-tier with icon+label per Figma) read as
       overcrowded against the rest of the card content. The min-width:0 lets long labels
       truncate inside the button rather than blowing out the row. */
    .ds-card__footer--stretch>.ds-btn{flex:1 1 0;min-width:0}
    .ds-card__footer-group{display:flex;align-items:center;gap:var(--space-s,8px)}
    .ds-card__badge{flex-shrink:0;display:flex;align-items:center;gap:var(--space-2xs,4px)}
    .ds-card__title-row{display:flex;align-items:center;gap:var(--space-s,8px);min-width:0}
    .ds-card__title-row .ds-card__title{flex:1 1 auto;min-width:0}
    .ds-card--horizontal{flex-direction:row}
    .ds-card--horizontal .ds-card__media{aspect-ratio:1/1;height:100%;width:auto;flex-shrink:0;min-height:unset;align-self:stretch}
    .ds-card--horizontal .ds-card__content{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--cd-gap);min-width:0}
    .ds-card--horizontal .ds-card__header + .ds-card__body{margin-top:calc(-1 * var(--cd-gap))}

    /* Composer (§9.28) — AI-chat-style message input layout primitive. Contained surface that
       holds a chrome-shed textarea/input + leading cluster + trailing cluster (with optional
       model-picker Select + canonical send Button at fixed order). Single canonical size like
       Card / Dialog / Toast / Banner — the visual identity comes from "form for typing a
       message," not from a height tier. Two layouts: --double (default, 2-row Claude form,
       multi-line textarea on top with control row below) and --single (1-row ChatGPT-mini
       form, leading cluster + single-line input + trailing cluster in one row).

       Token derivations (§1.4.4 Pattern 1 + Pattern 2 only — no magic numbers):
       - Outer radius radius-l (20) = inner Button XS radius-xs (8) + outer pad space-m (12)
         per §2.1.2 inverse rule (outer = inner_radius + inset). Concentric corners satisfied
         at strict-regime since inset (12) > ½ × outer (10) — soft regime, ideal hit exactly.
       - Single-layout container floor: pad space-m (12) × 2 + Button XS (24) = 48 = control-xl.
       - Double-layout textarea floor: 2 × body/m line-height (20) = 40 (2 lines visible).
       - Double-layout textarea ceiling: 6 × body/m line-height (20) = 120 (scrolls past 6 lines).
       - Inter-row gap (textarea ↔ control row): space-s (8) — §6.5 default cluster tier.
       - Intra-cluster gap: space-2xs (4) — §6.5 tight cluster tier (icon-only XS buttons
         packed close).

       Chrome ownership: the outer .ds-composer surface owns ALL chrome (border, bg, focus
       halo, error tint, disabled fill). Inner Textarea / Input / Button / Select shed their
       own chrome via descendant rules with !important — same authoritative-parent pattern as
       §9.27 InputGroup. !important is the right tool here because we need to win against
       child specificity stacks like .ds-select:hover:not(:disabled):not(.is-focused):not(.is-error):not(.is-open).
    */
    /* M (default) tier — Cursor-compact density:
       — Buttons + Select at M tier (32-tall, radius-2s 10)
       — Surface pad space-xs (6) → outer radius-m (16) per §2.1.2 strict-regime concentric corners (10+6=16 exact)
       — __field pad 6V/6H — uniform/equal-pad tier per spec §9.28 May 2026 rev */
    .ds-composer{--cmp-rd:var(--radius-m,16px);--cmp-pad:var(--space-xs,6px);--cmp-text-py:var(--space-xs,6px);--cmp-text-px:var(--space-xs,6px);--cmp-gap:var(--space-xs,6px);--cmp-cluster-gap:var(--space-2xs,4px);--cmp-fs:14px;--cmp-lh:20px;--cmp-control-h:var(--control-m,32px);--cmp-text-min-rows:1;--cmp-text-max-rows:6;--cmp-bg:var(--color-surface-default);--cmp-br:var(--color-border-default);box-sizing:border-box;position:relative;width:100%;display:flex;flex-direction:column;gap:var(--cmp-gap);padding:var(--cmp-pad);background:var(--cmp-bg);border:1px solid var(--cmp-br);border-radius:var(--cmp-rd);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
    /* S size (Cursor-composer-style "compact" tier):
       — Buttons + Select at S tier (28-tall, radius-xs 8)
       — Surface pad space-xs (6) → outer radius-s (12) per §2.1.2 borderline-strict / accepted-soft regime (8+6=14 → 12, spread 4)
       — __field pad 4V/4H — uniform/equal-pad tier */
    .ds-composer--s{--cmp-rd:var(--radius-s,12px);--cmp-pad:var(--space-xs,6px);--cmp-text-py:var(--space-2xs,4px);--cmp-text-px:var(--space-2xs,4px);--cmp-gap:var(--space-2xs,4px);--cmp-control-h:var(--control-s,28px)}
    /* L size (Claude-homepage-style "spacious" tier):
       — Buttons + Select at L tier (40-tall, radius-2m 14)
       — Surface pad space-s (8) → outer radius-l (20) per §2.1.2 soft regime (14+8=22 → 20, spread 6, sanctioned)
       — Composer joins Dialog/Card surface family at L tier
       — __field pad 8V/8H — uniform/equal-pad tier (off-ramp 10px removed May 2026) */
    .ds-composer--l{--cmp-rd:var(--radius-l,20px);--cmp-pad:var(--space-s,8px);--cmp-text-py:var(--space-s,8px);--cmp-text-px:var(--space-s,8px);--cmp-gap:var(--space-s,8px);--cmp-control-h:var(--control-l,40px)}
    .ds-composer--single{flex-direction:row;align-items:center;gap:var(--cmp-cluster-gap)}
    .ds-composer--double .ds-composer__row{display:flex;align-items:center;justify-content:space-between;gap:var(--cmp-cluster-gap)}
    /* Field region — flex-grows to fill remaining track; min-width:0 lets long text wrap/scroll
       inside the textarea rather than blowing out the row.
       
       Tiered internal padding (May 2026 uniform/equal-pad rev per spec §9.28):
       — S: 4V / 4H  (--cmp-text-py = space-2xs, --cmp-text-px = space-2xs)
       — M: 6V / 6H  (--cmp-text-py = space-xs,  --cmp-text-px = space-xs)
       — L: 8V / 8H  (--cmp-text-py = space-s,   --cmp-text-px = space-s)
       
       Visible H breathing = --cmp-pad + --cmp-text-px (S:10, M:12, L:16).
       Visible V breathing = --cmp-pad + --cmp-text-py + leading (S:10.4, M:10.4, L:12.4)
       — all three tiers sit inside the §6.1.1 sanctioned case-B band (1.0–1.5 visible H/V ratio):
       S ratio 0.96 (visibly uniform), M ratio 1.15 (modest H dominance), L ratio 1.29
       (comfortable H dominance matching Card/Banner). The leading absorbs the V/H raw
       symmetry — text-py = text-px raw, but visible cap-top inset is naturally smaller than
       text-px because the line-box reserves ~4.4px of leading per side at 14/20 mono.
       
       Earlier rev (replaced May 2026) used the H = V + 2 pattern (S:4V/6H, M:6V/8H, L:8V/10H)
       which produced visible H/V ratios 1.19/1.35/1.61 — L overshot the §6.1.1 band (~1.5
       ceiling), and the 10px text-px was an off-ramp value violating Standing Rule #12.
       The uniform/equal-pad rev keeps every tier inside the band and lands every value on
       the spacing ramp.
       
       Layout consequences:
       — --single: input renders at its natural line-height (20px = --cmp-lh) — NOT stretched
         to --cmp-control-h. The field row's height emerges from the box-model:
         padding-top (--cmp-text-py) + line-height (20) + padding-bottom (--cmp-text-py).
         At M that's 6 + 20 + 6 = 32, which equals --cmp-control-h and matches the sibling
         button row. Total composer height = --cmp-pad × 2 + 32 = 6 + 32 + 6 = 44. ✓
         (At S: 4 + 20 + 4 = 28, matches button-S 28. At L: 8 + 20 + 8 = 36; sibling
         buttons are 40-tall so the row resolves to 40 via flex max-child and the field's
         36-content sits centered inside, with the input's vertical center aligned with
         the buttons' vertical center via align-items:center. Total L = 8+40+8 = 56. ✓)
         Earlier rev set `height: var(--cmp-control-h)` on the input (32 at M), conflating
         the text element's intrinsic line-height with the button-tier outer control
         height. That double-specified the row height and produced a ~56-tall composer
         at M (6 outer + 6 field + 32 input + 6 field + 6 outer) instead of the canonical
         44. Removed May 2026 — the input is text content, not a button-tier control;
         row height comes from the field's box-model wrapping the input, not from
         stretching the input itself.
       — --double: textarea auto-grows from 1 line via field-sizing:content within min/max
         bounds. The tiered pad gives the multi-line text its own breathing room from the
         surface chrome, matching banner's __body 2V/4H rule (§9.10) but scaled per tier to
         match the composer's own size identity rather than a single fixed pair.
       
       align-items:center vertically centers whichever control the __field contains (input or
       textarea) inside the padded box. */
    .ds-composer__field{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:var(--cmp-text-py) var(--cmp-text-px)}
    .ds-composer__textarea,.ds-composer__input{flex:1 1 0;min-width:0;font-family:var(--font,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:var(--cmp-fs);line-height:var(--cmp-lh);color:var(--color-text-primary);background:transparent;border:0;outline:0;padding:0;margin:0;resize:none;field-sizing:content}
    .ds-composer__textarea::placeholder,.ds-composer__input::placeholder{color:var(--color-text-placeholder)}
    /* Double-layout textarea: 1-row default (per user directive — "single row at all times,
       expand to 2 or 3 rows if necessary"), auto-grow on Chrome 133+ / Safari 18.2+ via
       field-sizing:content, max ceiling at --cmp-text-max-rows × line-height (default 6 rows
       headroom; consumers can tighten via --cmp-text-max-rows: 3 or 4 if their use case wants
       earlier scroll). */
    .ds-composer--double .ds-composer__textarea{min-height:calc(var(--cmp-text-min-rows) * var(--cmp-lh));max-height:calc(var(--cmp-text-max-rows) * var(--cmp-lh));overflow-y:auto;display:block;width:100%}
    /* Cluster regions — leading (left) and trailing (right), each a flex row of XS buttons +
       optional Select. flex:0 0 auto so the field stays the only flex-growing child. */
    .ds-composer__cluster{display:flex;align-items:center;gap:var(--cmp-cluster-gap);flex:0 0 auto}
    .ds-composer__cluster--leading{justify-content:flex-start}
    .ds-composer__cluster--trailing{justify-content:flex-end}
    /* Outer state matrix (§4.1 mandatory order). Field-control family stroke job — Job A
       affordance per §3.5 — so border escalates rest → hover → focus + 2-layer halo (§4.2). */
    .ds-composer:hover:not(:focus-within):not(.is-focused):not(.is-error):not(.is-disabled){border-color:var(--color-border-hover)}
    .ds-composer:focus-within,.ds-composer.is-focused{border-color:var(--color-border-focus);box-shadow:0 0 0 2px color-mix(in oklch,var(--color-border-focus) 30%,transparent)}
    .ds-composer.is-error{border-color:var(--color-feedback-danger-border);background:var(--color-feedback-danger-bg)}
    .ds-composer.is-error:focus-within,.ds-composer.is-error.is-focused{border-color:var(--color-border-danger);box-shadow:0 0 0 2px color-mix(in oklch,var(--color-border-danger) 30%,transparent)}
    .ds-composer.is-disabled{background:var(--color-surface-sunken);border-color:var(--color-border-disabled);cursor:not-allowed;pointer-events:none}
    .ds-composer.is-disabled .ds-composer__textarea,.ds-composer.is-disabled .ds-composer__input,.ds-composer.is-disabled .ds-btn,.ds-composer.is-disabled .ds-select{opacity:.6;pointer-events:none}
    /* Chrome-shed for inner Button — strip the focus halo only, because the outer Composer's
       halo replaces it. Keep Button's own bg/border/icon/foreground intact: that's what
       carries the button's identity (solid-brand primary, soft-neutral chip, ghost-neutral
       icon). The Button's hover/pressed bg shifts still fire — those communicate "this is
       interactive" inside the larger surface. */
    .ds-composer .ds-btn:focus-visible,.ds-composer .ds-btn.is-focused{box-shadow:none !important;outline:none !important}
    /* Chrome-shed for inner Select (model dropdown) — strip full trigger chrome (bg / border /
       halo) so the Select reads as a transparent label+chevron affordance peer to the primary
       button. action/hover overlay on hover signals interactivity. Panel chrome (the dropdown
       panel, an anchored overlay) is NOT shed — it lives outside the Composer surface per
       §9.3. !important is required to outrun the Select's deep :hover:not(.x):not(.y)…
       specificity stack from §9.27. */
    .ds-composer .ds-select,.ds-composer .ds-select:hover,.ds-composer .ds-select:focus-visible,.ds-composer .ds-select.is-focused,.ds-composer .ds-select.is-open{background:transparent !important;border-color:transparent !important;box-shadow:none !important}
    .ds-composer .ds-select:hover:not(.is-disabled):not(.is-error):not(.is-success){background:var(--color-action-hover) !important}

    /* Avatar (§9.12) — round by default, rounded-square modifier (concentric corners per §2.1.2 — sub-element radius matches its tier). XS=24, S=28, M=32, L=40, XL=48 mirroring the control ramp. Status dot anchored bottom-right; group stacks with negative margin and a 2px ring for separation. Clip layer (.ds-avatar__inner) is split from positioning layer (.ds-avatar) so the status dot's 2px ring can sit at the visible circle's 5 o'clock perimeter without being chopped by overflow:hidden. */
    .ds-avatar{--av-size:var(--control-m,32px);--av-fs:12px;--av-lh:16px;--av-rd:9999px;box-sizing:border-box;display:inline-flex;width:var(--av-size);height:var(--av-size);min-width:var(--av-size);border-radius:var(--av-rd);flex-shrink:0;position:relative}
    .ds-avatar--xs{--av-size:var(--control-xs,24px);--av-fs:12px;--av-lh:16px}
    .ds-avatar--s{--av-size:var(--control-s,28px);--av-fs:12px;--av-lh:16px}
    .ds-avatar--m{--av-size:var(--control-m,32px);--av-fs:12px;--av-lh:16px}
    .ds-avatar--l{--av-size:var(--control-l,40px);--av-fs:14px;--av-lh:20px}
    .ds-avatar--xl{--av-size:var(--control-xl,48px);--av-fs:16px;--av-lh:24px}
    .ds-avatar--square{--av-rd:var(--radius-2s,10px)}
    .ds-avatar--square.ds-avatar--xs,.ds-avatar--square.ds-avatar--s{--av-rd:var(--radius-xs,8px)}
    .ds-avatar--square.ds-avatar--l{--av-rd:var(--radius-s,12px)}
    .ds-avatar--square.ds-avatar--xl{--av-rd:var(--radius-2m,14px)}
    .ds-avatar__inner{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:var(--color-surface-subtle);color:var(--color-text-secondary);font:400 var(--av-fs)/var(--av-lh) var(--font);text-transform:uppercase;user-select:none}
    .ds-avatar__img{width:100%;height:100%;object-fit:cover;display:block}
    .ds-avatar__icon{display:inline-flex;align-items:center;justify-content:center;width:60%;height:60%;color:inherit}
    .ds-avatar__icon>svg{width:100%;height:100%}
    .ds-avatar__status{position:absolute;border-radius:9999px;width:25%;height:25%;bottom:0;right:0;background:var(--color-feedback-success-icon);box-shadow:0 0 0 2px var(--color-surface-default)}
    .ds-avatar__status--offline{background:var(--color-text-tertiary)}
    .ds-avatar__status--busy{background:var(--color-border-danger)}
    .ds-avatar__status--away{background:var(--color-border-warning)}
    .ds-avatar-group{display:inline-flex;align-items:center}
    .ds-avatar-group>.ds-avatar>.ds-avatar__inner{box-shadow:0 0 0 2px var(--color-surface-default)}
    .ds-avatar-group>.ds-avatar+.ds-avatar{margin-left:calc(var(--av-size,32px) * -0.25)}

    /* Banner (§9.10) — persistent in-flow counterpart to Toast. Default = contained at radius-m matching Primer/M3/Atlassian/Vercel/shadcn convention; --full-bleed modifier opts into edge-to-edge radius:0 for top-of-screen system messages. Chrome is intentionally shared with Toast: tinted bg + uniform 1px tone border at feedback/{tone}/border + tone-colored icon. Differentiation from Toast is layout + behavior, NOT chrome.
       Internal architecture (Rev F, May 2026): uniform 8/8 surface padding + square icon wrapper + minimal-offset body wrapper. Member of the "Toast/Banner/Tooltip uniform-8/8 family" — see §9.8 Toast and §9.5 Tooltip for the shared architecture and §6.1.5 for the family rule.
         1. SURFACE padding (--bn-pad: 8) — uniform 8/8 outer ring; buttons living directly in the flex row pick up corner-symmetric inset (8/8) from this padding per §6.1.2.
         2. ICON wrapper internal padding (--bn-icon-pad: 2 symmetric on all sides) — wrapper becomes square 24×24 around the 20-glyph (icon-m + 2px on each side). Square per the family rule: icon wrapper dimensions equal text line-height (20) in both axes. Replaces an earlier V-compensated 24W×24H wrapper that used asymmetric internal padding to achieve 0px multi-line glyph-to-cap alignment; rolled back in favor of the family's uniform architecture. The 2-3px multi-line residual is within §6.1.4 leading-induced inset tolerance.
         3. BODY wrapper internal padding (--bn-body-py: 2 / --bn-body-px: 4) — Banner tier of §6.1.5 (one ramp step H above V to absorb the line-box leading delta; surface-pad 8 carries the bulk of the breathing). Visible 12H (8 surface + 4 body) vs 13V (8 surface + 2 body + ~3 leading) — V dominant by ~1 from leading, matching the system-wide leading-induced-inset pattern.
       The previous Rev D's cluster-based __content + __actions divs are removed — buttons now sit as direct flex children alongside __icon and __body, and the surface padding alone gives them corner-symmetric inset. This matches how Primer's Banner positions its dismiss button and the Figma component's div structure exactly. The "different padding for text vs buttons" goal is preserved (text gets body-wrapper padding, buttons get surface-padding-derived corner inset) without forcing them into named sibling clusters. */
    .ds-banner{--bn-pad:var(--space-s,8px);--bn-icon-pad:var(--space-3xs,2px);--bn-body-py:var(--space-3xs,2px);--bn-body-px:var(--space-2xs,4px);--bn-buttons-gap:var(--space-2xs,4px);--bn-icon:var(--icon-m,20px);--bn-fs:14px;--bn-lh:20px;--bn-rd:var(--radius-m,16px);--bn-bg:var(--color-surface-default);--bn-border:var(--color-border-subtle);--bn-icon-color:var(--color-text-secondary);box-sizing:border-box;display:flex;align-items:center;width:100%;padding:var(--bn-pad);background:var(--bn-bg);border:1px solid var(--bn-border);border-radius:var(--bn-rd);font:400 var(--bn-fs)/var(--bn-lh) var(--font);color:var(--color-text-primary)}
    .ds-banner--full-bleed{--bn-rd:0;border-radius:0;border-left:0;border-right:0}
    .ds-banner:has(.ds-banner__title):has(.ds-banner__description){align-items:flex-start}
    .ds-banner--info{--bn-bg:var(--color-feedback-info-bg);--bn-border:var(--color-feedback-info-border);--bn-icon-color:var(--color-text-info)}
    .ds-banner--success{--bn-bg:var(--color-feedback-success-bg);--bn-border:var(--color-feedback-success-border);--bn-icon-color:var(--color-text-success)}
    .ds-banner--warning{--bn-bg:var(--color-feedback-warning-bg);--bn-border:var(--color-feedback-warning-border);--bn-icon-color:var(--color-text-warning)}
    .ds-banner--danger{--bn-bg:var(--color-feedback-danger-bg);--bn-border:var(--color-feedback-danger-border);--bn-icon-color:var(--color-text-danger)}
    .ds-banner__icon{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:var(--bn-icon-pad);color:var(--bn-icon-color);line-height:1}
    .ds-banner__icon>svg{width:var(--bn-icon);height:var(--bn-icon)}
    .ds-banner__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--space-3xs,2px);padding:var(--bn-body-py) var(--bn-body-px)}
    .ds-banner__title{font:400 var(--bn-fs)/var(--bn-lh) var(--font);color:var(--color-text-primary)}
    .ds-banner__description{font:400 var(--bn-fs)/var(--bn-lh) var(--font);color:var(--color-text-secondary)}
    .ds-banner__buttons{flex-shrink:0;display:inline-flex;align-items:center;gap:var(--bn-buttons-gap)}

    /* Tabs (§9.11, §12.1) — horizontal trigger row + content panel. Underline-only treatment: the list has NO border-bottom, the active trigger paints a rounded text/primary (near-black) underbar (3px, radius-2xs, indented by --tab-px so it sits under the content not under the padding), and HOVER uses the same underbar shape in border/default (gray) — not a backplate. Hover changes (a) text from secondary to primary AND (b) shows a gray underbar previewing where the active bar would land. The two states (hover candidate / active) speak the same visual language and only differ in underbar color (gray → near-black), which makes the gradient from "I'm interested" → "I picked it" feel continuous. The active bar dropped brand color in the May 2026 brand-color audit (§12.1) — switching tab panels is a structural navigation action, not a value selection; near-black carries "this is current" with stronger contrast against the gray hover-bar and without spending the limited brand-color budget that should be reserved for primary CTAs and editable form selections. The --soft variant is a SEPARATE container-style aesthetic for cases where the consumer wants a tonal pill instead of a bar; it's a deliberate exposed knob, not a violation of the §12.1 rule (the rule prohibits *inventing a hybrid* under the default Tabs identity, not exposing a documented fill alternative). Default tier M=32 matches Segmented Control + Button for adjacent-toolbar consistency. */
    .ds-tabs{display:flex;flex-direction:column}
    .ds-tabs__list{display:flex;align-items:center;gap:var(--space-s,8px);margin:0;padding:0 0 var(--space-2xs,4px);list-style:none}
    .ds-tabs__trigger{--tab-h:var(--control-m,32px);--tab-px:var(--space-s,8px);--tab-fs:14px;--tab-lh:20px;--tab-icon:var(--icon-s,16px);--tab-gap:calc(var(--space-2xs,4px) - var(--space-3xs,2px));box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--tab-gap);height:var(--tab-h);padding:0 var(--tab-px);background:transparent;border:0;border-radius:var(--radius-xs,8px);cursor:pointer;font:400 var(--tab-fs)/var(--tab-lh) var(--font);color:var(--color-text-secondary);transition:color .15s ease,background .15s ease;position:relative;text-decoration:none;white-space:nowrap}
    .ds-tabs__trigger:hover:not([aria-selected="true"]):not(:disabled):not(.is-disabled){color:var(--color-text-primary)}
    .ds-tabs__trigger:active:not(:disabled):not(.is-disabled){filter:brightness(.92)}
    .ds-tabs__trigger:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:-4px}
    .ds-tabs__trigger[aria-selected="true"]{color:var(--color-text-primary)}
    .ds-tabs__trigger[aria-selected="true"]::after,.ds-tabs__trigger:hover:not([aria-selected="true"]):not(:disabled):not(.is-disabled)::after{content:"";position:absolute;left:var(--tab-px);right:var(--tab-px);bottom:calc(-1 * var(--space-3xs,2px));height:3px;border-radius:var(--radius-3xs,4px);transition:background .15s ease}
    .ds-tabs__trigger[aria-selected="true"]::after{background:var(--color-text-primary)}
    .ds-tabs__trigger:hover:not([aria-selected="true"]):not(:disabled):not(.is-disabled)::after{background:var(--color-border-default)}
    .ds-tabs__trigger:disabled,.ds-tabs__trigger.is-disabled{color:var(--color-text-disabled);cursor:not-allowed;pointer-events:none}
    .ds-tabs--s .ds-tabs__trigger{--tab-h:var(--control-s,28px);--tab-px:var(--space-xs,6px);--tab-fs:12px;--tab-lh:16px;--tab-icon:var(--icon-2s,14px);--tab-gap:calc(var(--space-2xs,4px) - var(--space-3xs,2px))}
    .ds-tabs--m .ds-tabs__trigger{--tab-h:var(--control-m,32px);--tab-px:var(--space-s,8px);--tab-fs:14px;--tab-lh:20px;--tab-icon:var(--icon-s,16px);--tab-gap:calc(var(--space-2xs,4px) - var(--space-3xs,2px))}
    .ds-tabs--l .ds-tabs__trigger{--tab-h:var(--control-l,40px);--tab-px:var(--space-m,12px);--tab-fs:16px;--tab-lh:24px;--tab-icon:var(--icon-m,20px);--tab-gap:calc(var(--space-xs,6px) - var(--space-3xs,2px))}
    .ds-tabs__icon{display:inline-flex;align-items:center;justify-content:center;width:var(--tab-icon);height:var(--tab-lh);line-height:1;flex-shrink:0;color:inherit}
    .ds-tabs__icon>svg{width:var(--tab-icon);height:var(--tab-icon)}
    .ds-tabs__count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;margin-left:var(--space-2xs,4px);padding:0 var(--space-xs,6px);border:1px solid var(--color-border-subtle);border-radius:var(--radius-2xs,6px);background:var(--color-surface-subtle);color:var(--color-text-secondary);font:400 12px/16px var(--font)}
    .ds-tabs__trigger[aria-selected="true"] .ds-tabs__count{background:var(--color-action-hover);color:var(--color-text-primary)}
    .ds-tabs__label{padding:0 var(--space-3xs,2px)}
    .ds-tabs__panel{padding:var(--space-l,16px) 0;color:var(--color-text-primary);font:400 14px/20px var(--font)}

    /* Combobox (§9.15) — searchable Select. Reuses Input chrome for the trigger and Select panel chrome for the listbox. Empty state shows a centered "No results" line in text/tertiary. The component itself is mostly composition; this CSS only adds the panel position + empty state. */
    .ds-combobox{position:relative;display:inline-flex;flex-direction:column;width:240px}
    .ds-combobox__panel{margin-top:var(--space-2xs,4px);background:var(--color-surface-raised);border:1px solid var(--color-border-subtle);border-radius:var(--radius-s,12px);box-shadow:var(--shadow-3);padding:var(--space-2xs,4px);display:flex;flex-direction:column;gap:var(--space-2xs,4px);max-height:280px;overflow-y:auto;z-index:var(--z-anchored,40)}
    .ds-combobox__empty{padding:var(--space-s,8px);font:400 12px/16px var(--font);color:var(--color-text-tertiary);text-align:center}

    /* Pagination (§9.16) — composed entirely of real Button instances. Three customizable presets,
     * ALL NEUTRAL after the May 2026 brand-color audit (§12.1): pagination is "position in a
     * navigable set," semantically a list-row state, not a value selection. Per the audit it now
     * uses the canonical "current position" treatment (action/hover bg + inset border/default ring)
     * shared by Nav vertical/horizontal/bottom and Select panel selected — see §9.16 spec.
     *   • Default ("ghost") — ghost-neutral rest/arrows + ghost-neutral active with the canonical
     *     ring-and-overlay applied via [aria-current="page"] override below.
     *   • variant="outlined" — outline-neutral rest/arrows (stroke softened to border/subtle) +
     *     outline-neutral active (stroke promoted to border/default + action/hover bg fill).
     *     Hierarchy is now stroke-color contrast + bg, no brand.
     *   • variant="filled" — soft-neutral rest/arrows + solid-neutral active. Lands in the
     *     Linear / Vercel / Primer filled-black lane.
     * Granular *Variant props (arrowVariant, activeVariant, inactiveVariant) still override
     * any preset for mix-and-match — consumers wanting a brand-saturated active page can pass
     * activeVariant:"solid-brand" explicitly, just not as the default. */
    .ds-pagination{display:flex;align-items:center;gap:var(--space-2xs,4px);list-style:none;margin:0;padding:0}
    .ds-pagination--xs{--pg-h:var(--control-xs,24px);--pg-fs:12px;--pg-lh:16px}
    .ds-pagination--s{--pg-h:var(--control-s,28px);--pg-fs:12px;--pg-lh:16px}
    .ds-pagination--m{--pg-h:var(--control-m,32px);--pg-fs:14px;--pg-lh:20px}
    .ds-pagination--l{--pg-h:var(--control-l,40px);--pg-fs:14px;--pg-lh:20px}
    .ds-pagination__page{--btn-px:var(--space-2xs,4px);min-width:var(--btn-h)}
    /* Outlined preset rest stroke softened to border/subtle. */
    .ds-pagination .ds-btn--outline-neutral{--btn-br:var(--color-border-subtle)}
    /* Active page treatment — neutral "current position" pattern matching Nav active / Select
       panel selected / Bottom Nav active. Two preset-scoped overrides apply: */
    /* Default (ghost) active: ghost has no rest chrome, so active adds bg + inset ring. */
    .ds-pagination__page.ds-btn--ghost-neutral[aria-current="page"]{background:var(--color-action-hover);box-shadow:inset 0 0 0 1px var(--color-border-default)}
    /* Outlined active: rest stroke at border/subtle promotes to border/default (one stop darker) +
       action/hover bg fill. Hierarchy = stroke-color contrast + bg. Locks across hover too. */
    .ds-pagination__page.ds-btn--outline-neutral[aria-current="page"],.ds-pagination__page.ds-btn--outline-neutral[aria-current="page"]:hover:not(:disabled){--btn-br:var(--color-border-default);background:var(--color-action-hover)}
    .ds-pagination__ellipsis{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-width:var(--pg-h,var(--control-m,32px));height:var(--pg-h,var(--control-m,32px));color:var(--color-text-secondary);font:400 var(--pg-fs,14px)/var(--pg-lh,20px) var(--font);user-select:none}
    .ds-pagination__status{display:inline-flex;align-items:center;flex-shrink:0;height:var(--pg-h,var(--control-m,32px));padding:0 var(--space-s,8px);color:var(--color-text-secondary);font:400 var(--pg-fs,14px)/var(--pg-lh,20px) var(--font)}
    .ds-pagination__group{display:inline-flex;align-items:center;gap:var(--space-l,16px)}

    /* Chip (§9.17, §3.5.1, §12.1) — interactive label for filter selection, multi-value tagging,
       removable applied filters. Rounded-rectangle at radius-xs (8) — DELIBERATELY not pill,
       per §3.5.1 which reserves pill for shape-coded primitives (Switch, Radio, dot). The
       Chip-vs-Badge differentiation is stroke + behavior: Chip carries 1px border/default
       (Job A — affordance) plus the full state matrix (hover/focus/pressed/selected); Badge
       carries only border/subtle (Job C — definition) and is read-only. At the worst-case
       overlap (Badge M 24-tall vs Button XS 24-tall vs Chip XS 24-tall, all tonal soft fill),
       Chip's stroke at 200-stop and hover affordance distinguish it from the read-only Badge
       at 150-stop, while the smaller-than-Button-XS-default tier (24 ≥ 28 only at S) plus the
       tonal-soft-on-selected default keep Chip distinct from neutral-default Button XS.
       Sizes XS=24 / S=28 mirror Button XS/S so chips compose into the same dense toolbar rows. */
    .ds-chip{--chip-h:var(--control-s,28px);--chip-px:var(--space-xs,6px);--chip-fs:12px;--chip-lh:16px;--chip-rd:var(--radius-xs,8px);--chip-icon:var(--icon-2s,14px);--chip-gap:calc(var(--space-2xs,4px) - var(--space-3xs,2px));--chip-bg:transparent;--chip-fg:var(--color-text-primary);--chip-br:var(--color-border-default);box-sizing:border-box;display:inline-flex;align-items:center;gap:var(--chip-gap);height:var(--chip-h);padding:0 var(--chip-px);background:var(--chip-bg);border:1px solid var(--chip-br);border-radius:var(--chip-rd);color:var(--chip-fg);font:400 var(--chip-fs)/var(--chip-lh) var(--font);cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;white-space:nowrap;user-select:none;text-decoration:none}
    .ds-chip--xs{--chip-h:var(--control-xs,24px);--chip-px:var(--space-xs,6px);--chip-icon:var(--icon-xs,12px)}
    .ds-chip:hover:not(:disabled):not(.is-disabled):not(.is-selected),.ds-chip.is-hover{--chip-bg:var(--color-action-hover);--chip-br:var(--color-border-hover)}
    .ds-chip:active:not(:disabled):not(.is-disabled),.ds-chip.is-pressed{filter:brightness(.92)}
    .ds-chip:focus-visible,.ds-chip.is-focused{outline:0;border-color:var(--color-border-focus);box-shadow:0 0 0 2px color-mix(in oklch,var(--color-border-focus) 30%,transparent)}
    /* Selected state — soft-brand fill + selection/border stroke. The default soft-brand border
       (`blue/100`) sits ~1 stop above the `blue/50` fill and reads as "barely there" — fine for
       button chrome but too quiet for a chip's selected affordance. `selection/border` (blue/300)
       gives ~3 stops of fill-vs-stroke contrast, matching what Pagination does for its active
       page (Pagination's selected page is conceptually "a selected row in a list of pages,"
       which is exactly the same role chip's selected state plays — and §3.1 documents
       selection/border as the canonical "selected indicator" stop). Hover keeps the action/soft
       hover-bg pattern (Standing Rule #5: checked controls darken on hover). */
    /* Selected — neutral "current selection" treatment after May 2026 brand-color audit (§12.1).
       The leading check icon stays brand-colored (small accent) via the .ds-chip.is-selected .ds-chip__icon
       override below — that's the single sanctioned brand touch carrying "this chip is on"; the surface
       (bg + border + label color) stays neutral so a row of selected filter chips doesn't feel like a
       wall of brand color. Matches the Nav active / Select panel selected / Pagination active "neutral
       current-position" treatment with bg + ring chrome. */
    .ds-chip.is-selected{--chip-bg:var(--color-action-hover);--chip-fg:var(--color-text-primary);--chip-br:var(--color-border-default)}
    .ds-chip.is-selected .ds-chip__icon{color:var(--color-text-brand)}
    .ds-chip:disabled,.ds-chip.is-disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
    /* Chip has NO semantic tones (info/success/warning/danger). Material 3, shadcn, Primer, and
       Atlassian all ship chips without severity-coded tones. Chips are interactive toggles (filter
       on/off, tag select) — selected state = brand. Severity belongs on Badge, Toast, Banner. */
    /* Universal letterbox icon wrapper (§6.1.3). */
    .ds-chip__icon{display:inline-flex;align-items:center;justify-content:center;width:var(--chip-icon);height:var(--chip-lh);line-height:1;flex-shrink:0;color:inherit}
    .ds-chip__icon>svg{width:var(--chip-icon);height:var(--chip-icon)}
    /* Dismiss button — small X inside the chip; sits in the trailing icon slot. NOT letterboxed
       (it's a hard-edged control per §6.1 case A), so it's sized to the icon glyph (12px) directly.
       The chip wrapper switches to <div role="button"> when removable to avoid invalid button-in-button HTML. */
    .ds-chip__dismiss{display:inline-flex;align-items:center;justify-content:center;width:var(--chip-icon);height:var(--chip-icon);padding:0;margin:0;border:0;background:transparent;border-radius:var(--radius-3xs,4px);color:inherit;cursor:pointer;flex-shrink:0;opacity:.6;transition:opacity .15s ease,background .15s ease}
    .ds-chip__dismiss>svg{width:100%;height:100%}
    .ds-chip__dismiss:hover{opacity:1;background:var(--color-action-hover)}
    .ds-chip__dismiss:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:1px;opacity:1}
    .ds-chip__label{padding:0 var(--space-3xs,2px)}
    /* No `:has()` per-edge override needed. Raw `--chip-px` is calibrated so the formula
       (chip-h − chip-icon) / 2 − 1px ≈ raw value, eliminating the L/R asymmetry when an icon
       is present. At S (28-tall, 14-icon): formula = (28-14)/2−1 = 6, raw = 6 → 6L/6R ✓ uniform.
       At XS (24-tall, 12-icon): formula = (24-12)/2−1 = 5, raw = 6 → 6L/6R (1px H>V around icon
       glyph; case-B direction is correct — text breathes more horizontally than vertically per §6.1).
       Same fix as Badge's offset-padding rationalization — see history A.10. */

    /* Skeleton (§9.18) — loading-state placeholder. Three primitive shapes (block / text / circle)
       carrying one shimmer animation. Base = surface/subtle (the "absent content" tone),
       highlight sweep at action/hover. Honors prefers-reduced-motion via the global override. */
    .ds-skeleton{display:block;background:var(--color-surface-subtle);border-radius:var(--radius-3xs,4px);position:relative;overflow:hidden;width:100%;height:var(--space-l,16px)}
    .ds-skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,var(--color-action-hover) 50%,transparent 100%);transform:translateX(-100%);animation:dsSkeletonShimmer 1.6s ease-in-out infinite}
    @keyframes dsSkeletonShimmer{to{transform:translateX(100%)}}
    .ds-skeleton--text{height:var(--space-l,16px)}
    .ds-skeleton--text-lg{height:var(--space-xl,24px)}
    .ds-skeleton--circle{border-radius:9999px;width:var(--control-l,40px);height:var(--control-l,40px)}
    .ds-skeleton--block{height:var(--space-2xl,32px)}

    /* Spinner (§9.19) — circular counterpart to Progress (§9.20). Same mental model:
       static track + moving indicator. Track is a full ring at surface/subtle (matching
       Progress's track), indicator is a partial arc at brand (matching Progress's fill)
       that rotates on top. Both layers share the same stroke-width so they overlap
       edge-to-edge — the indicator rides exactly on the track.
         Both layers carry stroke-linecap:round so the arc's end-caps mirror Progress's
       pill-rounded fill — visual rhyme between the two indeterminate primitives.
         Visible arc length = 25 of ~62.83 circumference ≈ 40%, matching Progress's
       40% indeterminate-bar width. Same magnitude, different geometry: linear vs circular.
         Two tones only: brand (default) + neutral (text/secondary). No semantic tones —
       industry-aligned: no major design system (shadcn, M3, Primer, Atlassian, Apple HIG,
       Linear, Vercel) ships semantic tones on a spinner. A spinner communicates a temporal
       state ("loading"), not a semantic state ("danger"). Neutral is for in-button and
       dense chrome contexts where brand competes with the surrounding surface.
         Sized via tier tokens (XS=12 / S=16 / M=20 / L=24) so it composes inside controls
       as a swap-in for the leading icon. Honors prefers-reduced-motion via the global
       override (rotation reduces to 0.01ms, leaving a static partial ring — still readable
       as "indeterminate state" because the track + arc geometry alone communicates that
       meaning, even without motion). */
    /* Sized via the icon ramp (XS=12 / S=16 / M=20 / L=24) so a spinner can replace ANY
       inline icon at the same tier without affecting layout. Stroke values are in the 24-unit
       viewBox space; absolute thickness ≈ stroke × (size/24), so a fixed `2` stroke renders
       ≈1.0px at XS through 2.0px at L — landing in the crisp 1.0–2.0px band where both layers
       anti-alias cleanly. L bumps to 2.5 for slightly more presence at the standalone tier. */
    .ds-spinner{--spin-size:var(--icon-m,20px);--spin-stroke:2;--spin-track:var(--color-surface-subtle);--spin-fill:var(--color-action-solid-brand-bg);display:inline-flex;align-items:center;justify-content:center;width:var(--spin-size);height:var(--spin-size);flex-shrink:0}
    .ds-spinner--xs{--spin-size:var(--icon-xs,12px);--spin-stroke:1.5}
    .ds-spinner--s{--spin-size:var(--icon-s,16px);--spin-stroke:2}
    .ds-spinner--m{--spin-size:var(--icon-m,20px);--spin-stroke:2}
    .ds-spinner--l{--spin-size:var(--icon-l,24px);--spin-stroke:2.5}
    .ds-spinner--neutral{--spin-fill:var(--color-text-secondary)}
    .ds-spinner svg{width:100%;height:100%}
    .ds-spinner svg circle{fill:none;stroke-width:var(--spin-stroke);stroke-linecap:round;transform-origin:center}
    .ds-spinner__track{stroke:var(--spin-track)}
    .ds-spinner__indicator{stroke:var(--spin-fill);stroke-dasharray:25 100;animation:dsSpinnerRotate 1s linear infinite}
    @keyframes dsSpinnerRotate{to{transform:rotate(360deg)}}

    /* Progress (§9.20) — determinate or indeterminate progress bar. Follows Primer's
       guidance: one default fill color (brand), no predefined semantic tone variants.
       If a consumer needs a specific color (quota warning, danger threshold), they
       override --pgs-fill locally — the system doesn't need to sanction named tones
       for a component that communicates temporal progress, not semantic state.
         Track at surface/subtle, fill at brand, pill-rounded ends (9999px radius).
       Determinate version uses a width transition synced to --motion-medium so
       consumers can update --pgs-value smoothly. Indeterminate version slides a
       40%-wide bar across (Material 3 / shadcn pattern). */
    .ds-progress{--pgs-h:4px;--pgs-rd:9999px;--pgs-track:var(--color-surface-subtle);--pgs-fill:var(--color-action-solid-brand-bg);display:block;position:relative;width:100%;height:var(--pgs-h);background:var(--pgs-track);border-radius:var(--pgs-rd);overflow:hidden}
    .ds-progress--m{--pgs-h:6px}
    .ds-progress--l{--pgs-h:8px}
    .ds-progress__fill{display:block;height:100%;background:var(--pgs-fill);border-radius:var(--pgs-rd);width:var(--pgs-value,0%);transition:width var(--motion-medium,250ms) var(--easing-out,ease)}
    .ds-progress--segments{display:flex;overflow:hidden}
    .ds-progress--segments .ds-progress__fill{border-radius:0;flex:none}
    .ds-progress--indeterminate .ds-progress__fill{width:40%;transform:translateX(-100%);animation:dsProgressIndeterminate 1.6s var(--easing-in-out,ease-in-out) infinite}
    @keyframes dsProgressIndeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

    .ds-table-section{--tbl-rd:var(--radius-l,20px);border-radius:var(--tbl-rd);overflow:hidden;border:1px solid var(--color-border-subtle);background:var(--color-surface-default);min-width:600px}
    .ds-table{--tbl-py:var(--space-m,12px);--tbl-px:var(--space-m,12px);--tbl-fs:12px;--tbl-lh:16px;width:100%;border-collapse:collapse;table-layout:fixed;background:transparent}
    .ds-table--s,.ds-table--m,.ds-table--tvp,.ds-table--type{--tbl-py:var(--space-m,12px);--tbl-px:var(--space-m,12px);--tbl-fs:12px;--tbl-lh:16px}
    .ds-table--l{--tbl-py:var(--space-m,12px);--tbl-px:var(--space-m,12px);--tbl-fs:14px;--tbl-lh:20px}
    .ds-table th{padding:var(--tbl-py) var(--tbl-px);font:400 var(--tbl-fs)/var(--tbl-lh) var(--font);color:var(--color-text-primary);text-align:left;vertical-align:top;background:var(--color-surface-quiet);border-bottom:1px solid var(--color-border-subtle);border-right:1px solid var(--color-border-subtle)}
    .ds-table th:last-child{border-right:0}
    .ds-table td{padding:var(--tbl-py) var(--tbl-px);font:400 var(--tbl-fs)/var(--tbl-lh) var(--font);color:var(--color-text-primary);vertical-align:top;border-bottom:1px solid var(--color-border-subtle);border-right:1px solid var(--color-border-subtle);word-wrap:break-word;overflow-wrap:break-word}
    .ds-table td:last-child{border-right:0}
    .ds-table tbody tr:last-child td{border-bottom:0}
    .ds-table tbody tr{transition:background .15s ease}
    .ds-table--interactive tbody tr:hover:not(.is-selected):not(.is-disabled){background:var(--color-action-hover)}
    .ds-table tbody tr.is-selected{background:var(--color-feedback-info-bg)}
    .ds-table tbody tr.is-disabled{color:var(--color-text-disabled);cursor:not-allowed;pointer-events:none}
    .ds-table tbody tr.is-disabled td{color:var(--color-text-disabled)}
    .ds-table__cell--num{text-align:right;font-variant-numeric:tabular-nums}
    .ds-table__cell--actions{text-align:right;width:1%;white-space:nowrap;padding-left:var(--space-2xs,4px);padding-right:var(--space-2xs,4px)}
    .ds-table__cell--select{width:1%;padding-left:var(--tbl-px);padding-right:0}
    .ds-table__actions{display:inline-flex;gap:var(--space-2xs,4px);justify-content:flex-end}
    .ds-table__affix{color:var(--color-text-tertiary);margin-right:var(--space-2xs,4px)}
    .ds-table--sticky{position:relative}
    .ds-table--sticky thead th{position:sticky;top:0;z-index:var(--z-content,10)}
    .ds-table-scroll{max-height:240px;overflow:auto;border-radius:inherit}
    .ds-table--tvp col:nth-child(1){width:35%}.ds-table--tvp col:nth-child(2){width:25%}.ds-table--tvp col:nth-child(3){width:40%}
    .ds-table--type{table-layout:auto}
    .ds-table--type td:last-child,.ds-table--type th:last-child{white-space:nowrap;width:1%}
    .ds-table .t-bar-cell{position:relative}
    .ds-table .t-bar-wrap{position:absolute;top:var(--tbl-py);bottom:var(--tbl-py);left:var(--tbl-px);right:var(--tbl-px);display:flex;align-items:center;gap:var(--space-xs,6px)}
    .ds-table .t-bar{border-radius:var(--radius-xs,8px);background:var(--color-feedback-info-bg);height:100%;flex-shrink:0}
    .ds-table .t-bar-label{font:400 12px/16px var(--font);color:var(--color-text-brand);white-space:nowrap}
    .ds-table .t-swatch{display:inline-block;width:24px;height:24px;border-radius:var(--radius-xs,8px);vertical-align:top}
    .ds-table .t-swatch-lg{width:100%;height:100%;min-height:24px;border-radius:0}

    .token-badge{display:inline-block;width:fit-content;max-width:100%;padding:2px 5px;border-radius:var(--radius-xs,8px);background:var(--color-surface-default);border:1px solid var(--color-border-subtle);font:400 12px/16px var(--font);color:var(--color-text-primary)}
    .token-badge:has(.token-badge__dot){display:inline-flex;align-items:flex-start}
    .token-badge--sem{background:var(--color-surface-subtle)}
    .token-badge__dot{display:inline-block;width:10px;height:10px;border-radius:var(--radius-3xs,4px);overflow:hidden;position:relative;flex-shrink:0;margin:3px 4px 0 0}
    .token-badge__dot.swatch-checker{background-size:6px 6px;background-position:0 0,0 3px,3px -3px,-3px 0}
    .seg-ctrl{--sc-gap:var(--space-2xs,4px);--sc-pad:var(--space-2xs,4px);--sc-rd:var(--radius-xs,8px);display:inline-flex;gap:var(--sc-gap);padding:var(--sc-pad);border-radius:calc(var(--sc-rd) + var(--sc-pad));background:var(--color-surface-quiet);border:0;box-shadow:inset 0 0 0 1px var(--color-border-subtle);margin:16px 0}
    .seg-ctrl--xs{--sc-rd:var(--radius-xs,8px)}
    .seg-ctrl--s{--sc-rd:var(--radius-xs,8px)}
    .seg-ctrl--m{--sc-rd:var(--radius-2m,14px)}
    .seg-ctrl--l{--sc-rd:var(--radius-l,20px)}

function badgeEl(tone, sz, icon, label, dot) {
  var c = "ds-badge ds-badge--" + tone + (sz ? " ds-badge--" + sz : "");
  var h = "<span class=\"" + c + "\">";
  if (dot) h += "<span class=ds-badge__dot></span>";
  else if (icon) h += "<span class=\"ds-badge__icon sf\">" + icon + "</span>";
  if (label) h += "<span class=ds-badge__label>" + esc(label) + "</span>";
  return h + "</span>";
}

function navItemEl(opts) {
  var sz = opts.size || "m";
  var cls = "ds-nav-item ds-nav-item--" + sz;
  if (opts.active) cls += " is-active";
  if (opts.cls) cls += " " + opts.cls;
  var h = "<a class=\"" + cls + "\"" + (opts.indent ? " style=\"--ni-indent:" + opts.indent + "px\"" : "") + " href=\"#\">";
  if (opts.icon) h += "<span class=\"ds-nav-item__icon sf\">" + opts.icon + "</span>";
  h += "<span class=ds-nav-item__label>" + esc(opts.label || "Item") + "</span>";
  if (opts.trailing) h += "<span class=ds-nav-item__trailing>" + esc(opts.trailing) + "</span>";
  if (opts.badge) h += "<span class=ds-nav-item__badge>" + opts.badge + "</span>";
  if (opts.chevron) h += "<span class=\"ds-nav-item__chevron sf" + (opts.collapsed ? " is-collapsed" : "") + "\">" + ICON_CHEVDOWN + "</span>";
  return h + "</a>";
}
