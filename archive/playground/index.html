// ── Bottom Nav (Navigation > Bottom) ───────────────────────────────────
// Documented as a Navigation variant in the IA — see renderNavComp() below for the
// rendered "Bottom" subsection. The class stays `ds-bottom-nav` because the layout
// (stacked icon-above-label, single canonical size, edge-anchored chrome) is meaningfully
// different from the inline nav-item layout; the IA describes this as "Navigation has
// three placements — Vertical, Horizontal, Bottom" while the implementation keeps three
// distinct CSS primitives. Both can be true.
function bottomNavEl(opts) {
  opts = opts || {};
  var items = opts.items || [];
  var cls = "ds-bottom-nav";
  if (opts.floating) cls += " ds-bottom-nav--floating";
  if (opts.iconOnly) cls += " ds-bottom-nav--icon-only";
  var h = "<nav class=\"" + cls + "\" role=\"navigation\" aria-label=\"" + escAttr(opts.ariaLabel || "Main") + "\">";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var iCls = "ds-bottom-nav__item";
    if (it.active) iCls += " is-active";
    if (it.disabled) iCls += " is-disabled";
    var ariaAttr = it.active ? " aria-current=\"page\"" : "";
    h += "<button class=\"" + iCls + "\"" + ariaAttr + (it.disabled ? " disabled" : "") + ">";
    if (it.icon) h += "<span class=\"ds-bottom-nav__icon\" aria-hidden=\"true\">" + it.icon + "</span>";
    if (it.label) h += "<span class=\"ds-bottom-nav__label\">" + esc(it.label) + "</span>";
    h += "</button>";
  }
  h += "</nav>";
  return h;
}

// ── Breadcrumb (Path indicator) ────────────────────────────────────────
// Hierarchical "you are here" navigation. Distinct grammar from Bottom Nav / Nav vertical /
// Nav horizontal: those let the user *browse* siblings; Breadcrumb shows *where you are*
// in a hierarchy and offers ancestor links. Per ARIA APG, the canonical structure is
// `<nav aria-label="Breadcrumb">` wrapping an `<ol>` of items, with `aria-current="page"`
// on the last item. Separators are decorative `<li>` siblings with `aria-hidden="true"`
// (matches shadcn / Radix / Primer implementations).
//
// Items:
//   {label, href}                         → ancestor link (default)
//   {label, current:true}                 → current page (last segment, force-flagged)
//   {icon}                                → leading icon, color inherits
//   {iconOnly:true, label, icon}          → icon-only segment with tooltip carrying label
//   {dropdown:true, label, ...}           → segment is a Dropdown trigger (sibling pages)
//   {ellipsis:true}                       → collapsed-segment indicator (Dropdown trigger
//                                          for hidden ancestors)
//   {hover, focused, disabled}            → demo state hooks for the States section
function breadcrumbEl(opts) {
  opts = opts || {};
  var items = opts.items || [];
  var size = opts.size === "s" ? "s" : "m";
  var cls = "ds-breadcrumb";
  if (size !== "m") cls += " ds-breadcrumb--" + size;
  var h = "<nav aria-label=\"" + escAttr(opts.ariaLabel || "Breadcrumb") + "\"><ol class=\"" + cls + "\">";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var isLast = i === items.length - 1;

    // Ellipsis (collapsed-ancestor indicator) — never the last item, never current.
    if (it.ellipsis) {
      h += "<li class=ds-breadcrumb__item>"
        + "<button type=button class=ds-breadcrumb__ellipsis aria-haspopup=\"menu\" aria-expanded=\"false\" aria-label=\"Show collapsed segments\">"
        + "\u2026"
        + "</button>"
        + "</li>";
      if (!isLast) h += "<li class=ds-breadcrumb__sep aria-hidden=\"true\">/</li>";
      continue;
    }

    var iconHtml = it.icon ? "<span class=ds-breadcrumb__icon aria-hidden=\"true\">" + it.icon + "</span>" : "";

    h += "<li class=ds-breadcrumb__item>";
    if (it.current || (isLast && !it.dropdown)) {
      // Current page — non-interactive label (or icon + label).
      h += "<span class=ds-breadcrumb__current aria-current=\"page\">"
        + iconHtml
        + (it.label != null ? "<span class=ds-breadcrumb__label>" + esc(String(it.label)) + "</span>" : "")
        + "</span>";
    } else if (it.dropdown) {
      // Current segment as a Dropdown trigger (sibling-page picker). Trigger uses
      // soft-neutral chrome with a trailing chevron — the canonical "menu button" per §9.7.
      // The optional `anchorMenu` slot renders the menu panel inside the segment's <li>
      // (which is position:relative) so the panel sits directly under the trigger.
      h += "<button type=button class=ds-breadcrumb__dropdown aria-haspopup=\"menu\" aria-expanded=\"false\""
        + (isLast ? " aria-current=\"page\"" : "")
        + ">"
        + iconHtml
        + "<span class=ds-breadcrumb__label>" + (it.label != null ? esc(String(it.label)) : "") + "</span>"
        + "<span class=ds-breadcrumb__chev aria-hidden=\"true\">" + ICON_CHEVDOWN + "</span>"
        + "</button>";
      if (it.anchorMenu) {
        h += "<div class=ds-breadcrumb__menu-anchor>" + it.anchorMenu + "</div>";
      }
    } else {
      // Ancestor link.
      var linkCls = "ds-breadcrumb__link";
      if (it.iconOnly) linkCls += " ds-breadcrumb__link--icon-only";
      if (it.hover) linkCls += " is-hover";
      if (it.focused) linkCls += " is-focused";
      if (it.disabled) linkCls += " is-disabled";
      var aria = "";
      if (it.iconOnly) aria += " aria-label=\"" + escAttr(it.label || "") + "\"";
      if (it.disabled) aria += " aria-disabled=\"true\"";
      h += "<a class=\"" + linkCls + "\" href=\"" + escAttr(it.href || "#") + "\"" + aria + ">"
        + iconHtml
        + (it.iconOnly ? "" : (it.label != null ? "<span class=ds-breadcrumb__label>" + esc(String(it.label)) + "</span>" : ""))
        + "</a>";
    }
    h += "</li>";

    if (!isLast) {
      h += "<li class=ds-breadcrumb__sep aria-hidden=\"true\">/</li>";
    }
  }
  h += "</ol></nav>";
  return h;
}

// ── Segmented Control ──────────────────────────────────────────────────
// Single-select value picker rendered as a row of segments on a tonal track.
// ARIA: container `role="radiogroup"`, items `role="radio"` with `aria-checked`.
// (The pre-existing `seg-ctrl` host chrome in the playground topbar uses
// `aria-pressed` for its toggle-like view-mode picker; that's a parallel
// implementation we may migrate later. The new component uses radiogroup
// semantics because that's the canonical ARIA for "pick exactly one of these
// values" — Apple HIG, M3, shadcn ToggleGroup all converge on this when
// single-select is the role.)
function segmentedControlEl(opts) {
  opts = opts || {};
  var items = opts.items || [];
  var sz = opts.size || "m";
  var cls = "ds-segmented-control ds-segmented-control--" + sz;
  var h = "<div class=\"" + cls + "\" role=\"radiogroup\" aria-label=\"" + escAttr(opts.ariaLabel || "Options") + "\">";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var iCls = "ds-segmented-control__btn";
    if (it.disabled) iCls += " is-disabled";
    var ariaChecked = it.checked ? "true" : "false";
    var tabIdx = it.checked ? 0 : -1;
    // Icon-only segments have no text to name them, so they need an explicit label (Part 14.3).
    var itAria = it.ariaLabel ? " aria-label=\"" + escAttr(it.ariaLabel) + "\"" : "";
    h += "<button type=\"button\" class=\"" + iCls + "\" role=\"radio\" aria-checked=\"" + ariaChecked + "\" tabindex=\"" + tabIdx + "\"" + itAria + (it.disabled ? " disabled" : "") + ">";
    if (it.leadIcon) h += "<span class=\"ds-segmented-control__icon\" aria-hidden=\"true\">" + it.leadIcon + "</span>";
    if (it.label) h += "<span class=\"ds-segmented-control__label\">" + esc(it.label) + "</span>";
    if (it.trailIcon) h += "<span class=\"ds-segmented-control__icon\" aria-hidden=\"true\">" + it.trailIcon + "</span>";
    if (it.iconOnly) h += "<span class=\"ds-segmented-control__icon\" aria-hidden=\"true\">" + it.iconOnly + "</span>";
    h += "</button>";
  }
  h += "</div>";
  return h;
}

// ── Date Picker ────────────────────────────────────────────────────────
// Renders a static calendar grid for the demo. Real consumers wire this
// up to their own date-state and re-render on month change.
//
// `opts`:
//   year, month (0–11): which month to render. Defaults to May 2026.
//   selected: { year, month, day } — selected cell, gets brand fill.
//   today: { year, month, day } — today marker, gets ring.
//   range: { startY, startM, startD, endY, endM, endD } — optional range.
//   disabledDays: array of day numbers (in current month) to disable.
function datePickerEl(opts) {
  opts = opts || {};
  var year = opts.year != null ? opts.year : 2026;
  var month = opts.month != null ? opts.month : 4; // May
  var sel = opts.selected || null;
  var today = opts.today || null;
  var range = opts.range || null;
  var disabled = opts.disabledDays || [];
  var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var weekdayNames = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  var firstDay = new Date(year, month, 1);
  // ISO weekday (Mon=0): JS getDay returns Sun=0..Sat=6; convert to Mon-first
  var firstWeekday = (firstDay.getDay() + 6) % 7;
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var daysInPrevMonth = new Date(year, month, 0).getDate();
  function inRange(y, m, d) {
    if (!range) return null;
    var t = new Date(y, m, d).getTime();
    var s = new Date(range.startY, range.startM, range.startD).getTime();
    var e = new Date(range.endY, range.endM, range.endD).getTime();
    if (t === s) return "start";
    if (t === e) return "end";
    if (t > s && t < e) return "mid";
    return null;
  }
  var h = "<div class=\"ds-date-picker\" role=\"application\" aria-label=\"" + escAttr(opts.ariaLabel || "Date picker") + "\">";
  // Header
  h += "<div class=\"ds-date-picker__header\">";
  h += "<div class=\"ds-date-picker__nav\">";
  h += "<button type=\"button\" class=\"ds-btn ds-btn--xs ds-btn--ghost-neutral ds-btn--icon-only\" aria-label=\"Previous month\"><span class=\"ds-btn__icon\">" + ICON_CHEVLEFT + "</span></button>";
  h += "</div>";
  h += "<div class=\"ds-date-picker__title\">" + esc(monthNames[month] + " " + year) + "</div>";
  h += "<div class=\"ds-date-picker__nav\">";
  h += "<button type=\"button\" class=\"ds-btn ds-btn--xs ds-btn--ghost-neutral ds-btn--icon-only\" aria-label=\"Next month\"><span class=\"ds-btn__icon\">" + ICON_CHEVRIGHT + "</span></button>";
  h += "</div>";
  h += "</div>";
  // Weekday header
  h += "<div class=\"ds-date-picker__weekdays\">";
  for (var w = 0; w < 7; w++) {
    h += "<div class=\"ds-date-picker__weekday\">" + weekdayNames[w] + "</div>";
  }
  h += "</div>";
  // Day grid
  h += "<div class=\"ds-date-picker__grid\">";
  // Leading out-of-month days
  var leading = firstWeekday;
  for (var i = leading; i > 0; i--) {
    var prevDay = daysInPrevMonth - i + 1;
    h += "<button type=\"button\" class=\"ds-date-picker__day ds-date-picker__day--out-of-month\" tabindex=\"-1\">" + prevDay + "</button>";
  }
  // Current month days
  for (var d = 1; d <= daysInMonth; d++) {
    var cls = "ds-date-picker__day";
    var isSel = sel && sel.year === year && sel.month === month && sel.day === d;
    var isTod = today && today.year === year && today.month === month && today.day === d;
    var rng = inRange(year, month, d);
    if (isTod) cls += " ds-date-picker__day--today";
    if (rng === "mid") cls += " ds-date-picker__day--range-mid";
    if (rng === "start") cls += " ds-date-picker__day--range-start";
    if (rng === "end") cls += " ds-date-picker__day--range-end";
    var isDis = disabled.indexOf(d) !== -1;
    if (isDis) cls += " is-disabled";
    var ariaSel = (isSel || rng === "start" || rng === "end") ? " aria-selected=\"true\"" : "";
    h += "<button type=\"button\" class=\"" + cls + "\"" + ariaSel + (isDis ? " disabled" : "") + ">" + d + "</button>";
  }
  // Trailing out-of-month days to fill 6-row grid (42 cells total)
  var totalCells = leading + daysInMonth;
  var trailing = (Math.ceil(totalCells / 7) * 7) - totalCells;
  // If we're not at 6 rows yet, pad to 6 rows for consistent height
  var rowsUsed = Math.ceil(totalCells / 7);
  if (rowsUsed < 6) trailing += (6 - rowsUsed) * 7;
  for (var t = 1; t <= trailing; t++) {
    h += "<button type=\"button\" class=\"ds-date-picker__day ds-date-picker__day--out-of-month\" tabindex=\"-1\">" + t + "</button>";
  }
  h += "</div>";
  h += "</div>";
  return h;
}

// ── Color Picker ───────────────────────────────────────────────────────
// Static visual demo — the consumer wires up real SL/H/A state and re-renders
// the canvas/hue/opacity handle positions on drag. Composition note: the
// component itself is a composition of system primitives (Segmented Control
// for view-mode at the top, Select + outlined InputGroup for the footer
// mode/value/opacity row, Button XS icon-only for the eyedropper) so changing
// the underlying control chrome flows up automatically.
//
// Layout (top → bottom):
//   1. Segmented Control row (view-mode picker — Spectrum / Grid / Slider, Spectrum first)
//   2. View-conditional 240×240 area: Spectrum = SL canvas (default), Grid = 8×8 swatch
//      palette, Slider = stacked R/G/B sliders
//   3. Sliders row — hue + opacity stacked on the left, eyedropper button on the right
//   4. Footer — mode Select beside an outlined InputGroup (hex value + opacity %)
//
// `opts`:
//   color: hex string for the swatch + canvas backdrop hue (default brand blue)
//   hue: 0–360 hue slider position (default ~220 = blue)
//   sx: 0–100 saturation handle horizontal position (% across canvas)
//   sy: 0–100 lightness handle vertical position (% from top of canvas)
//   opacity: 0–100 opacity slider position (default 100 = fully opaque)
//   mode: footer mode label, "Hex" | "RGB" | "HSL" (default "Hex")
//   view: segmented-control selected value, "Spectrum" | "Grid" | "Slider" (default "Spectrum")
function colorPickerEl(opts) {
  opts = opts || {};
  var color = opts.color || "#3D78D8";
  var hue = opts.hue != null ? opts.hue : 220;
  var sx = opts.sx != null ? opts.sx : 70;
  var sy = opts.sy != null ? opts.sy : 35;
  var opacity = opts.opacity != null ? opts.opacity : 100;
  var mode = opts.mode || "Hex";
  var view = opts.view || "Spectrum";
  // Map hue degree (0–360) to color for the canvas's right gradient stop
  var hueColor = "hsl(" + hue + ",100%,50%)";
  var huePct = (hue / 360) * 100;
  // Hex value shown without the leading "#" — the mode Select on the left already says "Hex",
  // so the # is redundant chrome. Matches Figma / Adobe Color / Sketch / VS Code convention.
  var hexDisplay = String(color).replace(/^#/, "");
  var h = "<div class=\"ds-color-picker\" style=\"--cp-hue:" + hueColor + ";--cp-color:" + escAttr(color) + "\">";
  // Segmented control — view-mode picker at the top of the panel. Three modes match
  // Apple ColorPanel's canonical "Spectrum" / "Grid" / "Slider" trio (image-1 reference).
  // Spectrum sits FIRST (in front) and is the default — it's the standard 2D
  // saturation/lightness canvas that users most-often interact with; placing it in the
  // leading position matches Apple ColorPanel's tab order and means the first segment
  // reads as the canonical entry point. Grid shows a discrete swatch palette; Slider
  // shows stacked R/G/B channel sliders. The CSS stretches the segmented control to
  // the canvas width so the L/R edges line up with the canvas/grid/slider area
  // below — the row reads as "header for the picker surface."
  // Sized at S (28-tall, item radius `radius-xs` 8, container radius 12). Earlier rev
  // used M (32-tall, container radius 14); user feedback (May 17, 2026) noted the
  // M-tier read as too prominent for a "view-mode picker header" — the segmented
  // control is chrome that sits ABOVE the canvas, it doesn't need to compete in
  // height with the form controls in the footer. S-tier (28) is shorter and its
  // container radius (12) sits closer to the picker's outer 16 than M-tier (14) does,
  // so the L/R edges of the segmented track parallel the picker's outer corners
  // more cleanly. Item radius 8 (radius-xs) also lands closer to the Input M radius
  // (10) used in the footer — the segmented item and the footer InputGroup read as
  // proportionally related rather than two competing radius tiers.
  h += "<div class=\"ds-color-picker__segmented\">";
  h += segmentedControlEl({
    size: "s",
    ariaLabel: "Color picker view",
    items: [
      { label: "Spectrum", checked: view === "Spectrum" },
      { label: "Grid", checked: view === "Grid" },
      { label: "Slider", checked: view === "Slider" }
    ]
  });
  h += "</div>";
  // View-conditional 240×240 area — the same outer dimensions regardless of view so
  // swapping segments doesn't shift any geometry below (hue/opacity sliders, eyedropper,
  // and footer all stay anchored). Spectrum is the default; Grid and Slider provide the
  // discrete-swatch and channel-slider alternatives that Apple ColorPanel ships under
  // the same view-picker trio. All three views share the canvas's `radius-xs` (8) so
  // the outer silhouette is identical across views.
  if (view === "Grid") {
    // Grid — 12 cols × 11 rows = 132 swatches at 20×20 each (container 240×220).
    // Top row: 12 grayscale steps (white → black, lightness ramp).
    // Below: 10 color rows × 12 hue bands at 65% saturation, each row a different lightness.
    // Earlier rev was 8×8 = 64 swatches with grayscale as column 0; expanded to 12×11
    // per user request ("add more color square options") to give the grayscale ramp its
    // own horizontal strip and 11 hue bands worth of color real estate. 12 divides 240
    // cleanly (20px cells) and 12 × 30° = 360° gives one swatch per hue band around the
    // wheel. The eye scans hue by column and lightness by row — canonical "Color
    // Palettes" mosaic, matching Apple ColorPanel and Figma's palette density.
    h += "<div class=\"ds-color-picker__grid\" role=\"application\" aria-label=\"Color palette\">";
    var gridCols = 12;
    var grayscaleSteps = 12;
    var colorRows = 10;
    // Selected logic: if the picked color is near-grayscale (sx near 0), mark a cell in
    // the grayscale strip; otherwise mark the closest hue × lightness cell.
    var isGraySelected = sx < 10;
    var selectedGrayCol = Math.round((1 - sy / 100) * (grayscaleSteps - 1));
    if (selectedGrayCol < 0) selectedGrayCol = 0;
    if (selectedGrayCol > grayscaleSteps - 1) selectedGrayCol = grayscaleSteps - 1;
    var selectedColorCol = Math.round((hue / 360) * gridCols) % gridCols;
    var selectedColorRow = Math.round((sy / 100) * (colorRows - 1));
    if (selectedColorRow < 0) selectedColorRow = 0;
    if (selectedColorRow > colorRows - 1) selectedColorRow = colorRows - 1;
    // Top grayscale row — 12 lightness steps from white (100%) → black (0%)
    for (var gsi = 0; gsi < grayscaleSteps; gsi++) {
      var grayL = Math.round(100 - gsi * (100 / (grayscaleSteps - 1)));
      var graySwatch = "hsl(0, 0%, " + grayL + "%)";
      var isGraySel = isGraySelected && (gsi === selectedGrayCol);
      h += "<div class=\"ds-color-picker__grid-cell" + (isGraySel ? " is-selected" : "") + "\" style=\"background:" + graySwatch + "\" role=\"button\" tabindex=\"-1\" aria-label=\"Pick color\"></div>";
    }
    // Color rows — 10 rows × 12 hue bands at 65% saturation; lightness 90% (top) → 18% (bottom)
    for (var cr = 0; cr < colorRows; cr++) {
      var cL = 90 - cr * 8;
      for (var cc = 0; cc < gridCols; cc++) {
        var cHue = cc * (360 / gridCols);
        var colorSwatch = "hsl(" + cHue + ", 65%, " + cL + "%)";
        var isColorSel = !isGraySelected && (cr === selectedColorRow && cc === selectedColorCol);
        h += "<div class=\"ds-color-picker__grid-cell" + (isColorSel ? " is-selected" : "") + "\" style=\"background:" + colorSwatch + "\" role=\"button\" tabindex=\"-1\" aria-label=\"Pick color\"></div>";
      }
    }
    h += "</div>";
  } else if (view === "Slider") {
    // Slider — three stacked R/G/B sliders, each with a channel label (R/G/B), a
    // per-channel gradient track (black → saturated channel), and a numeric value
    // (0–255). Channel values derive from the current hex; demo math: parse the hex
    // string into 8-bit channels. Real consumers wire drag handlers to update the
    // per-channel value and recompose the hex.
    var hexBody = String(color).replace(/^#/, "");
    if (hexBody.length === 3) hexBody = hexBody[0]+hexBody[0]+hexBody[1]+hexBody[1]+hexBody[2]+hexBody[2];
    var rV = parseInt(hexBody.slice(0, 2), 16) || 0;
    var gV = parseInt(hexBody.slice(2, 4), 16) || 0;
    var bV = parseInt(hexBody.slice(4, 6), 16) || 0;
    h += "<div class=\"ds-color-picker__slider-stack\" role=\"group\" aria-label=\"RGB channels\">";
    var channels = [
      { letter: "R", value: rV, cls: "r" },
      { letter: "G", value: gV, cls: "g" },
      { letter: "B", value: bV, cls: "b" }
    ];
    for (var ci = 0; ci < channels.length; ci++) {
      var ch = channels[ci];
      var pct = (ch.value / 255) * 100;
      h += "<div class=\"ds-color-picker__slider-row\">";
      h += "<span class=\"ds-color-picker__slider-row-label\">" + ch.letter + "</span>";
      h += "<div class=\"ds-color-picker__channel-track ds-color-picker__channel-track--" + ch.cls + "\" role=\"slider\" aria-label=\"" + ch.letter + " channel\" aria-valuemin=\"0\" aria-valuemax=\"255\" aria-valuenow=\"" + ch.value + "\">";
      h += "<div class=\"ds-color-picker__channel-handle\" style=\"--pct:" + pct + "\"></div>";
      h += "</div>";
      h += "<span class=\"ds-color-picker__slider-row-value\">" + ch.value + "</span>";
      h += "</div>";
    }
    h += "</div>";
  } else {
    // Spectrum — default 240×240 saturation/lightness canvas.
    h += "<div class=\"ds-color-picker__canvas\" role=\"application\" aria-label=\"Saturation and lightness\">";
    h += "<div class=\"ds-color-picker__canvas-handle\" style=\"--sx:" + sx + ";--sy:" + sy + "\"></div>";
    h += "</div>";
  }
  // Sliders row — Spectrum-only. Hue + opacity stacked vertically on the left (each
  // filling the available width via the `__sliders-tracks` flex column), eyedropper
  // Button XS icon-only anchored to the right. Matches image-2 reference where stacked
  // slider tracks sit alongside a square sample-color button.
  //
  // GATED to Spectrum view per user feedback (May 18, 2026): "is it also necessary to
  // have the slider tracks + hex code dropdown row?" In Grid view the discrete swatches
  // ARE the value picker — a separate hue+opacity row reads as redundant chrome below
  // the palette. In Slider view, the R/G/B channels in the main area already cover the
  // "drag a value" affordance — adding hue+opacity on top duplicates the slider idiom.
  // Hiding the row in non-Spectrum views keeps each mode's content-area maximally
  // focused on its own input mechanism (Spectrum = 2D drag, Grid = swatch click, Slider
  // = channel drag) and lets the picker's outer height shrink to fit. The eyedropper
  // collapses with the row; consumers needing it in Grid/Slider can switch to Spectrum.
  // Industry alignment: Apple ColorPanel's Grid mode (Color Palettes) doesn't show the
  // hue/opacity strip; Sliders mode shows only its own RGB sliders. Same model here.
  if (view === "Spectrum") {
    h += "<div class=\"ds-color-picker__sliders\">";
    h += "<div class=\"ds-color-picker__sliders-tracks\">";
    h += "<div class=\"ds-color-picker__hue\" role=\"slider\" aria-label=\"Hue\" aria-valuemin=\"0\" aria-valuemax=\"360\" aria-valuenow=\"" + hue + "\">";
    h += "<div class=\"ds-color-picker__hue-handle\" style=\"--pct:" + huePct + "\"></div>";
    h += "</div>";
    h += "<div class=\"ds-color-picker__opacity\" role=\"slider\" aria-label=\"Opacity\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"" + opacity + "\">";
    h += "<div class=\"ds-color-picker__opacity-handle\" style=\"--pct:" + opacity + "\"></div>";
    h += "</div>";
    h += "</div>"; // /sliders-tracks
    // Eyedropper button — `Button M ghost-neutral icon-only` (32×32, radius `radius-2s` 10).
    // M-tier is what the bookend formula resolves to once slider tracks return to 12px:
    //   eyedropper height = 2 × --cp-track-h + --cp-gap = 2 × 12 + 8 = 32 = control-m
    // So the button bookends the sliders column on the right, with its top/bottom edges
    // landing flush against the top of the hue track and the bottom of the opacity track
    // — the bookend-formula invariant holds at the new pairing. Rev history: L-tier (40,
    // 16-tall tracks) → M-tier (32, 12-tall tracks, May 17) → XS-tier (24, 8-tall tracks,
    // May 18 morning) → reverted back to M-tier (32, 12-tall tracks, May 18 afternoon)
    // per user feedback: "the eye dropper button should go back to whatever the recommended
    // size is, also the sliders can go back to 12px height." M is the system's dense-default
    // tier (§2.3) so "recommended" lands there; the XS rev shipped briefly on the rationale
    // that smaller tracks force a smaller eyedropper via the bookend formula, but the 24×24
    // button read as visually anemic next to the canvas and footer — at a popover-scale
    // surface, an XS chrome button on the right edge looks subordinate to the point of
    // invisibility. Tertiary fill (`ghost-neutral`) preserves the visual hierarchy decision
    // (eyedropper is a tertiary affordance, recedes from canvas + footer) without forcing
    // the size below M. Industry alignment: Figma / Sketch / Adobe Color all render the
    // eyedropper as a transparent icon-only chrome button at the same scale as their footer
    // inputs (32-tall), not a smaller chip. Glyph at `icon-s` (16) per the M-tier control
    // ramp (§2.3) — slightly larger than the 12-tall slider tracks, which the eye reads
    // as "this is a control, those are tracks" rather than "everything is 12px."
    h += "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--m ds-btn--icon-only ds-color-picker__eyedropper\" aria-label=\"Sample color\">";
    h += "<span class=\"ds-btn__icon sf\">" + ICON_EYEDROPPER + "</span>";
    h += "</button>";
    h += "</div>"; // /sliders
  }
  // Footer: TWO-piece composition per §9.27.1 — a standalone mode `Select` BESIDE
  // an outlined `InputGroup` containing the hex value and opacity. Mode is separated
  // because it's a format/notation preference applied to a value; hex + opacity are
  // joined because they're independently editable parts of the SAME color value.
  //
  // Per §9.27.1's 2-segment-max rule, an InputGroup carries at most 2 inputs joined
  // by a single divider. The mode Select is the 3rd selector and lives outside as a
  // separate field; the user's mental model is "pick a notation, then edit this color
  // value (as <hex>, at <opacity>%)."
  //
  // Chrome is the system default outlined InputGroup (1px `border/default` rest +
  // shared focus halo + 1px `border/subtle` divider between segments). Industry
  // alignment for the SEPARATED mode pattern: Figma / Adobe Color / Sketch / VS Code
  // all render the mode dropdown beside (not joined into) the color value field.
  //
  // Earlier rev briefly joined all three into one filled InputGroup on the "compound
  // editor" rationale; reverted because (a) it mis-modeled mode as a value-segment
  // when it's actually a format preference, and (b) shipping a `--filled` variant
  // with one consumer violated §2.2.1 anti-bloat. See §9.27.1 + history §B.25.
  //
  // Segment widths — hex flex-grows (`flex: 1 1 0`) to fill the remaining track;
  // opacity hugs its content at `width: 64px` (enough for "100" + the trailing "%"
  // suffix with comfortable breathing). The divider sits naturally at the boundary
  // between the two segments, with the hex value reading as the dominant data and
  // the opacity reading as the small "modifier" on the right. This matches the
  // Figma / Adobe Color / Sketch / VS Code convention where the hex value is the
  // visual subject and alpha is a small numeric field beside it.
  //
  // Rev history: an intermediate rev shipped both segments at `flex: 1 1 0` for a
  // 50/50 split on the rationale that "the eye registers them as paired editable
  // parts of one color value." User feedback (May 17, 2026) — "change it back so
  // the 2nd input category hugs the content rather than the 2 slots sharing equal
  // space" — confirmed the hug-content treatment reads more cleanly: hex (6 hex
  // chars at monospace = visually wide) gets the room it needs, opacity (2-3
  // digits + suffix = visually narrow) gets a tight slot, and the divider lands
  // at the natural data boundary rather than at a forced midpoint. `min-width: 0`
  // on the hex prevents the flex child from refusing to shrink below its content's
  // intrinsic size if the picker is ever rendered in a tighter parent.
  //
  // Hex Input carries the inline `colorSwatch` (small square preview filled with
  // the picked color). Earlier rev (May 2026) shipped the picker's hex Input
  // swatch-less on the "canvas above already shows the color" rationale; reverted
  // because the user-supplied Cursor color picker reference shows the swatch as a
  // load-bearing affordance that immediately tells the user "this field is a
  // color." The canvas above is for editing; the swatch is for confirming the
  // picked value at-a-glance inside the footer row. Both can be true; the
  // redundancy is welcome at the read level. The standalone Color Input trigger
  // (the picker's anchor outside this panel) already carries the same swatch, so
  // the picker and its trigger now share the same chrome for the hex value —
  // continuous visual identity across collapsed and expanded states.
  //
  // The `.ds-color-picker__footer` wrapper uses `gap: space-s (8px)` — the default
  // cluster gap from §6.5 — to separate the Mode Select from the InputGroup.
  h += "<div class=\"ds-color-picker__footer\">";
  h += selectEl({ size: "m", value: mode, width: "64px" });
  h += inputGroupEl({
    size: "m",
    children: [
      inputEl({ size: "m", value: hexDisplay, colorSwatch: color, mono: true, flex: "1 1 0", minWidth: "0" }),
      inputEl({ size: "m", value: String(opacity), suffix: "%", mono: true, width: "64px" })
    ]
  });
  h += "</div>";
  h += "</div>";
  return h;
}

// ── Drop Zone ──────────────────────────────────────────────────────────
// Drop Zone helper returns ONLY the dashed-border drop surface. When a consumer
// needs to show uploaded files alongside the drop zone, they pass `files` and
// the helper renders the file list as a SIBLING `<ul>` below — drop zone stays
// interactive at the top, file list shows below. See §9.25 for the rationale
// (industry-canonical pattern, replacing the earlier dashed→solid "filled
// state" which broke the upload affordance).
function dropZoneEl(opts) {
  opts = opts || {};
  var cls = "ds-dropzone";
  if (opts.hover) cls += " is-hover";
  if (opts.focused) cls += " is-focused";
  if (opts.error) cls += " is-error";
  if (opts.disabled) cls += " is-disabled";
  // Generic placeholder copy per §7.3 — Drop Zone's job in docs is to show the visual
  // treatment of the upload affordance; the copy is "Title" + "Description" so the
  // typographic hierarchy is the subject. Consumers override per use case.
  var title = opts.title || "Title";
  var hint = opts.hint || "Description";
  var actionLabel = opts.actionLabel; // optional explicit "Browse" button below
  // When the drop zone contains a real <button> (browse action), the outer
  // MUST switch to <div role="button"> — nesting <button> inside <button> is
  // invalid HTML. Same pattern Chip removable uses (§9.17).
  var hasInnerButton = !!actionLabel;
  var role = hasInnerButton ? "div" : "button";
  var typeAttr = role === "button" ? " type=\"button\"" : "";
  var a11yRole = hasInnerButton ? " role=\"button\" tabindex=\"0\"" : "";

  var h = "<" + role + " class=\"" + cls + "\"" + typeAttr + a11yRole;
  if (opts.disabled) {
    if (role === "button") h += " disabled";
    h += " aria-disabled=\"true\"";
  }
  h += ">";
  h += "<div class=\"ds-dropzone__icon\">" + (opts.icon || ICON_CLOUD_UPLOAD) + "</div>";
  h += "<div class=\"ds-dropzone__title\">" + esc(title) + "</div>";
  if (hint) h += "<div class=\"ds-dropzone__hint\">" + esc(hint) + "</div>";
  if (actionLabel) {
    h += "<div class=\"ds-dropzone__actions\">";
    h += "<button type=\"button\" class=\"ds-btn ds-btn--outline-neutral ds-btn--s\">" + esc(actionLabel) + "</button>";
    h += "</div>";
  }
  h += "</" + role + ">";

  // File list — sibling of the drop zone, not inside it. Each row is modeled
  // after single-row Toast (§9.8): icon | body (name + size inline) | trailing
  // remove button, all on one row with min-height --control-l (40), uniform
  // --space-s (8) padding, --radius-m (16) corners (§2.1.2 inverse-rule
  // derived from inner Button XS at --radius-xs 8 + inset 8). See §9.25 +
  // the .ds-dropzone-list / .ds-dropzone-file CSS. Renderer accepts files
  // as either a `{name, size}` object array or a plain string array (string
  // = name only, no size).
  if (opts.files && opts.files.length) {
    h += "<ul class=\"ds-dropzone-list\">";
    for (var i = 0; i < opts.files.length; i++) {
      var f = opts.files[i];
      var fname = typeof f === "string" ? f : f.name;
      var fsize = typeof f === "string" ? "" : (f.size || "");
      h += "<li class=\"ds-dropzone-file\">";
      h += "<span class=\"ds-dropzone-file__icon\" aria-hidden=\"true\">" + ICON_CIRCLE + "</span>";
      h += "<div class=\"ds-dropzone-file__body\">";
      h += "<span class=\"ds-dropzone-file__name\">" + esc(fname) + "</span>";
      if (fsize) h += "<span class=\"ds-dropzone-file__size\">" + esc(fsize) + "</span>";
      h += "</div>";
      h += "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--xs ds-btn--icon-only ds-dropzone-file__remove\" aria-label=\"Remove " + escAttr(fname) + "\"><span class=\"ds-btn__icon\">" + ICON_XMARK + "</span></button>";
      h += "</li>";
    }
    h += "</ul>";
  }
  return h;
}

      {name:"File 2.png", size:"1 MB"},

    ]}) + "</div>",
    "&lt;DropZone&gt;\n  &lt;DropZone.Action&gt;Button&lt;/DropZone.Action&gt;\n&lt;/DropZone&gt;\n&lt;DropZone.FileList&gt;\n  &lt;DropZone.File name=\"File 1.png\" size=\"1 MB\" /&gt;\n  &lt;DropZone.File name=\"File 2.png\" size=\"1 MB\" /&gt;\n  &lt;DropZone.File name=\"File 3.png\" size=\"1 MB\" /&gt;\n&lt;/DropZone.FileList&gt;"
  ));

function inputEl(opts) {
  var sz = opts.size || "m";
  var cls = "ds-input ds-input--" + sz;
  if (opts.mono) cls += " ds-input--mono";
  if (opts.hover) cls += " is-hover";
  if (opts.focused) cls += " is-focused";
  if (opts.error) cls += " is-error";
  if (opts.success) cls += " is-success";
  if (opts.disabled) cls += " is-disabled";
  // `flex` / `width` are escape hatches for inline sizing — typically used when the input
  // is composed inside an `.ds-input-group` and needs to grow / shrink to a specific track.
  // Off the InputGroup, Input defaults to width:100% (Input's own CSS), so these props are
  // no-ops unless the consumer is explicitly arranging multiple inputs in a row.
  var style = "";
  if (opts.flex != null) style += "flex:" + opts.flex + ";";
  if (opts.width != null) style += "width:" + opts.width + ";";
  if (opts.minWidth != null) style += "min-width:" + opts.minWidth + ";";
  var h = "<div class=\"" + cls + "\"" + (style ? " style=\"" + style + "\"" : "") + ">";
  if (opts.colorSwatch) h += "<span class=ds-input__swatch role=img aria-label=\"Color preview\" style=\"background:" + escAttr(opts.colorSwatch) + "\"></span>";
  if (opts.leadIcon) h += "<span class=\"ds-input__icon sf\" aria-hidden=true>" + opts.leadIcon + "</span>";
  if (opts.prefix) h += "<span class=ds-input__affix>" + esc(opts.prefix) + "</span>";
  // A11y (Part 14.1): error → aria-invalid; required → required+aria-required;
  // describedById links the field to its caption / validation message.
  var inAria = "";
  if (opts.error) inAria += " aria-invalid=true";
  if (opts.required) inAria += " required aria-required=true";
  if (opts.ariaLabel) inAria += " aria-label=\"" + escAttr(opts.ariaLabel) + "\"";
  if (opts.describedById) inAria += " aria-describedby=\"" + escAttr(opts.describedById) + "\"";
  // `inputAttrs` is a raw passthrough for composed roles — Combobox passes role=combobox +
  // aria-autocomplete/aria-expanded/aria-controls here so the Input field becomes the combobox.
  if (opts.inputAttrs) inAria += " " + opts.inputAttrs;
  h += "<input class=ds-input__field type=\"" + (opts.type || "text") + "\" placeholder=\"" + esc(opts.placeholder || "Input") + "\"" + (opts.value ? " value=\"" + escAttr(opts.value) + "\"" : "") + (opts.disabled ? " disabled" : "") + inAria + ">";
  if (opts.suffix) h += "<span class=ds-input__affix>" + esc(opts.suffix) + "</span>";
  if (opts.clearable) h += "<button type=button class=ds-input__action aria-label=\"Clear\">" + ICON_XMARK + "</button>";
  if (opts.passwordToggle) h += "<button type=button class=ds-input__action aria-label=\"Toggle visibility\">" + (opts.revealed ? ICON_EYE_SLASH : ICON_EYE) + "</button>";
  if (opts.trailIcon) h += "<span class=\"ds-input__icon sf\" aria-hidden=true>" + opts.trailIcon + "</span>";
  if (opts.stepper) {
    h += "<span class=ds-input__stepper>"
      + "<button type=button class=ds-input__stepper-btn aria-label=\"Increment\"" + (opts.disabled ? " disabled" : "") + ">" + ICON_CHEVUP + "</button>"
      + "<button type=button class=ds-input__stepper-btn aria-label=\"Decrement\"" + (opts.disabled ? " disabled" : "") + ">" + ICON_CHEVDOWN + "</button>"
      + "</span>";
  }
  h += "</div>";
  return h;
}

function renderInput() {

    "comp-inp-sizes",

// Shared ARIA passthrough for selection-control inputs (Part 14.1): required/aria-required,
// aria-invalid on error, aria-describedby for caption/validation, optional aria-label.
function selectionAria(opts) {
  var a = "";
  if (opts.required) a += " required aria-required=true";
  if (opts.invalid) a += " aria-invalid=true";
  if (opts.describedById) a += " aria-describedby=\"" + escAttr(opts.describedById) + "\"";
  if (opts.ariaLabel) a += " aria-label=\"" + escAttr(opts.ariaLabel) + "\"";
  return a;
}

function checkboxEl(opts) {
  var sz = opts.size || "m";
  var cls = "ds-checkbox ds-checkbox--" + sz;
  if (opts.hover) cls += " is-hover";
  if (opts.focused) cls += " is-focused";
  if (opts.checked) cls += " is-checked";
  if (opts.indeterminate) cls += " is-indeterminate";
  if (opts.disabled) cls += " is-disabled";
  var glyph = opts.indeterminate ? ICON_MINUS : ICON_CHECKMARK;
  var ariaChecked = opts.indeterminate ? " aria-checked=mixed" : "";
  var dataInd = opts.indeterminate ? " data-indeterminate=true" : "";
  return "<span class=\"" + cls + "\">"
    + "<input type=checkbox class=ds-checkbox__input" + (opts.checked ? " checked" : "") + (opts.disabled ? " disabled" : "") + ariaChecked + dataInd + selectionAria(opts) + ">"
    + "<span class=ds-checkbox__icon aria-hidden=true>" + glyph + "</span>"
    + "</span>";
}

function checkboxRow(opts) {

  var h = "<label class=\"" + cls + "\">";
  h += checkboxEl(Object.assign({}, opts, {size: innerSz}));
  if (opts.leadingIcon) h += "<span class=\"ds-checkbox-row__leading\" aria-hidden=true>" + opts.leadingIcon + "</span>";
  h += "<span class=ds-checkbox-row__text>";
  h += "<span class=ds-checkbox-row__label>" + esc(opts.label || "Checkbox") + "</span>";

function fieldsetEl(opts) {
  var cls = "ds-fieldset";
  if (opts.disabled) cls += " is-disabled";
  var styleAttr = opts.width ? " style=\"width:" + opts.width + "\"" : "";
  // A11y (Part 14.1): validation lives on the GROUP, not the individual controls. The fieldset
  // gets aria-invalid on error; caption + validation get generated ids referenced via
  // aria-describedby so screen readers connect the helper/error text to the group.
  var fid = ++uidCounter;
  var capId = opts.caption ? "fs-cap-" + fid : "";
  var valId = opts.validation ? "fs-val-" + fid : "";
  var describedBy = [capId, valId].filter(Boolean).join(" ");
  var isError = opts.validationVariant === "error";
  var fsAria = (isError ? " aria-invalid=true" : "") + (describedBy ? " aria-describedby=\"" + describedBy + "\"" : "");
  var h = "<fieldset class=\"" + cls + "\"" + styleAttr + fsAria + ">";
  h += "<legend class=ds-fieldset__legend>" + esc(opts.label || "Title");
  if (opts.required) h += "<span class=ds-fieldset__required aria-hidden=true>*</span>";
  h += "</legend>";
  if (opts.caption) h += "<span class=ds-fieldset__caption id=\"" + capId + "\">" + esc(opts.caption) + "</span>";
  var itemsCls = "ds-fieldset__items" + (opts.horizontal ? " ds-fieldset__items--horizontal" : "");
  h += "<div class=\"" + itemsCls + "\">" + (opts.items || "") + "</div>";
  if (opts.validation) {
    var vc = "ds-fieldset__validation";
    if (opts.validationVariant === "error") vc += " ds-fieldset__validation--error";
    else if (opts.validationVariant === "success") vc += " ds-fieldset__validation--success";
    h += "<span class=\"" + vc + "\" id=\"" + valId + "\">" + esc(opts.validation) + "</span>";
  }
  h += "</fieldset>";
  return h;
}

function switchEl(opts) {

    + "</span>";

function switchRow(opts) {

  if (opts.leadingIcon) h += "<span class=\"ds-switch-row__leading\" aria-hidden=true>" + opts.leadingIcon + "</span>";
  h += "<span class=ds-switch-row__text>";
  h += "<span class=ds-switch-row__label>" + esc(opts.label || "Switch") + "</span>";

function menuEl(opts) {
  opts = opts || {};
  var sz = opts.size || "m";
  var cls = "ds-menu";
  if (sz !== "m") cls += " ds-menu--" + sz;
  var items = opts.items || [];
  var inner = "";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.separator) { inner += "<hr class=ds-menu__separator role=separator>"; continue; }
    if (it.group) { inner += "<div class=ds-menu__group-label role=presentation>" + esc(it.group) + "</div>"; continue; }
    var icls = "ds-menu__item";
    if (it.destructive) icls += " ds-menu__item--destructive";
    if (it.disabled) icls += " is-disabled";
    if (it.focused) icls += " is-focused";
    if (it.hover) icls += " is-hover";
    var role = ' role="menuitem"';
    var disabledAttr = it.disabled ? ' aria-disabled="true"' : "";
    var tabAttr = ' tabindex="-1"';
    var iconHtml = it.icon ? '<span class="ds-menu__icon sf" aria-hidden="true">' + it.icon + "</span>" : "";
    var labelHtml = '<span class="ds-menu__label">' + esc(it.label || "") + "</span>";
    var trailingHtml = "";
    if (it.kbd) trailingHtml = '<span class="ds-menu__keys">' + kbdGroup(it.kbd, "ds-menu__kbd") + "</span>";
    else if (it.submenu) trailingHtml = '<span class="ds-menu__chev sf" aria-hidden="true">' + ICON_CHEVRIGHT + "</span>";
    inner += '<div class="' + icls + '"' + role + tabAttr + disabledAttr + ">" + iconHtml + labelHtml + trailingHtml + "</div>";
  }
  // Optional id lets a trigger point at the panel via aria-controls (Part 14.2).
  return '<div class="' + cls + '" role="menu"' + (opts.id ? ' id="' + escAttr(opts.id) + '"' : "") + ">" + inner + "</div>";
}

function selectPanelEl(items, panelId) {
  // A11y (Part 14.2 / §9.3): panel is a listbox; each row is an option carrying aria-selected;
  // separators/group labels are presentational so screen readers skip them.
  var h = "<div class=ds-select-panel role=listbox" + (panelId ? " id=" + panelId : "") + ">";
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.separator) {
      h += "<div class=ds-select-panel__separator role=presentation></div>";
      continue;
    }
    if (it.group) {
      h += "<div class=ds-select-panel__group-label role=presentation>" + esc(it.group) + "</div>";
      continue;
    }
    var icls = "ds-select-panel__item";
    if (it.selected) icls += " is-selected";
    if (it.disabled) icls += " is-disabled";
    h += "<div class=\"" + icls + "\" role=option aria-selected=" + (it.selected ? "true" : "false") + (it.disabled ? " aria-disabled=true" : "") + "><span class=ds-select-panel__text>" + esc(it.label || "") + "</span><span class=\"ds-select-panel__check sf\" aria-hidden=true>" + ICON_CHECKMARK + "</span></div>";
  }
  h += "</div>";
  return h;
}

function selectEl(opts) {
  opts = opts || {};
  var sz = opts.size || "m";
  var cls = "ds-select ds-select--" + sz;
  if (opts.hover) cls += " is-hover";
  if (opts.focused) cls += " is-focused";
  if (opts.open) cls += " is-open";
  if (opts.error) cls += " is-error";
  if (opts.success) cls += " is-success";
  if (opts.disabled) cls += " is-disabled";
  var items = opts.items;
  if (opts.open && (!items || !items.length)) {
    items = [
      {label:"Option 1"},
      {label:"Option 2", selected:true},
      {label:"Option 3", disabled:true},
      {separator:true},
      {group:"Group"},
      {label:"Option 4"}
    ];
  }
  // `flex` / `width` escape hatches — see inputEl. Typically used when composing inside an
  // `.ds-input-group` where one segment must hug its content (mode select) while another
  // flex-grows (the value input).
  var wrapStyle = "";
  if (opts.flex != null) wrapStyle += "flex:" + opts.flex + ";";
  if (opts.width != null) wrapStyle += "width:" + opts.width + ";";
  if (opts.minWidth != null) wrapStyle += "min-width:" + opts.minWidth + ";";
  var h = "<div class=\"ds-select-wrap ds-select-wrap--" + sz + "\"" + (wrapStyle ? " style=\"" + wrapStyle + "\"" : "") + ">";
  // A11y (Part 14.2): the trigger announces it opens a listbox and reflects open state.
  // When the panel is rendered (open demos) it gets an id the trigger points at via aria-controls.
  var panelId = (opts.open && items && items.length) ? ("ds-select-panel-" + (++uidCounter)) : "";
  var trigAria = " aria-haspopup=listbox aria-expanded=" + (opts.open ? "true" : "false");
  if (panelId) trigAria += " aria-controls=" + panelId;
  if (opts.error) trigAria += " aria-invalid=true";
  if (opts.required) trigAria += " aria-required=true";
  if (opts.ariaLabel) trigAria += " aria-label=\"" + escAttr(opts.ariaLabel) + "\"";
  if (opts.describedById) trigAria += " aria-describedby=\"" + escAttr(opts.describedById) + "\"";
  h += "<button type=button class=\"" + cls + "\"" + (opts.disabled ? " disabled" : "") + trigAria + ">";
  if (opts.leadIcon) h += "<span class=\"ds-select__icon sf\" aria-hidden=true>" + opts.leadIcon + "</span>";
  if (opts.value) h += "<span class=ds-select__value>" + esc(opts.value) + "</span>";
  else h += "<span class=ds-select__placeholder>" + esc(opts.placeholder != null ? opts.placeholder : "Select") + "</span>";
  h += "<span class=\"ds-select__chevron sf\" aria-hidden=true>" + ICON_CHEVDOWN + "</span>";
  h += "</button>";
  if (opts.open && items && items.length) h += selectPanelEl(items, panelId);
  h += "</div>";
  return h;
}

// InputGroup (§9.27) — joined-field composition primitive. Wraps an array of pre-rendered
// segments (Input / Select / Button HTML strings) inside a single bordered container with
// internal dividers and one shared focus halo.
//
// Sizing — pass the same `size` to the group and to every child segment so the outer radius
// and inner control heights stay in lockstep. The group itself has no explicit height; it
// inherits the height of its inner controls.
//
// Segment widths — segments default to their natural Input/Select sizing (Input is
// `width: 100%`, Select-wrap is `width: 100%`). When one segment must hug its content (e.g.,
// a mode select) and another must flex-grow (e.g., the value input), pass `flex` / `width`
// to the segment helpers themselves (supported by `inputEl` / `selectEl`).
function inputGroupEl(opts) {
  opts = opts || {};
  var sz = opts.size || "m";
  var cls = "ds-input-group ds-input-group--" + sz;
  if (opts.error) cls += " is-error";
  if (opts.success) cls += " is-success";
  if (opts.disabled) cls += " is-disabled";
  if (opts.focused) cls += " is-focused";
  var style = "";
  if (opts.width != null) style += "width:" + opts.width + ";";
  var h = "<div class=\"" + cls + "\"" + (style ? " style=\"" + style + "\"" : "") + ">";
  var children = opts.children || [];
  for (var i = 0; i < children.length; i++) h += children[i];
  h += "</div>";
  return h;
}

function textareaEl(opts) {
  var sz = opts.size || "m";
  var cls = "ds-textarea ds-textarea--" + sz;
  if (opts.error) cls += " is-error";
  if (opts.success) cls += " is-success";
  if (opts.focused) cls += " is-focused";
  if (opts.mono) cls += " ds-textarea--mono";
  if (opts.resize === "none") cls += " ds-textarea--resize-none";
  else if (opts.resize === "horizontal") cls += " ds-textarea--resize-h";
  else if (opts.resize === "both") cls += " ds-textarea--resize-both";
  if (opts.disabled) cls += " is-disabled";
  var attrs = "";
  if (opts.placeholder) attrs += " placeholder=\"" + escAttr(opts.placeholder) + "\"";
  if (opts.disabled) attrs += " disabled";
  if (opts.rows) attrs += " style=\"--txa-rows:" + opts.rows + "\"";
  // A11y (Part 14.1): same field wiring as inputEl.
  if (opts.error) attrs += " aria-invalid=true";
  if (opts.required) attrs += " required aria-required=true";
  if (opts.ariaLabel) attrs += " aria-label=\"" + escAttr(opts.ariaLabel) + "\"";
  if (opts.describedById) attrs += " aria-describedby=\"" + escAttr(opts.describedById) + "\"";
  return "<textarea class=\"" + cls + "\"" + attrs + ">" + (opts.value ? esc(opts.value) : "") + "</textarea>";
}

var dlgSeq = 0;
function dialogEl(opts) {
  opts = opts || {};
  var uid = ++dlgSeq;
  var titleId = "dlg-title-" + uid;
  var descId = "dlg-desc-" + uid;
  var dlgCls = "ds-dialog" + (opts.danger ? " ds-dialog--danger" : "");
  var role = opts.alertDialog ? "alertdialog" : "dialog";
  var title = opts.title != null ? esc(String(opts.title)) : "Dialog";
  var descRaw = opts.description != null ? String(opts.description) : "";
  // aria-describedby points at the description when present (Part 14.5).
  var descHtml = descRaw ? "<p class=\"ds-dialog__description\" id=\"" + descId + "\">" + esc(descRaw) + "</p>" : "";
  var body = opts.body != null ? opts.body : "";
  var closeBtn = opts.hideClose ? "" : "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--s ds-btn--icon-only ds-dialog__close\" aria-label=\"Close\"><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_XMARK + "</span></button>";
  var footerCls = "ds-dialog__footer" + (opts.stacked ? " ds-dialog__footer--stacked" : "");
  var footerBtns;
  if (opts.footerButtons && opts.footerButtons.length) {
    footerBtns = opts.footerButtons.join("");
  } else if (opts.danger) {
    footerBtns = "<button type=\"button\" class=\"ds-btn ds-btn--soft-neutral ds-btn--s\">Button</button>"
      + "<button type=\"button\" class=\"ds-btn ds-btn--soft-danger ds-btn--s\">Button</button>";
  } else {
    footerBtns = "<button type=\"button\" class=\"ds-btn ds-btn--soft-neutral ds-btn--s\">Button</button>"
      + "<button type=\"button\" class=\"ds-btn ds-btn--solid-brand ds-btn--s\">Button</button>";
  }
  var bodyCls = "ds-dialog__body" + (opts.scrollBody ? " ds-dialog__body--scroll" : "");
  var bodyHtml = body ? "<div class=\"" + bodyCls + "\">" + body + "</div>" : "";
  return "<div class=\"" + dlgCls + "\" role=\"" + role + "\" aria-modal=\"true\" aria-labelledby=\"" + titleId + "\"" + (descRaw ? " aria-describedby=\"" + descId + "\"" : "") + ">"
    + "<div class=\"ds-dialog__header\">"
    +   "<div class=\"ds-dialog__header-text\">"
    +     "<h3 class=\"ds-dialog__title\" id=\"" + titleId + "\">" + title + "</h3>"
    +     descHtml
    +   "</div>"
    +   closeBtn
    + "</div>"
    + bodyHtml
    + "<div class=\"" + footerCls + "\">" + footerBtns + "</div>"
    + "</div>";
}

function toastEl(opts) {
  opts = opts || {};
  var tone = opts.tone || "neutral";
  var cls = "ds-toast";
  if (tone !== "neutral") cls += " ds-toast--" + tone;

  var iconOpt = (opts.icon === undefined) ? true : opts.icon;
  var iconHtml = "";
  if (iconOpt) {
    var glyph = (iconOpt === true) ? ICON_CIRCLE : iconOpt;
    iconHtml = "<span class=\"ds-toast__icon\" aria-hidden=\"true\">" + glyph + "</span>";
  }

  var title = opts.title != null ? esc(String(opts.title)) : "";
  var desc = opts.description != null ? esc(String(opts.description)) : "";
  var bodyContent = "";
  if (title) bodyContent += "<div class=\"ds-toast__title\">" + title + "</div>";
  if (desc) bodyContent += "<div class=\"ds-toast__description\">" + desc + "</div>";
  if (!bodyContent && opts.text != null) bodyContent = "<div class=\"ds-toast__title\">" + esc(String(opts.text)) + "</div>";
  if (!bodyContent) bodyContent = "<div class=\"ds-toast__title\">Toast</div>";
  var bodyHtml = "<div class=\"ds-toast__body\">" + bodyContent + "</div>";

  var inlineLabels = [];
  if (opts.inlineActions) {
    inlineLabels = Array.isArray(opts.inlineActions) ? opts.inlineActions : [opts.inlineActions];
  } else if (opts.action) {
    inlineLabels = Array.isArray(opts.action) ? opts.action : [opts.action];
  }
  inlineLabels = inlineLabels.slice(0, 2);
  var inlineBtns = "";
  for (var ai = 0; ai < inlineLabels.length; ai++) {
    var isLast = ai === inlineLabels.length - 1;
    var inlineFill = (inlineLabels.length > 1 && isLast) ? "ds-btn--solid-brand" : "ds-btn--soft-neutral";
    inlineBtns += "<button type=\"button\" class=\"ds-btn " + inlineFill + " ds-btn--xs\">" + esc(String(inlineLabels[ai])) + "</button>";
  }
  var closeBtn = opts.hideClose ? "" : "<button type=\"button\" class=\"ds-btn ds-btn--ghost-neutral ds-btn--xs ds-btn--icon-only\" aria-label=\"Dismiss\"><span class=\"ds-btn__icon sf\" aria-hidden=\"true\">" + ICON_XMARK + "</span></button>";
  var buttonsCluster = (inlineBtns || closeBtn)
    ? "<div class=\"ds-toast__buttons\">" + inlineBtns + closeBtn + "</div>"
    : "";

  var footerLabels = opts.footerActions || [];
  var role = (tone === "danger" || tone === "warning") ? "alert" : "status";
  var live = role === "alert" ? "assertive" : "polite";

  var rowHtml = "<div class=\"ds-toast__row\">" + iconHtml + bodyHtml + buttonsCluster + "</div>";

  if (footerLabels.length) {
    cls += " ds-toast--footer";
    var footerBtns = "";
    for (var i = 0; i < footerLabels.length; i++) {
      var lastIdx = footerLabels.length - 1;
      var btnCls = (i === lastIdx) ? "ds-btn ds-btn--solid-brand ds-btn--s" : "ds-btn ds-btn--soft-neutral ds-btn--s";
      footerBtns += "<button type=\"button\" class=\"" + btnCls + "\">" + esc(String(footerLabels[i])) + "</button>";
    }
    return "<div class=\"" + cls + "\" role=\"" + role + "\" aria-live=\"" + live + "\">"
      + rowHtml
      + "<div class=\"ds-toast__footer\">" + footerBtns + "</div>"
      + "</div>";
  }

  return "<div class=\"" + cls + "\" role=\"" + role + "\" aria-live=\"" + live + "\">"
    + rowHtml
    + "</div>";
}
