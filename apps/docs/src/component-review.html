<meta charset="utf-8">
<title>Area Component Review</title>
<!-- Area's stylesheet loads before the specimens, so none renders first with browser defaults (blue links). -->
<link rel="stylesheet" href="area.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one component family at a time, like the icon review. A top bar (filter, jump, progress),
   the family head and what changed, the specimens at 100% (After, Before, or side by side), the
   references and open questions, then the decision strip. */
:root {
  --bg: #f6f6f4; --panel: #ffffff; --fg: #18181a; --muted: #6b6b70; --line: #e3e3e0; --soft: #efefec;
  --accent: #2f5bd3; --ok: #1f8a4c; --fix: #b86e00; --swap: #7a45c4;
  --ok-bg: #e7f4ec; --fix-bg: #fbf0dc; --swap-bg: #f1eafb; --accent-bg: #e8eefc;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #050505; --panel: #0e0e0f; --fg: #ececee; --muted: #8c8c92; --line: #222225; --soft: #161618;
  --accent: #7d9cf5; --ok: #5cc98a; --fix: #e6a640; --swap: #b392f0;
  --ok-bg: #0f2418; --fix-bg: #2a1d07; --swap-bg: #1d1430; --accent-bg: #121a33; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #050505; --panel: #0e0e0f; --fg: #ececee; --muted: #8c8c92; --line: #222225; --soft: #161618;
  --accent: #7d9cf5; --ok: #5cc98a; --fix: #e6a640; --swap: #b392f0;
  --ok-bg: #0f2418; --fix-bg: #2a1d07; --swap-bg: #1d1430; --accent-bg: #121a33; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45 }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 14px }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px }
.bar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em }
.prog { flex: 1 1 240px; min-width: 0; display: grid; gap: 4px }
.prog .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex }
.prog .track i { display: block; height: 100% }
.prog .nums { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px }
/* Page chrome only: these rules are unlayered, so they must never reach a specimen (they would
   beat Area's layered component styles, e.g. a solid Button's label ink). */
:where(.wrap :is(select, button, textarea):not(.canvas *)) { font: inherit; color: inherit } /* zero specificity: .btn.primary and friends set their own ink */
.wrap select:not(.canvas *) { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100% } /* page chrome only: it outranked the Select specimen (owner 2026-10-12: overlapping chevron) */
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px }
.head .name { font: 600 24px var(--sans); letter-spacing: -0.02em; margin: 0 }
.head .meta { color: var(--muted); font-size: 13px }
.head .pos { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--soft); color: var(--muted) }
.chip.review { background: var(--accent-bg); color: var(--accent) } .chip.complete { background: var(--ok-bg); color: var(--ok) }
.chip.approve { background: var(--ok-bg); color: var(--ok) } .chip.changes { background: var(--fix-bg); color: var(--fix) } .chip.rethink { background: var(--swap-bg); color: var(--swap) }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--panel) }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
.seg button:disabled { opacity: 0.4; cursor: default }
.toolbar .lbl { font-size: 12px; color: var(--muted) }
.tiles { display: grid; gap: 12px }
/* The summary leads each family: what changed and why in plain words (the spec's Review note), then which
   variants look different from Before, which are new, and how many look the same. */
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px }
.summary .md p { margin: 2px 0; max-width: 90ch } .summary .md ul { margin: 2px 0 }
.summary .missing { color: var(--fix) }
.vlist { display: grid; gap: 4px; font-size: 13px }
.vlist b { font-weight: 600; margin-right: 6px }
.badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em }
.badge.changed { background: var(--fix-bg); color: var(--fix) } .badge.new { background: var(--accent-bg); color: var(--accent) }
.badge.same { background: var(--soft); color: var(--muted); font-weight: 500 }
.tile.is-changed { border-color: var(--fix) }
details.rest > summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 2px 10px }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid; min-width: 0 }
.tile header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px }
.tile header .t { font-weight: 500 }
.tile header .flag { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer }
.tile header .flag[aria-pressed="true"] { background: var(--fix-bg); border-color: var(--fix); color: var(--fix) }
.views { display: grid; grid-template-columns: minmax(0, 1fr) }
.views.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
@media (max-width: 760px) { .views.split { grid-template-columns: minmax(0, 1fr) } }
.view { display: grid; align-content: start; min-width: 0; border-radius: 0 0 12px 12px } /* Before and After start level, so a shift reads as a shift */
.views.split .view + .view { border-left: 1px solid var(--line) }
.view .cap { font: 11px var(--mono); color: var(--muted); padding: 6px 12px 0 }
.canvas { padding: 32px 24px; display: grid; place-items: center; overflow-x: auto; min-height: 120px; background: var(--area-bg-surface, #fff) }
.canvas > * { max-width: 100% }
.canvas[data-zoom="2"] > * { zoom: 2 } /* the specimen, not its frame, so Before and After stay level */
.view iframe { width: 100%; border: 0; display: block; min-height: 120px; background: transparent }
.none { color: var(--muted); font-size: 13px; padding: 24px; text-align: center }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px }
details.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0 }
details.panel > summary { cursor: pointer; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em }
.md { font-size: 13px; line-height: 1.5; max-width: 100%; overflow-wrap: anywhere }
.md h3, .md h4, .md h5 { font-size: 13px; margin: 14px 0 4px }
.md p, .md ul, .md ol { margin: 6px 0; max-width: 80ch } .md ul, .md ol { padding-left: 18px }
.md code { font: 12px var(--mono); background: var(--soft); border-radius: 4px; padding: 0 3px }
.md pre { background: var(--soft); border-radius: 8px; padding: 8px; overflow-x: auto }
.md .tbl { overflow-x: auto; margin: 6px 0 }
.md table { border-collapse: collapse; font-size: 12px; min-width: 100% }
.md th, .md td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top }
.md th { background: var(--soft); font-weight: 500 }
.md a { color: var(--accent) }
.decide { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; position: sticky; bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px -16px rgba(0,0,0,.25) }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr } }
.opt { border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; text-align: left; cursor: pointer; display: grid; gap: 1px }
.opt b { font-weight: 600 } .opt span { font-size: 12px; color: var(--muted) }
.opt kbd { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; justify-self: start }
.opt[aria-pressed="true"].approve { border-color: var(--ok); background: var(--ok-bg) }
.opt[aria-pressed="true"].changes { border-color: var(--fix); background: var(--fix-bg) }
.opt[aria-pressed="true"].rethink { border-color: var(--swap); background: var(--swap-bg) }
.decide textarea { width: 100%; min-height: 56px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500 }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.btn:disabled { opacity: 0.45; cursor: default }
.status, .hint { font-size: 12px; color: var(--muted) } .status { margin-left: auto }
.flagged { font-size: 12px; color: var(--fix) }
.banner { background: var(--fix-bg); color: var(--fix); border-radius: 8px; padding: 8px 12px; font-size: 13px }
.wrap :is(button, select, textarea):not(.canvas *):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.fam[hidden] { display: none !important }
</style>

<div class="wrap">
  <div class="bar">
    <h1>Area component review</h1>
    <div class="prog" aria-label="Progress"><div class="track" id="track"></div><div class="nums" id="nums">Loading components…</div></div>
    <select id="filter" aria-label="Show">
      <option value="review">Not approved yet</option>
      <option value="changed">Changed recently</option>
      <option value="todo">Not decided</option>
      <option value="flagged">Needs changes or rethink</option>
      <option value="all">All components</option>
    </select>
    <select id="jump" aria-label="Jump to component"></select>
  </div>
  <div id="banner" class="banner" hidden></div>

  <div class="head">
    <h2 class="name" id="name">…</h2>
    <span id="state"></span>
    <span id="decision"></span>
    <span class="meta" id="meta"></span>
    <span class="pos" id="pos"></span>
  </div>

  <section class="summary" aria-label="What changed">
    <div class="md" id="note"></div>
    <div class="vlist" id="vlist"></div>
  </section>

  <div class="toolbar">
    <span class="lbl">View</span>
    <div class="seg" id="viewseg" role="group" aria-label="View"><button data-v="after">After</button><button data-v="before">Before</button><button data-v="split">Side by side</button></div>
    <span class="lbl">Theme</span>
    <div class="seg" id="themeseg" role="group" aria-label="Specimen theme"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
    <span class="lbl">Density</span>
    <div class="seg" id="uiseg" role="group" aria-label="Specimen density"><button data-u="default">Default</button><button data-u="compact">Compact</button></div>
    <span class="lbl">Zoom</span>
    <div class="seg" id="zoomseg" role="group" aria-label="Specimen zoom"><button data-z="1">1×</button><button data-z="2">2×</button></div>
    <span class="hint" id="beforehint"></span>
  </div>

  <div id="families"></div>

  <div class="notes">
    <details class="panel" id="p-changes"><summary>Details from the spec</summary><div class="md" id="changes"></div></details>
    <details class="panel" id="p-questions" open><summary>Open questions</summary><div class="md" id="questions"></div></details>
    <details class="panel" id="p-refs"><summary>References and measurements</summary><div class="md" id="refs"></div></details>
  </div>

  <section class="decide" aria-label="Decision">
    <div class="opts" id="opts">
      <button class="opt approve" data-o="approve"><kbd>1</kbd><b>Approve</b><span>Right as it is</span></button>
      <button class="opt changes" data-o="changes"><kbd>2</kbd><b>Needs changes</b><span>Flag variants, say what</span></button>
      <button class="opt rethink" data-o="rethink"><kbd>3</kbd><b>Rethink</b><span>The direction is wrong</span></button>
    </div>
    <span class="flagged" id="flagged"></span>
    <label class="hint" for="notes">Your directions (optional)</label>
    <textarea id="notes" placeholder="e.g. the divided rows still feel loose; match Google's 52 at md"></textarea>
    <div class="actions">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn primary" id="save">Save &amp; next ↵</button>
      <button class="btn" id="next">Skip →</button>
      <button class="btn" id="clear">Clear decision</button>
      <button class="btn" id="copy">Copy decisions</button>
      <span class="status" id="status"></span>
    </div>
    <p class="hint">Keys: 1–3 choose · ← → move · Enter saves and moves on (⌘/Ctrl+Enter inside the notes box).</p>
  </section>
</div>

<script src="data.js"></script>
<script>
/* Builds every family's specimens into the page before the demo bundles load, so each bundle finds
   and hydrates its specimens (they look for data-*-demo elements once, on load). */
const FAMILIES = window.FAMILIES || [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// One collection per review round, so a family reopened after approval starts undecided (round 6: 2026-10-10).
const ROUND = "components20", KEY = "area-component-review-20";
const pref = (k, d) => { try { return localStorage.getItem("area-cr-" + k) || d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem("area-cr-" + k, v); } catch {} };
// Side by side by default (owner 2026-10-09: "be more explicit about the before and after"); only changed
// variants get a Before column.
let view = pref("view2", "split"), theme = pref("theme", "light"), ui = pref("ui", "default");
// 2× makes a subtle change (an underline's ink, a 2px inset) visible without a screenshot.
let zoom = pref("zoom", "1");
let store = {}, col = null, order = [], at = 0, draft = null, beforeCss = null;
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const HAS_BEFORE = FAMILIES.some(f => f.tiles.some(t => t.before));
const BEFORE = window.REVIEW?.before || "the earlier build";

/* A specimen's change, measured by rendering it in both builds (scripts/review-diff.mjs): changed, new or unchanged,
   and for a change seen only in some modes, which. Changed variants come first; unchanged ones fold away. */
const state = t => t.change?.state ?? (t.before == null ? "new" : "unknown");
const where = t => t.change?.modes?.length && t.change.modes.length < 4 ? " in " + t.change.modes.join(", ") : "";
const badge = t => ({ changed: `<span class="badge changed">Changed${esc(where(t))}</span>`, new: '<span class="badge new">New</span>', unchanged: '<span class="badge same">Unchanged</span>' })[state(t)] ?? "";
const RANK = { changed: 0, new: 1, unknown: 2, unchanged: 3 };
const tileHtml = t => `
  <article class="tile${state(t) === "changed" ? " is-changed" : ""}" data-tile="${t.id}">
    <header><span class="t">${esc(t.label)}</span>${badge(t)}<button class="flag" data-flag="${t.id}" aria-pressed="false">Flag</button></header>
    <div class="views"><div class="view after"><div class="cap">After</div><div class="canvas area-scope" data-area-theme="light" data-area-ui="default">${t.html}</div></div></div>
  </article>`;
$("families").innerHTML = FAMILIES.map(f => {
  const tiles = [...f.tiles].sort((a, b) => RANK[state(a)] - RANK[state(b)]);
  const shown = tiles.filter(t => state(t) !== "unchanged"), same = tiles.filter(t => state(t) === "unchanged");
  return `<section class="fam" data-slug="${f.slug}" hidden><div class="tiles">${shown.map(tileHtml).join("")}</div>${same.length ? `<details class="rest"${shown.length ? "" : " open"}><summary>${same.length} variant${same.length === 1 ? "" : "s"} unchanged, for context</summary><div class="tiles">${same.map(tileHtml).join("")}</div></details>` : ""}</section>`;
}).join("");
</script>
<!--CLIENTS-->
<script>
const loadBefore = () => beforeCss ?? (beforeCss = fetch("area-before.css").then(r => r.ok ? r.text() : "").catch(() => ""));

const fam = () => FAMILIES[order[at]];
function applyFilter(keep) {
  const f = $("filter").value, was = order[at];
  order = FAMILIES.map((_, i) => i).filter(i => { const x = FAMILIES[i], v = store[x.slug]?.verdict;
    return f === "all" || (f === "changed" && x.changed) || (f === "review" && x.status !== "complete") || (f === "todo" && !v) || (f === "flagged" && (v === "changes" || v === "rethink")); });
  if (!order.length) order = FAMILIES.map((_, i) => i);
  at = keep && order.includes(was) ? order.indexOf(was) : Math.min(at, order.length - 1);
}
const STATUS = { complete: "Complete", review: "In review", unrefined: "Not approved" };
const VERDICT = { approve: "Approved", changes: "Needs changes", rethink: "Rethink" };
function chip(r) { return r?.verdict ? `<span class="chip ${r.verdict}">${VERDICT[r.verdict]}</span>` : ""; }

async function paintBefore(section) {
  const css = await loadBefore();
  section.querySelectorAll(".tile").forEach(tile => {
    const t = fam().tiles.find(x => x.id === tile.dataset.tile), views = tile.querySelector(".views");
    if (!["changed", "unknown"].includes(state(t))) return; // nothing to compare: new, or looks the same
    let b = views.querySelector(".view.before");
    if (!b) { b = document.createElement("div"); b.className = "view before"; b.innerHTML = `<div class="cap">Before · ${esc(BEFORE)}</div>`; views.prepend(b); }
    b.querySelector("iframe, .none")?.remove();
    if (!t.before) { b.insertAdjacentHTML("beforeend", '<p class="none">New in this pass: nothing to compare.</p>'); return; }
    const frame = document.createElement("iframe");
    frame.title = t.label + " before";
    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><base href="${esc(location.href)}"><style>${css}</style><style>html,body{margin:0;background:transparent}body{display:grid;place-items:center;min-height:120px}.c{padding:32px 24px;display:grid;place-items:center;width:100%;box-sizing:border-box;background:var(--area-bg-surface)}.c[data-zoom="2"]>*{zoom:2}</style></head><body><div class="c" data-zoom="${zoom}" data-area-theme="${theme}" data-area-ui="${ui}">${t.before}</div></body></html>`;
    frame.onload = () => { try { frame.style.height = frame.contentDocument.documentElement.scrollHeight + "px"; } catch {} };
    b.append(frame);
  });
}
function paintView() {
  document.querySelectorAll("#viewseg button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.v === view); b.disabled = !HAS_BEFORE && b.dataset.v !== "after"; });
  document.querySelectorAll("#themeseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === theme));
  document.querySelectorAll("#uiseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.u === ui));
  $("beforehint").textContent = HAS_BEFORE ? `Before is ${BEFORE} (static); only changed variants show it.` : "";
  document.querySelectorAll("#zoomseg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.z === zoom));
  document.querySelectorAll(".canvas.area-scope").forEach(c => { c.dataset.areaTheme = theme; c.dataset.areaUi = ui; c.dataset.zoom = zoom; });
  const section = document.querySelector(`.fam[data-slug="${fam().slug}"]`);
  section.querySelectorAll(".views").forEach(v => {
    const compared = ["changed", "unknown"].includes(state(fam().tiles.find(x => x.id === v.closest(".tile").dataset.tile)));
    v.classList.toggle("split", compared && view === "split");
    v.querySelector(".view.after").hidden = compared && view === "before";
    const b = v.querySelector(".view.before"); if (b) b.hidden = view === "after";
  });
  if (view !== "after" && HAS_BEFORE) paintBefore(section);
}
function render() {
  const f = fam(); if (!f) return;
  document.querySelectorAll(".fam").forEach(s => s.hidden = s.dataset.slug !== f.slug);
  $("name").textContent = f.name;
  $("state").innerHTML = `<span class="chip ${f.status}">${STATUS[f.status]}</span>`;
  $("decision").innerHTML = chip(store[f.slug]);
  $("meta").textContent = `${f.tiles.length} specimen${f.tiles.length === 1 ? "" : "s"}`;
  $("pos").textContent = `${at + 1} / ${order.length}`;
  $("note").innerHTML = f.summary || '<p class="missing">No review note in this spec yet: see "Details from the spec".</p>';
  const by = st => f.tiles.filter(t => state(t) === st);
  const names = list => list.map(t => esc(t.label) + (where(t) ? ` <span class="hint">(${esc(where(t).trim())})</span>` : "")).join(", ");
  $("vlist").innerHTML = [
    by("changed").length ? `<div><span class="badge changed">Changed</span> ${by("changed").length}: ${names(by("changed"))}</div>` : "",
    by("new").length ? `<div><span class="badge new">New</span> ${by("new").length}: ${names(by("new"))}</div>` : "",
    by("unchanged").length ? `<div><span class="badge same">Unchanged</span> ${by("unchanged").length} variant${by("unchanged").length === 1 ? "" : "s"} look the same as Before in light, dark, default and compact</div>` : "",
    !HAS_BEFORE ? '<div class="hint">No Before build was given, so every variant counts as new.</div>' : "",
  ].join("");
  $("changes").innerHTML = f.changes || f.log || '<p>No dated changes in this component\'s spec.</p>';
  $("questions").innerHTML = f.questions || "<p>None recorded.</p>";
  $("refs").innerHTML = f.refs || "<p>No sources table in this component's spec.</p>";
  const r = store[f.slug];
  draft = { verdict: r?.verdict || null, flagged: [...(r?.flagged || [])], notes: r?.notes || "" };
  $("notes").value = draft.notes;
  paintDecision(); paintView(); progress();
  $("prev").disabled = at === 0;
}
function paintDecision() {
  document.querySelectorAll("#opts .opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.o === draft.verdict));
  document.querySelectorAll(`.fam[data-slug="${fam().slug}"] .flag`).forEach(b => b.setAttribute("aria-pressed", draft.flagged.includes(b.dataset.flag)));
  const labels = draft.flagged.map(id => fam().tiles.find(t => t.id === id)?.label).filter(Boolean);
  $("flagged").textContent = labels.length ? "Flagged: " + labels.join(", ") : "";
}
function progress() {
  const pool = FAMILIES.filter(f => $("filter").value === "all" ? true : order.includes(FAMILIES.indexOf(f))), n = pool.length || 1, c = { approve: 0, changes: 0, rethink: 0 };
  pool.forEach(f => { const v = store[f.slug]?.verdict; if (v) c[v]++; });
  $("track").innerHTML = [["approve", "var(--ok)"], ["changes", "var(--fix)"], ["rethink", "var(--swap)"]].map(([k, col]) => `<i style="width:${(c[k] / n) * 100}%;background:${col}"></i>`).join("");
  $("nums").innerHTML = `<span>${c.approve + c.changes + c.rethink} / ${pool.length} decided</span><span><i class="dot" style="background:var(--ok)"></i>${c.approve} approved</span><span><i class="dot" style="background:var(--fix)"></i>${c.changes} need changes</span><span><i class="dot" style="background:var(--swap)"></i>${c.rethink} rethink</span>`;
}
function buildJump() {
  $("jump").innerHTML = '<option value="">Jump to…</option>' + FAMILIES.map((f, i) => `<option value="${i}">${esc(f.name)}${f.changed ? " ·" : ""}</option>`).join("");
  $("jump").onchange = () => { const v = $("jump").value; if (v !== "") { if (!order.includes(+v)) { $("filter").value = "all"; applyFilter(); } at = order.indexOf(+v); render(); scrollTo({ top: 0 }); } $("jump").value = ""; };
}
async function save(advance) {
  const f = fam(); draft.notes = $("notes").value.trim();
  if (!draft.verdict && !draft.notes && !draft.flagged.length) { if (advance) go(at + 1); return; }
  const body = { verdict: draft.verdict || "changes", flagged: draft.flagged, flaggedLabels: draft.flagged.map(id => f.tiles.find(t => t.id === id)?.label), notes: draft.notes, name: f.name, at: new Date().toISOString() };
  store[f.slug] = body; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
  $("status").textContent = "Saving…";
  if (col) { try { await col.doc(f.slug).set(body); $("status").textContent = "Saved " + f.name; } catch (e) { $("status").textContent = "Saved on this device only (" + (e && e.code || "error") + ")"; } }
  else $("status").textContent = "Saved on this device";
  if (advance) go(at + 1); else render();
}
async function clearOne() {
  const f = fam(); delete store[f.slug]; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
  if (col) { try { await col.doc(f.slug).delete(); } catch {} }
  $("status").textContent = "Cleared " + f.name; render();
}
function go(i) { if ($("filter").value !== "all") applyFilter(true); at = Math.max(0, Math.min(order.length - 1, i)); render(); scrollTo({ top: 0 }); }
function choose(o) { draft.verdict = draft.verdict === o ? null : o; paintDecision(); }

document.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => choose(b.dataset.o));
$("families").addEventListener("click", e => { const b = e.target.closest(".flag"); if (!b) return; const id = b.dataset.flag;
  draft.flagged = draft.flagged.includes(id) ? draft.flagged.filter(x => x !== id) : [...draft.flagged, id];
  if (draft.flagged.length && !draft.verdict) draft.verdict = "changes"; paintDecision(); });
document.querySelectorAll("#viewseg button").forEach(b => b.onclick = () => { view = b.dataset.v; setPref("view2", view); paintView(); });
document.querySelectorAll("#themeseg button").forEach(b => b.onclick = () => { theme = b.dataset.t; setPref("theme", theme); paintView(); });
document.querySelectorAll("#uiseg button").forEach(b => b.onclick = () => { ui = b.dataset.u; setPref("ui", ui); paintView(); });
document.querySelectorAll("#zoomseg button").forEach(b => b.onclick = () => { zoom = b.dataset.z; setPref("zoom", zoom); paintView(); });
$("copy").onclick = async () => {
  const text = JSON.stringify(store, null, 2);
  try { await navigator.clipboard.writeText(text); $("status").textContent = `Copied ${Object.keys(store).length} decisions`; }
  catch { $("notes").value = text; $("notes").select(); $("status").textContent = "Copy the decisions from the notes box"; }
};
$("save").onclick = () => save(true); $("next").onclick = () => go(at + 1); $("prev").onclick = () => go(at - 1); $("clear").onclick = clearOne;
$("filter").onchange = () => { setPref("filter2", $("filter").value); applyFilter(); render(); };
document.addEventListener("keydown", e => {
  if (e.target.closest(".canvas")) return;
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(true); } return; }
  if (e.target.tagName === "SELECT") return;
  const map = { 1: "approve", 2: "changes", 3: "rethink" };
  if (map[e.key]) choose(map[e.key]);
  else if (e.key === "ArrowRight") go(at + 1); else if (e.key === "ArrowLeft") go(at - 1);
  else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); save(true); }
});

if (!FAMILIES.length) $("nums").textContent = "The component data did not load.";
else {
  $("filter").value = pref("filter2", "review"); applyFilter(); buildJump();
  const hash = location.hash.slice(1), i = FAMILIES.findIndex(f => f.slug === hash);
  if (i >= 0) { if (!order.includes(i)) { $("filter").value = "all"; applyFilter(); } at = order.indexOf(i); }
  render();
}
(async () => {
  let db = null;
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { $("banner").hidden = false; $("banner").textContent = "Claude can't read decisions from this view: they're kept in this browser only. Open the page on claude.ai in a browser, signed in, and they'll sync; or use Copy decisions and paste them to Claude."; return; }
  col = db.collection(ROUND); let first = true;
  $("status").textContent = "Connected: decisions sync to Claude";
  col.limit(1000).onSnapshot(snap => {
    const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
    if (first) { first = false; let pushed = 0; for (const [k, v] of Object.entries(store)) if (!remote[k] || (remote[k].at || "") < (v.at || "")) { pushed++; col.doc(k).set(v).catch(() => { $("banner").hidden = false; $("banner").textContent = "Some decisions could not sync; use Copy decisions and paste them to Claude."; }); }
      if (pushed) $("status").textContent = `Synced ${pushed} decision${pushed === 1 ? "" : "s"} saved earlier in this browser`; }
    store = { ...store, ...remote }; try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
    progress(); const f = fam(); if (f) $("decision").innerHTML = chip(store[f.slug]);
  }, () => { $("banner").hidden = false; $("banner").textContent = "Lost the connection to saved decisions; new ones are kept on this device."; });
})();
</script>
