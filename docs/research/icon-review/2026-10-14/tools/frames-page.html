<title>Icon Pixel Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; each batch is a section of family groups; each icon a tile with 1x before / after and the new drawing at 16 and 32. */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --ink: #161616; --muted: #6b6b68; --line: #e6e6e3;
  --accent: #2b59c3; --accent-ink: #ffffff; --flag: #b4401d; --good: #1f7a46; --pix-bg: #ffffff;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #050505; --surface: #0e0e0e; --ink: #ededeb; --muted: #9a9a96; --line: #232322;
  --accent: #7d9cf0; --accent-ink: #050505; --flag: #f08a63; --good: #5cc28a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #050505; --surface: #0e0e0e; --ink: #ededeb; --muted: #9a9a96; --line: #232322;
  --accent: #7d9cf0; --accent-ink: #050505; --flag: #f08a63; --good: #5cc28a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.page { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; display: grid; gap: 28px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
h3 { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
p { margin: 0; max-width: 72ch; }
.lede { color: var(--muted); }
.decided { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.decided b { color: var(--good); font-weight: 500; }
section.batch { display: grid; gap: 16px; }
.bhead { display: grid; gap: 6px; }
.fam { display: grid; gap: 8px; }
.fam > .ftitle { font: 500 12px var(--mono); color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.tile.flagged { border-color: var(--flag); box-shadow: inset 0 0 0 1px var(--flag); }
.tile .name { font: 500 12.5px var(--mono); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 6px; align-items: baseline; min-width: 0; }
.tile .shift { font: 400 11px var(--sans); color: var(--muted); }
.pair { display: flex; gap: 6px; align-items: end; }
.pair figure { margin: 0; display: grid; gap: 3px; }
.pair figcaption { font-size: 11px; color: var(--muted); }
.cell { width: 64px; height: 64px; background-color: var(--pix-bg); background-repeat: no-repeat; background-size: 80px auto; image-rendering: pixelated; outline: 1px solid var(--line); border-radius: 3px; }
.now { display: flex; gap: 10px; align-items: center; color: var(--ink); }
.now svg { display: block; }
.flagbtn { font: 500 12px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; justify-self: start; }
.flagbtn[aria-pressed="true"] { color: var(--flag); border-color: var(--flag); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.bar button.v { font: 500 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
.bar button.v[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
textarea { width: 100%; box-sizing: border-box; min-height: 56px; font: 13px/1.45 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; resize: vertical; }
.banner { font-size: 13px; color: var(--flag); }
footer { color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }
</style>

<main class="page">
  <header style="display:grid;gap:10px">
    <h1>Icon pixel pass</h1>
    <p class="lede" id="lede"></p>
    <div class="decided" id="decided"></div>
    <p class="banner" id="dbstate" hidden>This view can't save to the page. Your choices are kept in this browser; use Copy verdicts and paste them in chat.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" id="copyv" class="flagbtn" style="color:var(--ink)">Copy verdicts</button><span class="status" id="copyst" style="margin-left:0"></span></div>
    <textarea id="copytext" aria-label="Verdicts as text" readonly hidden></textarea>
  </header>
  <div id="batches" style="display:grid;gap:36px"></div>
  <footer id="foot"></footer>
</main>

<script>
const DATA = __DATA__;   // { batches: [{ id, title, note, families: [{ name, icons: [{ name, shift, row, svg16, svg32 }] }] }], foot }
const STRIP_BEFORE = "__STRIP_BEFORE__", STRIP_AFTER = "__STRIP_AFTER__";
let seq = 0;
const uniq = s => { const n = "q" + (seq++); return s.replaceAll("area-icon-R0", "area-icon-" + n); };
const cell = (strip, row, label) => `<figure><div class="cell" role="img" aria-label="${label}" style="background-image:url(${strip});background-position:0 -${row * 80}px"></div><figcaption>${label.split(",")[0]}</figcaption></figure>`;
document.getElementById("batches").innerHTML = DATA.batches.map(b => `
  <section class="batch" id="${b.id}">
    <div class="bhead"><h3>${b.kicker}</h3><h2>${b.title}</h2><p class="lede">${b.note}</p></div>
    ${b.families.map(f => `<div class="fam"><div class="ftitle">${f.name}</div><div class="tiles">${f.icons.map(i => `
      <div class="tile" data-batch="${b.id}" data-icon="${i.name}">
        <div class="name"><span>${i.name}</span><span class="shift">${i.shift}</span></div>
        <div class="pair">${i.same ? cell(STRIP_AFTER, i.row, "Now, 1× pixels") : cell(STRIP_BEFORE, i.row, "Before, 1× pixels") + cell(STRIP_AFTER, i.row, "After, 1× pixels")}</div>
        <div class="now" aria-label="${i.name} after, at 16 and 32">${uniq(i.svg16)}${uniq(i.svg32)}${i.f16 ? uniq(i.f16) : ""}</div>
        <button type="button" class="flagbtn" aria-pressed="false">Flag</button>
      </div>`).join("")}</div></div>`).join("")}
    ${b.extra || ""}
    <div class="bar" data-batch="${b.id}">
      ${(b.options || [["approve", "Approve batch, except flagged"], ["hold", "Hold the batch"]]).map(([v, l]) => `<button type="button" class="v" data-v="${v}" aria-pressed="false">${l}</button>`).join("")}
      <span class="status" id="st-${b.id}" aria-live="polite"></span>
      <textarea id="note-${b.id}" placeholder="Note (optional): what to change on flagged icons, or why" aria-label="Note for ${b.title}"></textarea>
    </div>
  </section>`).join("");
document.getElementById("foot").innerHTML = DATA.foot;
document.getElementById("lede").innerHTML = DATA.lede;
document.getElementById("decided").innerHTML = DATA.decided;

const state = Object.fromEntries(DATA.batches.map(b => [b.id, { verdict: null, flagged: [], note: "" }]));
const paint = id => {
  const s = state[id];
  document.querySelectorAll(`.bar[data-batch="${id}"] button.v`).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === s.verdict)));
  document.querySelectorAll(`.tile[data-batch="${id}"]`).forEach(t => { const on = s.flagged.includes(t.dataset.icon);
    t.classList.toggle("flagged", on); const fb = t.querySelector(".flagbtn"); fb.setAttribute("aria-pressed", String(on)); fb.textContent = on ? "Flagged" : "Flag"; });
  const ta = document.getElementById("note-" + id); if (document.activeElement !== ta) ta.value = s.note || "";
};
const say = (id, m) => { document.getElementById("st-" + id).textContent = m; };

const KEY = "icon-pixel-pass-" + DATA.round;
const local = { load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } },
  save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} } };
for (const [id, v] of Object.entries(local.load())) if (state[id]) state[id] = { verdict: v.verdict ?? null, flagged: v.flagged ?? [], note: v.note ?? "" };
Object.keys(state).forEach(paint);
let col = null;
const save = async id => { local.save();
  if (!col) { say(id, "Kept in this browser"); return; }
  say(id, "Saving…");
  try { await col.doc(id).set({ ...state[id], at: new Date().toISOString() }); say(id, "Saved"); }
  catch (e) { say(id, "Not saved (" + (e?.code || "error") + "); kept in this browser"); } };
const summary = () => DATA.batches.map(b => { const s = state[b.id];
  return `${b.id}: ${s.verdict || "no verdict"}${s.flagged.length ? "; flagged " + s.flagged.join(", ") : ""}${s.note ? "; note: " + s.note : ""}`; }).join("\n");
document.getElementById("copyv").addEventListener("click", () => {
  const text = summary(), ta = document.getElementById("copytext"), st = document.getElementById("copyst");
  ta.value = text; ta.hidden = false;
  navigator.clipboard?.writeText(text).then(() => { st.textContent = "Copied"; }, () => { ta.select(); st.textContent = "Select and copy the text below"; })
    ?? (ta.select(), st.textContent = "Select and copy the text below");
});
document.addEventListener("click", e => {
  const fb = e.target.closest(".flagbtn:not(#copyv)");
  if (fb) { const t = fb.closest(".tile"), id = t.dataset.batch, s = state[id], n = t.dataset.icon;
    s.flagged = s.flagged.includes(n) ? s.flagged.filter(x => x !== n) : [...s.flagged, n]; paint(id); save(id); return; }
  const v = e.target.closest(".bar button.v");
  if (v) { const id = v.closest(".bar").dataset.batch; state[id].verdict = state[id].verdict === v.dataset.v ? null : v.dataset.v; paint(id); save(id); }
});
document.addEventListener("change", e => { if (e.target.matches(".bar textarea")) { const id = e.target.closest(".bar").dataset.batch; state[id].note = e.target.value.trim(); save(id); } });
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { document.getElementById("dbstate").hidden = false; return; }
  col = db.collection(DATA.collection);
  col.onSnapshot(snap => { for (const d of snap.docs) if (state[d.id] && d.exists) { const v = d.data();
    state[d.id] = { verdict: v.verdict ?? null, flagged: Array.isArray(v.flagged) ? v.flagged : [], note: v.note ?? "" }; paint(d.id); }
    // choices made before the store answered (kept locally) are written once
  }, () => { document.getElementById("dbstate").hidden = false; col = null; });
  for (const id of Object.keys(state)) if (state[id].verdict || state[id].flagged.length || state[id].note) save(id);
})();
</script>
